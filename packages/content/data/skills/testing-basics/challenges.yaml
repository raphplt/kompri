- id: testing-basics-sans-ia
  family: SANS_IA
  title: Le tarif du cinéma
  summary: Écrire, à partir d’une règle métier, une suite de tests qui trouve les erreurs d’une fonction de tarification.
  estimatedMinutes: 55
  instructions: |
    Un cinéma de quartier calcule le prix des places avec la fonction ci-dessous, livrée
    sans tests. Tu travailles seul, sans IA. Ton rôle : écrire une suite de tests à partir
    de la **règle**, découvrir si la fonction la respecte, puis la corriger.

    Règle tarifaire (prix en centimes) :

    - moins de 4 ans : gratuit (0) ;
    - de 4 à 11 ans : 600 ;
    - de 12 à 25 ans inclus : 800 ;
    - de 26 à 64 ans : 1200, ou 800 sur présentation d’une carte étudiant ;
    - 65 ans et plus : 900 (la carte étudiant ne change rien à ce tarif) ;
    - l’âge doit être un entier de 0 à 120 ; sinon, la fonction lève une `RangeError`.

    `src/ticket-price.js` :

    ```js
    // ticket-price.js — prix d'une place de cinéma, en centimes
    export function ticketPrice(age, isStudent = false) {
      if (!Number.isInteger(age) || age < 0 || age > 120) {
        throw new RangeError(`Âge invalide : ${age}`);
      }
      if (age < 4) {
        return 0;
      }
      if (age < 12) {
        return 600;
      }
      if (age < 25 || isStudent) {
        return 800;
      }
      if (age > 65) {
        return 900;
      }
      return 1200;
    }
    ```

    Le `package.json` du projet contient `"type": "module"` et le script
    `"test": "node --test"`.

    Travail demandé :

    1. Avant d’écrire du code, liste les classes d’équivalence et les valeurs limites que
       tu vas tester, en partant de la règle.
    2. Écris `test/ticket-price.test.js` avec `node:test` et `node:assert/strict` : cas
       nominaux, valeurs limites, combinaisons avec la carte étudiant et entrées invalides.
       Utilise des tests en tableau pour éviter les répétitions ; chaque nom de test doit
       dire ce qu’il vérifie.
    3. Lance la suite **sur la fonction telle quelle** et copie le résumé.
    4. Corrige la fonction en modifiant le moins de lignes possible, relance toute la
       suite et copie le résumé.
  deliverable: |
    Colle ta liste de classes et de limites, ton fichier de test complet, la sortie de
    `npm test` avant correction (au moins la liste des tests et le résumé), la fonction
    corrigée et la sortie après correction. Ajoute deux ou trois phrases : quels tests ont
    révélé des erreurs, et pourquoi des tests sur les seuls cas nominaux ne les auraient pas
    vues.
  rubric:
    passRatio: 0.7
    criteria:
      - id: test-cases
        description: Choisit les cas à partir de la règle (nominal, limites, erreurs, combinaisons) et sait les justifier.
        maxScore: 3
        levels:
          - score: 0
            description: Ne teste que quelques cas nominaux.
          - score: 1
            description: Teste quelques limites sans méthode, ou reprend les seuils du code.
          - score: 2
            description: Couvre chaque frontière de part et d’autre et les entrées invalides, en expliquant la méthode.
          - score: 3
            description: Pense aussi aux combinaisons (senior avec carte) et explique pourquoi elles sont nécessaires.
      - id: node-test-usage
        description: Utilise correctement node:test, assert/strict et les tests en tableau.
        maxScore: 3
        levels:
          - score: 0
            description: Tests qui ne s’exécutent pas, ou sans assertion.
          - score: 1
            description: Tests fonctionnels mais répétitifs, noms vagues ou assert non strict.
          - score: 2
            description: Tests en tableau lisibles, assertions adaptées, throws avec fonction et type d’erreur.
          - score: 3
            description: Explique le rapport de node --test et sait isoler un test avec un motif de nom.
      - id: bug-fixing
        description: Corrige les défauts révélés de façon minimale et vérifie l’absence de régression.
        maxScore: 2
        levels:
          - score: 0
            description: Ne corrige pas, ou modifie les tests pour qu’ils passent.
          - score: 1
            description: Corrige une partie des défauts, ou sans relancer toute la suite.
          - score: 2
            description: Corrige les trois défauts avec des changements ciblés et montre la suite complète au vert.
      - id: explanation
        description: Explique à l’oral pourquoi les tests nominaux ne suffisaient pas.
        maxScore: 2
        levels:
          - score: 0
            description: Ne sait pas expliquer ce qui distingue ses tests utiles.
          - score: 1
            description: Cite les limites sans relier chaque défaut au test qui l’a révélé.
          - score: 2
            description: Relie chaque défaut à son test et à sa cause (opérateur de comparaison, ordre des conditions).

- id: testing-basics-avec-ia
  family: AVEC_IA
  title: Les tests de l’API des tâches
  summary: Écrire avec une IA les tests unitaires et d’intégration d’une petite API HTTP, et défendre chaque test.
  estimatedMinutes: 100
  instructions: |
    Une petite API de gestion de tâches, écrite avec le module `node:http`, n’a aucun test.
    Tu peux utiliser une IA autant que tu veux pour les écrire ; à l’oral, tu devras
    expliquer chaque test, dire ce qu’il protège et en écrire un nouveau en direct.

    Spécification de l’API :

    - `GET /tasks` renvoie 200 et la liste des tâches ;
    - `GET /tasks/:id` renvoie 200 et la tâche, ou 404 si elle n’existe pas ;
    - `POST /tasks` avec un corps JSON `{ "title": "…" }` crée une tâche
      `{ id, title, done: false }` et renvoie 201. Le titre est obligatoire, les espaces
      autour sont retirés, il compte de 1 à 100 caractères après retrait des espaces ; sinon
      400 avec `{ "error": "…" }`. Un corps qui n’est pas du JSON valide renvoie aussi 400 ;
    - toute autre route renvoie 404.

    `package.json` :

    ```json
    {
      "name": "taches-api",
      "private": true,
      "type": "module",
      "scripts": {
        "start": "node src/server.js"
      }
    }
    ```

    `src/validate-task.js` :

    ```js
    // validate-task.js — renvoie un message d'erreur, ou null si la tâche est valide
    export function validateTask(body) {
      if (typeof body !== 'object' || body === null) {
        return 'Le corps doit être un objet JSON';
      }
      if (typeof body.title !== 'string' || body.title.length === 0) {
        return 'Le titre est obligatoire';
      }
      if (body.title.length > 100) {
        return 'Le titre ne doit pas dépasser 100 caractères';
      }
      return null;
    }
    ```

    `src/app.js` :

    ```js
    // app.js — API de gestion de tâches, en mémoire
    import http from 'node:http';
    import { validateTask } from './validate-task.js';

    function sendJson(response, status, data) {
      response.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8' });
      response.end(JSON.stringify(data));
    }

    async function readBody(request) {
      let body = '';
      for await (const chunk of request) {
        body += chunk;
      }
      return body;
    }

    export function createApp({ tasks = [] } = {}) {
      let nextId = tasks.length + 1;

      return http.createServer(async (request, response) => {
        try {
          const url = new URL(request.url, 'http://localhost');

          if (request.method === 'GET' && url.pathname === '/tasks') {
            sendJson(response, 200, tasks);
            return;
          }

          if (request.method === 'POST' && url.pathname === '/tasks') {
            const body = JSON.parse(await readBody(request));
            const error = validateTask(body);
            if (error) {
              sendJson(response, 400, { error });
              return;
            }
            const task = { id: nextId, title: body.title.trim(), done: false };
            nextId += 1;
            tasks.push(task);
            sendJson(response, 201, task);
            return;
          }

          const match = /^\/tasks\/(\d+)$/.exec(url.pathname);
          if (request.method === 'GET' && match) {
            const task = tasks.find((item) => item.id === Number(match[1]));
            if (task) {
              sendJson(response, 200, task);
            } else {
              sendJson(response, 404, { error: 'Tâche introuvable' });
            }
            return;
          }

          sendJson(response, 404, { error: 'Ressource introuvable' });
        } catch {
          sendJson(response, 500, { error: 'Erreur interne' });
        }
      });
    }
    ```

    `src/server.js` :

    ```js
    // server.js — démarre l'API
    import { createApp } from './app.js';

    const port = Number(process.env.PORT ?? 3000);
    createApp().listen(port, () => {
      console.log(`API des tâches sur http://localhost:${port}`);
    });
    ```

    Travail demandé :

    1. Des tests **unitaires** de `validateTask`.
    2. Des tests **d’intégration** de chaque route, sur un vrai serveur démarré par les
       tests, qui vérifient statut, en-tête `Content-Type` et corps. Les tests doivent être
       indépendants les uns des autres et pouvoir s’exécuter dans n’importe quel ordre.
    3. Des scripts npm `test`, `test:watch` et `test:coverage`.
    4. Si tes tests révèlent des écarts entre le code et la spécification, garde les tests
       qui le prouvent, puis corrige le code.
  deliverable: |
    Colle tes fichiers de test, le `package.json` modifié, la sortie de `npm test` avant et
    après tes corrections éventuelles, les corrections apportées au code, et le rapport de
    couverture final. Termine par quelques lignes : ce que l’IA a bien fait, ce que tu as dû
    corriger dans ses tests, et comment tu t’es assuré que chaque test peut échouer.
  rubric:
    passRatio: 0.7
    criteria:
      - id: test-ownership
        description: Explique chaque test, ce qu’il protège et comment il a été vu en échec.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des tests importants de sa propre suite.
          - score: 1
            description: Explique ce que font les tests mais pas ce qu’ils protègent.
          - score: 2
            description: Relie chaque test à une règle de la spécification et sait montrer qu’il peut échouer.
          - score: 3
            description: Explique aussi les tests proposés par l’IA qu’il a écartés ou corrigés, avec la raison.
      - id: http-integration
        description: Teste les routes sur un vrai serveur de façon fiable et isolée.
        maxScore: 3
        levels:
          - score: 0
            description: Port fixe, serveur non fermé ou tests dépendants de l’ordre.
          - score: 1
            description: Tests qui fonctionnent mais isolation ou attente de l’écoute non maîtrisées.
          - score: 2
            description: Port 0, attente de listening, fermeture, données neuves par test, statut et corps vérifiés.
          - score: 3
            description: Explique le piège du tableau partagé et distingue clairement tests unitaires et d’intégration.
      - id: spec-gaps
        description: Trouve les écarts avec la spécification grâce aux tests et les corrige.
        maxScore: 2
        levels:
          - score: 0
            description: Aucun écart trouvé, ou tests qui valident le comportement fautif.
          - score: 1
            description: Trouve un écart sur deux.
          - score: 2
            description: Trouve les deux écarts (espaces seuls, JSON invalide), les prouve par un test et les corrige.
      - id: live-test
        description: Écrit un nouveau test correct pendant l’oral.
        maxScore: 2
        levels:
          - score: 0
            description: Ne parvient pas à écrire le test demandé.
          - score: 1
            description: Test écrit mais incomplet (statut seul, await oublié).
          - score: 2
            description: Test correct, isolé, qui vérifie statut et corps, et qu’il sait faire échouer.

- id: testing-basics-contre-ia
  family: CONTRE_IA
  title: La suite de tests trop verte
  summary: Démontrer qu’une suite de tests générée, entièrement verte, ne protège rien, puis la réécrire pour révéler les vrais bugs.
  estimatedMinutes: 60
  instructions: |
    Une petite boutique gère son stock avec le module ci-dessous. Un assistant a généré la
    suite de tests : sept tests, tous verts. L’équipe pense donc que le module est fiable.
    Ton travail : évaluer cette suite, puis la remplacer par une suite qui protège vraiment.

    `package.json` : `"type": "module"` et `"test": "node --test"`.

    `src/inventory.js` :

    ```js
    // inventory.js — gestion du stock d'une petite boutique
    import { readFile } from 'node:fs/promises';

    export function parseStockLine(line) {
      const [sku, quantity] = line.split(';');
      return { sku: sku.trim(), quantity: quantity.trim() };
    }

    export function addStock(inventory, sku, quantity) {
      if (quantity <= 0) {
        throw new RangeError('Quantité invalide');
      }
      inventory[sku] = (inventory[sku] ?? 0) + quantity;
      return inventory;
    }

    export function removeStock(inventory, sku, quantity) {
      const current = inventory[sku] ?? 0;
      if (quantity > current) {
        throw new Error(`Stock insuffisant pour ${sku}`);
      }
      return { ...inventory, [sku]: current - quantity };
    }

    export function stockValue(inventory, prices) {
      return Object.entries(inventory).reduce((sum, [sku, quantity]) => sum + quantity * prices[sku], 0);
    }

    export async function loadInventory(file) {
      try {
        return JSON.parse(await readFile(file, 'utf8'));
      } catch {
        return {};
      }
    }
    ```

    `test/inventory.test.js`, généré :

    ```js
    import { describe, it } from 'node:test';
    import assert from 'node:assert';
    import {
      addStock,
      loadInventory,
      parseStockLine,
      removeStock,
      stockValue,
    } from '../src/inventory.js';

    describe('inventory', () => {
      const inventory = { A1: 5 };

      it('lit une ligne du fichier fournisseur', () => {
        const line = parseStockLine('A1 ; 12');
        assert.equal(line.sku, 'A1');
        assert.equal(line.quantity, 12);
      });

      it('ajoute du stock', () => {
        const result = addStock(inventory, 'A1', 3);
        assert.equal(result.A1, 8);
      });

      it('retire du stock', () => {
        const result = removeStock(inventory, 'A1', 2);
        assert.equal(result.A1, 6);
      });

      it('refuse une quantité négative', () => {
        try {
          addStock(inventory, 'A1', -1);
        } catch (error) {
          assert.equal(error.message, 'Quantité invalide');
        }
      });

      it('refuse de retirer plus que le stock disponible', () => {
        try {
          removeStock(inventory, 'A1', 100);
        } catch (error) {
          assert.ok(error);
        }
      });

      it('calcule la valeur du stock', () => {
        const value = stockValue({ A1: 3, B2: 1 }, { A1: 1.1, B2: 2.2 });
        assert.equal(value, 3 * 1.1 + 1 * 2.2);
      });

      it('charge un inventaire depuis un fichier', async () => {
        const data = await loadInventory('inventaire-test.json');
        assert.ok(data);
      });
    });
    ```

    Règles métier : une quantité est un entier strictement positif ; un ajout ou un retrait
    ne modifie jamais l’inventaire reçu (il renvoie un nouvel inventaire) ; on ne peut pas
    retirer plus que le stock ; un produit sans prix connu est une erreur ; un fichier
    d’inventaire absent signifie « inventaire vide », mais un fichier illisible ou corrompu
    est une erreur.

    Travail demandé :

    1. Pour chaque test généré, dis s’il protège réellement quelque chose ; sinon, explique
       précisément pourquoi il passerait même si le code était faux.
    2. Écris une nouvelle suite, sans modifier le module, et montre quels tests échouent.
    3. Corrige le module pour que ta suite passe, puis relance tout.
  deliverable: |
    Colle ton analyse test par test, ta nouvelle suite de tests, la sortie de `npm test`
    sur le module d’origine, le module corrigé, et la sortie finale.
  rubric:
    passRatio: 0.7
    criteria:
      - id: test-critique
        description: Explique précisément pourquoi chaque test généré ne protège pas, ou peu.
        maxScore: 3
      - id: new-suite
        description: Écrit une suite qui exprime les règles et révèle les défauts du module.
        maxScore: 3
      - id: fixes
        description: Corrige le module sans affaiblir les tests et vérifie toute la suite.
        maxScore: 2

- id: testing-basics-apres-ia
  family: APRES_IA
  title: La fidélité qui casse le premier janvier
  summary: Stabiliser une suite de tests qui dépend de la date du jour, corriger un bug de 29 février et ajouter une règle, sans régression.
  estimatedMinutes: 70
  instructions: |
    La librairie calcule les points de fidélité de ses clients. Le module et ses tests
    existent ; tu dois les faire évoluer **sans les réécrire** : toute la suite actuelle doit
    continuer à passer, sauf un test dont tu justifierais la modification.

    `package.json` : `"type": "module"`, `"private": true`, `"test": "node --test"`.

    `src/loyalty.js` :

    ```js
    // loyalty.js — points de fidélité de la librairie
    export const POINTS_PER_EURO = 1;

    export function isBirthday(birthDate, now) {
      const [, month, day] = birthDate.split('-').map(Number);
      return now.getMonth() + 1 === month && now.getDate() === day;
    }

    export function purchasePoints(amountCents, customer, now = new Date()) {
      if (!Number.isInteger(amountCents) || amountCents < 0) {
        throw new RangeError(`Montant invalide : ${amountCents}`);
      }
      let points = Math.floor(amountCents / 100) * POINTS_PER_EURO;
      if (isBirthday(customer.birthDate, now)) {
        points *= 2;
      }
      return points;
    }

    export function rewardFor(points) {
      if (points >= 500) {
        return 'bon de 15 €';
      }
      if (points >= 200) {
        return 'bon de 5 €';
      }
      return null;
    }
    ```

    `test/loyalty.test.js` :

    ```js
    import { describe, it } from 'node:test';
    import assert from 'node:assert/strict';
    import { isBirthday, purchasePoints, rewardFor } from '../src/loyalty.js';

    function todayAsBirthDate() {
      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `1990-${month}-${day}`;
    }

    describe('purchasePoints', () => {
      it('donne un point par euro entier', () => {
        assert.equal(purchasePoints(4250, { birthDate: '1990-01-01' }), 42);
      });

      it('double les points le jour de l’anniversaire', () => {
        assert.equal(purchasePoints(4250, { birthDate: todayAsBirthDate() }), 84);
      });

      it('ne donne aucun point sous 1 €', () => {
        assert.equal(purchasePoints(99, { birthDate: '1990-06-15' }), 0);
      });

      it('refuse un montant négatif', () => {
        assert.throws(() => purchasePoints(-100, { birthDate: '1990-06-15' }), RangeError);
      });
    });

    describe('isBirthday', () => {
      it('reconnaît le jour et le mois', () => {
        assert.equal(isBirthday('1985-03-14', new Date(2026, 2, 14)), true);
      });

      it('ignore l’année', () => {
        assert.equal(isBirthday('1985-03-14', new Date(2031, 2, 14)), true);
      });
    });

    describe('rewardFor', () => {
      const cases = [
        { points: 0, expected: null },
        { points: 199, expected: null },
        { points: 200, expected: 'bon de 5 €' },
        { points: 499, expected: 'bon de 5 €' },
        { points: 500, expected: 'bon de 15 €' },
      ];
      for (const { points, expected } of cases) {
        it(`${points} points -> ${expected}`, () => {
          assert.equal(rewardFor(points), expected);
        });
      }
    });
    ```

    Demandes de l’équipe :

    1. **Test instable.** « L’intégration continue a échoué le 1er janvier, puis est
       repassée le 2 sans aucun changement de code. » Trouve le test en cause, explique le
       mécanisme et rends la suite indépendante de la date du jour. Interdit : `skip`,
       supprimer le test.
    2. **Bug.** « Une cliente née le 29 février 2000 n’a jamais son bonus les années non
       bissextiles. » Règle décidée : les années non bissextiles, son anniversaire est le
       28 février. Écris d’abord le test qui reproduit le bug, vois-le échouer, puis corrige.
    3. **Nouvelle règle.** Un achat d’au moins 100 € donne 50 points de bonus. Ce bonus
       s’ajoute **après** le doublement d’anniversaire (il n’est pas doublé). Écris les
       tests d’abord, en couvrant les limites et la combinaison avec l’anniversaire.
    4. Lance la suite complète et la couverture de code.
  deliverable: |
    Colle le fichier de test et le module modifiés, la liste de tes changements avec la
    raison de chacun, la sortie d’exécution montrant le test du 29 février en échec avant
    correction, puis la sortie finale de `npm test` et de
    `node --test --experimental-test-coverage`.
  rubric:
    passRatio: 0.7
    criteria:
      - id: flaky-diagnosis
        description: Explique pourquoi le test échoue seulement le 1er janvier et le rend reproductible.
        maxScore: 3
      - id: regression-method
        description: Applique la méthode test d’abord pour le bug du 29 février.
        maxScore: 3
      - id: new-rule
        description: Ajoute la nouvelle règle par les tests, limites et combinaison comprises.
        maxScore: 2
      - id: minimal-change
        description: Fait évoluer le module et les tests de façon ciblée, sans régression.
        maxScore: 2
