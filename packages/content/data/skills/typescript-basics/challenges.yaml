- id: typescript-basics-sans-ia
  family: SANS_IA
  title: Le catalogue de la médiathèque
  summary: Modéliser un catalogue avec une union discriminée et écrire des fonctions typées, exhaustives et sûres face à l’absence.
  estimatedMinutes: 50
  instructions: |
    Une médiathèque prête des livres, des DVD et des jeux de société. Écris seul, sans IA,
    un fichier `media.ts` en TypeScript strict. Travaille dans un dossier contenant un
    `package.json` avec `"type": "module"`, TypeScript installé en dépendance de
    développement, et ce `tsconfig.json` :

    ```json
    {
      "compilerOptions": {
        "target": "esnext",
        "module": "nodenext",
        "strict": true,
        "noEmit": true,
        "allowImportingTsExtensions": true,
        "erasableSyntaxOnly": true,
        "verbatimModuleSyntax": true
      }
    }
    ```

    Règles de gestion :

    - un **livre** a un titre, un auteur et un nombre de pages ; il se prête 21 jours ;
    - un **DVD** a un titre et une durée en minutes ; il se prête 7 jours ;
    - un **jeu** a un titre et un âge minimum ; il se prête 14 jours, et seulement à une
      personne dont l’âge est connu et au moins égal à l’âge minimum.

    Travail demandé :

    1. Écris les types `Book`, `Dvd`, `Game` et `Media` (l’union des trois) sous la forme
       d’une **union discriminée** par une propriété `kind`.
    2. Écris `loanDays(media: Media): number` et `describe(media: Media): string` avec un
       `switch` sur `kind`. Chaque `switch` doit être **exhaustif** : ajouter une quatrième
       sorte de média à l’union doit provoquer une erreur de `tsc` dans ces fonctions.
       `describe` produit par exemple `DVD : Le Voyage de Chihiro (125 min)`.
    3. Écris `findByTitle(catalog: readonly Media[], title: string)`, qui renvoie le média
       dont le titre correspond sans tenir compte de la casse ni des espaces autour, ou
       `undefined`. Choisis et écris toi-même le type de retour.
    4. Écris `canBorrow(media: Media, borrowerAge: number | undefined): boolean`.
    5. Teste avec ce catalogue, en affichant chaque média avec sa durée de prêt, puis le
       résultat de `canBorrow` pour le jeu trouvé avec `findByTitle(catalog, ' les aventuriers du rail ')`
       et un emprunteur de 7 ans, puis le résultat de `findByTitle(catalog, 'Dune')`.

    ```ts
    const catalog: Media[] = [
      { kind: 'book', title: 'Le Petit Prince', author: 'Antoine de Saint-Exupéry', pages: 96 },
      { kind: 'dvd', title: 'Le Voyage de Chihiro', durationMinutes: 125 },
      { kind: 'game', title: 'Les Aventuriers du Rail', minAge: 8 },
    ];
    ```

    Contraintes : aucun `any`, aucun `as`, aucun `!` d’assertion non nulle. `npx tsc` ne doit
    afficher aucune erreur et `node media.ts` doit s’exécuter.

    Réponds enfin en quelques phrases à ces trois questions :

    - Que se passerait-il, à la compilation puis à l’exécution, si l’on ajoutait
      `type Magazine = { kind: 'magazine'; title: string; issue: number }` à l’union ?
    - Pourquoi `findByTitle` ne peut-elle pas renvoyer simplement `Media` ?
    - Si le catalogue était lu avec `JSON.parse` depuis un fichier, en quoi l’annotation
      `const catalog: Media[] = JSON.parse(text)` serait-elle trompeuse ?
  deliverable: |
    Colle le contenu complet de `media.ts`, la sortie de `npx tsc` (vide si tout va bien),
    la sortie exacte de `node media.ts`, puis tes réponses aux trois questions.
  rubric:
    passRatio: 0.7
    criteria:
      - id: modeling
        description: Modélise le catalogue par une union discriminée et justifie ses choix de types.
        maxScore: 3
        levels:
          - score: 0
            description: Pas d’union discriminée, ou propriétés mélangées dans un seul type avec des optionnels partout.
          - score: 1
            description: Union présente mais discriminant mal typé (string au lieu d’un littéral) ou incohérent.
          - score: 2
            description: Union discriminée correcte, explique pourquoi chaque variante a son propre littéral kind.
          - score: 3
            description: Explique aussi pourquoi cette modélisation rend impossibles des objets incohérents (un DVD avec un nombre de pages).
      - id: narrowing-exhaustiveness
        description: Rétrécit correctement et garantit l’exhaustivité des switch.
        maxScore: 3
        levels:
          - score: 0
            description: Accède à des propriétés sans rétrécissement ou utilise as pour faire taire tsc.
          - score: 1
            description: Switch corrects mais non exhaustifs, ou default silencieux qui masque un oubli.
          - score: 2
            description: Exhaustivité garantie par never et explication du rôle de never.
          - score: 3
            description: Prévoit l’erreur exacte produite par l’ajout d’une variante et le comportement à l’exécution d’une valeur inattendue.
      - id: absence-handling
        description: Traite les valeurs absentes avec strictNullChecks sans assertion.
        maxScore: 2
        levels:
          - score: 0
            description: Utilise ! ou ignore le cas undefined.
          - score: 1
            description: Gère undefined mais par une valeur de vérité (if (!age)) sans voir le piège.
          - score: 2
            description: Type de retour T | undefined explicite, test === undefined justifié, appelant qui traite l’absence.
      - id: runtime-limits
        description: Distingue ce que tsc vérifie de ce qui arrive à l’exécution.
        maxScore: 2
        levels:
          - score: 0
            description: Pense que l’annotation Media[] sur JSON.parse vérifie les données.
          - score: 1
            description: Sait que JSON.parse renvoie any sans proposer de solution.
          - score: 2
            description: Explique l’effacement des types et propose unknown avec une garde de type.

- id: typescript-basics-avec-ia
  family: AVEC_IA
  title: Le relevé de dépenses
  summary: Construire avec une IA un module qui valide des données JSON inconnues, puis les regroupe avec un générique et des types utilitaires.
  estimatedMinutes: 120
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu devras expliquer chaque type
    et chaque contrôle sans aide, prévoir l’effet de petites modifications et corriger
    toi-même un comportement.

    Une application de budget exporte les dépenses d’un mois en JSON. Certaines lignes sont
    abîmées. Écris un fichier `expenses.ts`, exécuté avec `node expenses.ts` et vérifié par
    `npx tsc` avec ce `tsconfig.json` (dans un dossier dont le `package.json` contient
    `"type": "module"`) :

    ```json
    {
      "compilerOptions": {
        "target": "esnext",
        "module": "nodenext",
        "strict": true,
        "noEmit": true,
        "allowImportingTsExtensions": true,
        "erasableSyntaxOnly": true,
        "verbatimModuleSyntax": true
      }
    }
    ```

    Données, à recopier telles quelles en haut du fichier :

    ```ts
    const RAW_EXPENSES = `[
      { "id": 1, "label": "Courses", "amountCents": 6420, "category": "food", "date": "2026-03-02" },
      { "id": 2, "label": "Pass Navigo", "amountCents": 8820, "category": "transport", "date": "2026-03-01" },
      { "id": 3, "label": "Cinéma", "amountCents": 1150, "category": "leisure", "date": "2026-03-07", "note": "avec Léa" },
      { "id": 4, "label": "Boulangerie", "amountCents": "3,20", "category": "food", "date": "2026-03-08" },
      { "id": 5, "label": "Loyer", "amountCents": 72000, "category": "housing", "date": "2026-03-05" },
      { "id": 6, "label": "Restaurant", "amountCents": 3800, "category": "restaurant", "date": "2026-03-09" },
      { "id": 7, "label": "Marché", "amountCents": 2310, "category": "food", "date": "2026-03-14" },
      { "id": 8, "label": "Vélo", "amountCents": 0, "category": "transport", "date": "2026-03-15", "note": "réparation offerte" },
      null
    ]`;
    ```

    Exigences :

    1. Un type `Category` qui n’admet que `food`, `transport`, `housing` et `leisure`, et un
       type `Expense` : `id` (nombre), `label` (texte), `amountCents` (entier positif ou nul,
       en centimes), `category`, `date` (texte), `note` facultative.
    2. `parseExpenses(text: string): { valid: Expense[]; rejected: number }`. Le résultat de
       `JSON.parse` est traité comme `unknown` ; chaque ligne est contrôlée par une garde de
       type `isExpense(value: unknown): value is Expense` qui vérifie **toutes** les
       propriétés, y compris que la catégorie fait partie des quatre valeurs permises. Une
       ligne invalide est comptée dans `rejected`, sans arrêter le traitement.
    3. Une fonction générique
       `groupBy<T, K extends string>(items: readonly T[], keyOf: (item: T) => K): Partial<Record<K, T[]>>`
       qui regroupe des éléments quelconques selon une clé calculée.
    4. `totalsByCategory(expenses: readonly Expense[]): Record<Category, number>` qui renvoie
       le total en centimes de **chaque** catégorie, y compris celles sans dépense (0).
    5. Un affichage : nombre de lignes valides et rejetées, libellés des dépenses de la
       catégorie `food` obtenus avec `groupBy`, total par catégorie en euros avec deux
       décimales, total général.

    Contraintes : aucun `any` (ni écrit, ni implicite), aucun `as` (sauf `as const`), aucun
    `!` d’assertion non nulle, aucun `enum`. `npx tsc` ne doit afficher aucune erreur.

    Conseil : demande à l’IA de t’expliquer pourquoi `Object.keys` renvoie un `string[]` et
    non un tableau de clés précises, puis vérifie-le toi-même avec `tsc`.
  deliverable: |
    Colle le code complet de `expenses.ts`, la sortie de `npx tsc` et la sortie exacte de
    `node expenses.ts`. Ajoute ensuite une dizaine de lignes : ce que l’IA t’a proposé, ce
    que tu as dû corriger ou refuser (et pourquoi), et la liste des lignes rejetées avec la
    raison de chaque rejet.
  rubric:
    passRatio: 0.7
    criteria:
      - id: code-ownership
        description: Explique chaque type et chaque contrôle de son code sans aide.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des parties importantes de son propre code.
          - score: 1
            description: Explique le déroulé global mais pas les types ni les gardes.
          - score: 2
            description: Explique précisément chaque type, chaque contrôle et le rétrécissement obtenu.
          - score: 3
            description: Explique aussi ce qu’il a refusé dans les propositions de l’IA et pourquoi.
      - id: runtime-validation
        description: Valide des données inconnues avec unknown et une garde complète.
        maxScore: 3
        levels:
          - score: 0
            description: Utilise as, any ou un générique de retour pour typer le JSON.
          - score: 1
            description: Utilise unknown mais la garde oublie des propriétés ou la catégorie.
          - score: 2
            description: Garde complète, rejets corrects et explication de typeof null et de in.
          - score: 3
            description: Explique aussi qu’une garde peut mentir et comment il a vérifié la sienne sur les lignes abîmées.
      - id: generics-utilities
        description: Comprend le générique groupBy et les types utilitaires utilisés.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas ce que représentent T et K ni pourquoi Partial et Record sont là.
          - score: 1
            description: Signature correcte mais explication confuse de l’inférence de T et K.
          - score: 2
            description: Explique l’inférence, la contrainte K extends string, Partial et Record<Category, number>.
          - score: 3
            description: Prévoit correctement le type produit par un autre appel de groupBy et ses conséquences.
      - id: modification
        description: Réalise ou décrit correctement une modification demandée à l’oral.
        maxScore: 2
        levels:
          - score: 0
            description: Ne parvient pas à modifier le comportement.
          - score: 1
            description: Modification partielle, ou oubli d’un endroit que tsc ne signale pas.
          - score: 2
            description: Modification complète, en s’appuyant sur les erreurs de tsc et une vérification à l’exécution.

- id: typescript-basics-contre-ia
  family: CONTRE_IA
  title: Les commandes qui compilent trop bien
  summary: Trouver et corriger les défauts d’un module TypeScript généré qui passe tsc sans erreur mais ment sur ses données.
  estimatedMinutes: 60
  instructions: |
    Un assistant a généré ce module de gestion des commandes d’une boutique. Il passe
    `npx tsc` en mode strict **sans aucune erreur**, et l’équipe en conclut qu’il est
    correct. Les commandes arrivent d’une API sous forme de texte JSON. Règles métier : un
    coupon commençant par `VIP` donne 10 % de remise ; une commande peut ne pas avoir de
    coupon ; une commande annulée doit être affichée « Annulée » ; une commande non expédiée
    n’a pas de date d’expédition ; l’adresse e-mail du client ne doit jamais apparaître dans
    les données publiques ; seuls le statut, le coupon et la date d’expédition peuvent être
    modifiés après création.

    ```ts
    // orders.ts — module de gestion des commandes proposé par un assistant

    export type OrderStatus = 'pending' | 'paid' | 'shipped' | 'cancelled';

    export interface OrderItem {
      sku: string;
      unitPriceCents: number;
      quantity: number;
    }

    export interface Order {
      id: number;
      customerEmail: string;
      items: OrderItem[];
      status: OrderStatus;
      couponCode?: string;
      createdAt: Date;
      shippedAt?: Date;
    }

    export type PublicOrder = Omit<Order, 'customerEmail'>;

    export function parseOrder(json: string): Order {
      return JSON.parse(json) as Order;
    }

    export function orderTotalCents(order: Order): number {
      return order.items.reduce((total, item: any) => total + item.price * item.quantity, 0);
    }

    export function discountRate(order: Order): number {
      return order.couponCode!.startsWith('VIP') ? 0.1 : 0;
    }

    export function statusLabel(status: OrderStatus): string {
      switch (status) {
        case 'pending':
          return 'En attente de paiement';
        case 'paid':
          return 'Payée';
        case 'shipped':
          return 'Expédiée';
        default:
          return 'Statut inconnu';
      }
    }

    export function shippingDays(order: Order): number {
      const elapsed = order.shippedAt!.getTime() - order.createdAt.getTime();
      return Math.round(elapsed / (24 * 60 * 60 * 1000));
    }

    export function updateOrder(order: Order, changes: Partial<Order>): Order {
      return { ...order, ...changes };
    }

    export function toPublicOrder(order: Order): PublicOrder {
      return order;
    }
    ```

    Exemple de texte reçu de l’API :

    ```json
    {"id":42,"customerEmail":"ada@example.com","status":"shipped","createdAt":"2026-03-01T10:00:00.000Z","shippedAt":"2026-03-03T09:00:00.000Z","items":[{"sku":"KB-01","unitPriceCents":4990,"quantity":2}]}
    ```

    Travail demandé :

    1. Écris un petit script `demo.ts` qui importe ces fonctions, les appelle sur cette
       commande et sur une commande sans coupon ni date d’expédition, et observe ce qui se
       passe réellement avec `node demo.ts`.
    2. Liste chaque défaut : la fonction, le comportement observé ou possible, la cause
       précise (quelle construction TypeScript a permis au défaut de passer `tsc`) et sa
       gravité.
    3. Propose une version corrigée de `orders.ts` qui passe `npx tsc` en mode strict, sans
       `any`, sans `as` (sauf `as const`) et sans `!`. `parseOrder` doit rejeter un texte qui
       ne décrit pas une commande valide et produire de vraies dates.
    4. Pour chaque correction, donne l’entrée ou l’appel qui aurait révélé le défaut.

    Le `tsconfig.json` est celui de la compétence (`strict`, `noEmit`,
    `allowImportingTsExtensions`, `erasableSyntaxOnly`, `verbatimModuleSyntax`, `module` et
    `target` réglés pour Node.js), dans un dossier dont le `package.json` contient
    `"type": "module"`.
  deliverable: |
    Colle `demo.ts` et sa sortie, ta liste de défauts (fonction, symptôme, cause, gravité),
    puis le fichier `orders.ts` corrigé complet et la sortie de `npx tsc`.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts réels, y compris ceux qui ne se manifestent qu’avec certaines données.
        maxScore: 3
      - id: root-cause
        description: Explique pourquoi chaque défaut a passé tsc.
        maxScore: 3
      - id: fix-quality
        description: Propose des corrections justes, sans assertion, vérifiées par des entrées précises.
        maxScore: 3

- id: typescript-basics-apres-ia
  family: APRES_IA
  title: La billetterie du festival
  summary: Faire évoluer un module TypeScript existant, ajouter une variante sans rien oublier et remplacer un any par une validation.
  estimatedMinutes: 75
  instructions: |
    Ce module gère la billetterie d’un festival. Il passe `npx tsc` en mode strict, il est
    utilisé tous les jours : fais-le évoluer **en modifiant le moins de lignes possible**,
    sans le régénérer.

    ```ts
    // tickets.ts — billetterie du festival, en production depuis le printemps

    type StandardTicket = { kind: 'standard'; holder: string; priceCents: number };
    type StudentTicket = { kind: 'student'; holder: string; priceCents: number; studentId: string };
    type VipTicket = { kind: 'vip'; holder: string; priceCents: number; lounge: boolean };

    export type Ticket = StandardTicket | StudentTicket | VipTicket;

    export type Workshop = {
      title: string;
      capacity?: number; // absent : jauge par défaut
      sold: number;
    };

    const DEFAULT_CAPACITY = 30;

    const kindLabels: Record<string, string> = {
      standard: 'Standard',
      student: 'Étudiant',
      vip: 'VIP',
    };

    export function ticketLabel(ticket: Ticket): string {
      switch (ticket.kind) {
        case 'standard':
          return `${kindLabels.standard} — ${ticket.holder}`;
        case 'student':
          return `${kindLabels.student} (${ticket.studentId}) — ${ticket.holder}`;
        case 'vip':
          return `${kindLabels.vip}${ticket.lounge ? ' + salon' : ''} — ${ticket.holder}`;
      }
    }

    export function printBadge(ticket: Ticket): void {
      switch (ticket.kind) {
        case 'vip':
          console.log(`[BADGE OR] ${ticket.holder}`);
          break;
        case 'standard':
        case 'student':
          console.log(`[BADGE] ${ticket.holder}`);
          break;
      }
    }

    export function remainingSeats(workshop: Workshop): number {
      const capacity = workshop.capacity || DEFAULT_CAPACITY;
      return Math.max(capacity - workshop.sold, 0);
    }

    export function loadTickets(json: string): Ticket[] {
      const data: any = JSON.parse(json);
      return data.tickets;
    }

    export function totalRevenueCents(tickets: Ticket[]): number {
      return tickets.reduce((total, ticket) => total + ticket.priceCents, 0);
    }
    ```

    Script d’utilisation actuel, `main.ts` :

    ```ts
    import { loadTickets, printBadge, remainingSeats, ticketLabel, totalRevenueCents } from './tickets.ts';
    import type { Workshop } from './tickets.ts';

    const tickets = loadTickets(`{
      "tickets": [
        { "kind": "standard", "holder": "Ada", "priceCents": 4500 },
        { "kind": "student", "holder": "Alan", "priceCents": 2500, "studentId": "E-2291" },
        { "kind": "vip", "holder": "Grace", "priceCents": 12000, "lounge": true }
      ]
    }`);

    for (const ticket of tickets) {
      console.log(ticketLabel(ticket));
      printBadge(ticket);
    }
    console.log(`Recette : ${(totalRevenueCents(tickets) / 100).toFixed(2)} €`);

    const workshops: Workshop[] = [
      { title: 'Sérigraphie', capacity: 12, sold: 9 },
      { title: 'Fresque collective', sold: 4 },
      { title: 'Atelier annulé', capacity: 0, sold: 0 },
    ];
    for (const workshop of workshops) {
      console.log(`${workshop.title} : ${remainingSeats(workshop)} place(s)`);
    }
    ```

    Demandes de l’équipe :

    1. **Bug** : l’atelier annulé, dont la jauge a été mise à 0, affiche 30 places
       disponibles. Corrige et explique la cause.
    2. **Nouveau billet de groupe** : `{ kind: 'group'; holder: string; priceCents: number; size: number }`,
       libellé « Groupe de 12 — Lycée Jean-Moulin », un badge
       `[BADGE] Lycée Jean-Moulin (groupe de 12)`. Fais en sorte que l’ajout d’une future
       sorte de billet provoque une erreur de `tsc` **dans toutes les fonctions** qui
       traitent les sortes de billets.
    3. **Libellés** : le type de `kindLabels` doit obliger à fournir un libellé pour chaque
       sorte de billet existante, sans répéter la liste des sortes.
    4. **Chargement sûr** : `loadTickets` doit renvoyer `{ tickets: Ticket[]; rejected: number }`,
       ignorer et compter les billets invalides (sorte inconnue, propriété manquante ou du
       mauvais type), et lever une erreur si le texte n’a pas de tableau `tickets`. Pas de
       `any`, pas de `as`, pas de `!`.

    Adapte `main.ts` en conséquence et ajoute un billet de groupe et un billet invalide aux
    données de test.
  deliverable: |
    Colle `tickets.ts` et `main.ts` modifiés, la sortie de `npx tsc` et de `node main.ts`,
    puis la liste des lignes modifiées ou ajoutées avec la raison de chaque changement. Indique
    en particulier ce que `tsc` a signalé (ou non) juste après l’ajout de la variante `group`
    à l’union, avant toute autre modification.
  rubric:
    passRatio: 0.7
    criteria:
      - id: bug-diagnosis
        description: Explique la cause du bug de jauge et la corrige proprement.
        maxScore: 2
      - id: exhaustive-evolution
        description: Ajoute la variante sans oubli et rend tous les switch exhaustifs.
        maxScore: 3
      - id: safe-loading
        description: Remplace any par unknown et une garde de type complète.
        maxScore: 3
      - id: minimal-change
        description: Fait évoluer le code existant de façon ciblée et vérifiée.
        maxScore: 2
