- id: database-from-node-sans-ia
  family: SANS_IA
  title: Les missions de bénévolat
  summary: Brancher une petite API Express sur PostgreSQL avec un pool, des requêtes paramétrées, une transaction et des erreurs de contraintes traduites.
  estimatedMinutes: 60
  instructions: |
    Une association met en relation des bénévoles et des missions. Tu travailles **sans aide**,
    avec Node.js 24, Express 5, le client `pg` et une base PostgreSQL d’entraînement.

    Crée une base, exécute ce schéma avec `psql -f`, et place l’URL de connexion dans un fichier
    `.env` (variable `DATABASE_URL`) ignoré par Git :

    ```sql
    DROP TABLE IF EXISTS assignments, volunteers, missions;

    CREATE TABLE missions (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      title text NOT NULL,
      city text NOT NULL,
      happens_on date NOT NULL,
      max_volunteers integer NOT NULL CHECK (max_volunteers > 0)
    );

    CREATE TABLE volunteers (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      name text NOT NULL,
      email text NOT NULL UNIQUE
    );

    CREATE TABLE assignments (
      mission_id integer NOT NULL REFERENCES missions (id) ON DELETE CASCADE,
      volunteer_id integer NOT NULL REFERENCES volunteers (id) ON DELETE CASCADE,
      PRIMARY KEY (mission_id, volunteer_id)
    );

    INSERT INTO missions (title, city, happens_on, max_volunteers) VALUES
      ('Collecte alimentaire', 'Lyon', '2025-04-05', 3),
      ('Nettoyage des berges', 'Lyon', '2025-04-12', 2),
      ('Aide aux devoirs', 'Villeurbanne', '2025-04-09', 4),
      ('Atelier vélo', 'Lyon', '2025-04-19', 2);

    INSERT INTO volunteers (name, email) VALUES
      ('Amina Sow', 'amina@example.com'),
      ('Léo Fontaine', 'leo@example.com'),
      ('Sarah Klein', 'sarah@example.com'),
      ('Victor Hugues', 'victor@example.com');

    INSERT INTO assignments (mission_id, volunteer_id) VALUES
      (1, 1), (2, 1), (2, 2), (3, 3);
    ```

    Travail demandé, dans un projet en modules ES :

    1. `src/db.js` : un pool unique configuré par `DATABASE_URL` (erreur claire au démarrage si
       la variable manque), un écouteur `error` sur le pool, et les dates renvoyées au format
       `AAAA-MM-JJ`.
    2. Un module d’accès aux données avec deux fonctions :
       - `findMissions({ city })` : les missions (toutes, ou d’une ville), triées par date puis
         identifiant, avec pour chacune `id`, `title`, `city`, `happensOn` et `remainingPlaces`
         (places restantes, en nombre JavaScript) ;
       - `assignVolunteer(missionId, volunteerId)` : inscrit un bénévole à une mission, dans une
         transaction, en refusant l’inscription si la mission est complète. Deux inscriptions
         simultanées ne doivent jamais dépasser la capacité.
    3. `src/app.js` avec Express 5 :
       - `GET /missions` et `GET /missions?city=Lyon` ;
       - `POST /missions/:id/assignments` avec un corps `{ "volunteerId": 2 }`, qui répond `201`
         en cas de succès, `400` si un identifiant est invalide, `404` si la mission ou le
         bénévole n’existe pas, `409` si la mission est complète ou si le bénévole y est déjà
         inscrit ;
       - un gestionnaire d’erreurs centralisé qui ne renvoie jamais de détail technique.
    4. Teste avec `curl` : la liste de Lyon, une recherche par ville contenant une apostrophe
       (`?city=Lyon%27%20OR%201%3D1%20--`), une inscription réussie, la même inscription une
       seconde fois, une inscription à la mission 2, une mission inexistante, un bénévole
       inexistant.
  deliverable: |
    Colle `src/db.js`, ton module d’accès aux données, `src/app.js`, puis chaque commande `curl`
    avec sa réponse et son code de statut. Ajoute trois ou quatre phrases : pourquoi ta recherche
    par ville est protégée de l’injection, et comment ta transaction empêche de dépasser la
    capacité d’une mission.
  rubric:
    passRatio: 0.7
    criteria:
      - id: connection
        description: Configure et explique le pool, DATABASE_URL et la conversion des types.
        maxScore: 3
        levels:
          - score: 0
            description: 'URL de connexion dans le code ou pool recréé à chaque requête.'
          - score: 1
            description: 'Pool correct mais configuration ou conversions mal expliquées.'
          - score: 2
            description: 'Pool unique, DATABASE_URL vérifiée, explique pourquoi count arrive en chaîne et le réglage des dates.'
          - score: 3
            description: 'Explique aussi le rôle de l’écouteur error et la fermeture du pool.'
      - id: injection
        description: Utilise exclusivement des requêtes paramétrées et explique l’injection SQL.
        maxScore: 3
        levels:
          - score: 0
            description: 'Valeur extérieure collée dans le SQL.'
          - score: 1
            description: 'Requêtes paramétrées sans pouvoir expliquer pourquoi elles protègent.'
          - score: 2
            description: 'Explique la séparation du texte SQL et des valeurs, avec l’exemple de l’apostrophe.'
          - score: 3
            description: 'Explique aussi les limites (identifiants, liste blanche) et pourquoi la validation ne suffit pas.'
      - id: transaction
        description: Écrit une transaction correcte et résistante aux accès concurrents.
        maxScore: 3
        levels:
          - score: 0
            description: 'Pas de transaction, ou pool.query pour BEGIN/COMMIT.'
          - score: 1
            description: 'Transaction sur un client mais release ou ROLLBACK manquant sur un chemin.'
          - score: 2
            description: 'Schéma complet (try/catch/finally) et verrou FOR UPDATE justifié.'
          - score: 3
            description: 'Explique précisément le scénario de concurrence évité et ce qui se passerait sans verrou.'
      - id: errors
        description: Traduit les erreurs de contraintes en réponses HTTP adaptées sans fuite d’information.
        maxScore: 3
        levels:
          - score: 0
            description: 'Tout finit en 500, ou le message PostgreSQL est renvoyé au client.'
          - score: 1
            description: 'Codes HTTP partiellement corrects.'
          - score: 2
            description: '400, 404 et 409 corrects, détection par error.code.'
          - score: 3
            description: 'Justifie chaque statut et distingue erreur métier, contrainte et erreur inattendue.'

- id: database-from-node-avec-ia
  family: AVEC_IA
  title: Le journal de lecture partagé
  summary: Construire avec une IA une API Express et PostgreSQL complète, avec migrations, couche d’accès aux données et transactions, puis la défendre ligne par ligne.
  estimatedMinutes: 180
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu devras expliquer chaque fichier
    **sans aide**, ajouter une fonctionnalité en direct et réagir à un bug introduit par
    l’examinateur.

    Objectif : une API qui permet à un club de lecture de suivre les lectures de ses membres.

    > Des lecteurs (nom, e-mail unique) lisent des livres (titre, auteur, nombre de pages). Un
    > lecteur ouvre une lecture d’un livre, note sa progression (page atteinte, jamais au-delà du
    > nombre de pages ni en arrière) et la termine. Un lecteur ne peut avoir qu’une seule lecture
    > en cours d’un même livre. Quand une lecture est terminée, il peut laisser un avis (note de
    > 1 à 5, commentaire facultatif), une seule fois par lecture.

    Exigences techniques :

    1. Node.js 24 en modules ES, Express 5, client `pg`, configuration par `DATABASE_URL`
       chargée avec `--env-file`, aucun secret dans le code ni dans Git.
    2. Un dossier `migrations/` d’au moins trois fichiers numérotés et un script
       `scripts/migrate.js` qui les applique une fois chacun, dans une transaction, avec une
       table de suivi. Au moins une migration doit **faire évoluer** une table créée par une
       migration précédente.
    3. Une couche d’accès aux données (repositories) : aucune requête SQL dans les routes, toutes
       les valeurs en paramètres, conversion des lignes en objets `camelCase`.
    4. Au moins une opération dans une transaction avec un client du pool (par exemple « mettre
       à jour la progression et terminer la lecture si la dernière page est atteinte »), avec un
       verrou là où une vérification précède une écriture.
    5. Un gestionnaire d’erreurs centralisé qui traduit au moins `23505`, `23503` et `23514` en
       réponses `400`, `404` ou `409` adaptées, sans divulguer de détail technique.
    6. Une route de liste avec tri choisi par le client (`?sort=title` ou `?sort=pages`), protégé
       par une liste blanche, et pagination.
  deliverable: |
    Colle l’arborescence du projet, le contenu des migrations, de `scripts/migrate.js`, de
    `src/db.js`, des repositories et de `src/app.js`, puis une session de test avec `curl`
    (au moins huit requêtes, dont des cas d’erreur) avec les réponses obtenues. Termine par une
    liste de ce que l’IA a proposé que tu as corrigé ou refusé, et pourquoi.
  rubric:
    passRatio: 0.7
    criteria:
      - id: code-ownership
        description: Explique chaque fichier et chaque choix sans aide, y compris ce qui a été corrigé chez l’IA.
        maxScore: 3
        levels:
          - score: 0
            description: 'Ne sait pas expliquer des parties importantes de son code.'
          - score: 1
            description: 'Explique l’architecture générale mais pas le détail des requêtes et transactions.'
          - score: 2
            description: 'Explique précisément chaque couche, chaque requête et chaque transaction.'
          - score: 3
            description: 'Explique aussi les alternatives écartées et les corrections apportées aux propositions de l’IA.'
      - id: data-safety
        description: Garantit sécurité et intégrité des données (paramètres, contraintes, transactions, verrous).
        maxScore: 3
        levels:
          - score: 0
            description: 'Injection possible ou transactions incorrectes.'
          - score: 1
            description: 'Requêtes sûres mais transactions ou contraintes incomplètes.'
          - score: 2
            description: 'Paramètres partout, liste blanche, transactions correctes, contraintes justifiées.'
          - score: 3
            description: 'Identifie les règles impossibles en contrainte et explique leur protection contre la concurrence.'
      - id: migrations
        description: Fait évoluer le schéma par migrations versionnées et en explique les règles.
        maxScore: 3
        levels:
          - score: 0
            description: 'Schéma créé à la main ou script qui recrée les tables.'
          - score: 1
            description: 'Migrations présentes mais script fragile (pas de transaction, pas de suivi).'
          - score: 2
            description: 'Script correct, migrations ordonnées dont une évolution, règles expliquées.'
          - score: 3
            description: 'Ajoute une migration en direct et explique les précautions sur des données existantes.'
      - id: live-change
        description: Diagnostique et corrige en direct un bug ou une modification demandée.
        maxScore: 3
        levels:
          - score: 0
            description: 'Ne parvient pas à diagnostiquer ni à modifier.'
          - score: 1
            description: 'Corrige par tâtonnement sans expliquer la cause.'
          - score: 2
            description: 'Trouve la cause et corrige proprement.'
          - score: 3
            description: 'Corrige, vérifie avec curl et explique comment éviter la régression.'

- id: database-from-node-contre-ia
  family: CONTRE_IA
  title: L’API de prêt générée en un clic
  summary: Auditer un serveur Express et PostgreSQL généré par une IA et corriger ses failles d’injection, de transaction, de configuration et de gestion d’erreurs.
  estimatedMinutes: 75
  instructions: |
    Un assistant a généré ce serveur pour la médiathèque, en un seul fichier. Il « marche » :
    chaque route répond quand on la teste une fois à la main. Avant de le mettre en ligne, l’équipe
    te demande un audit.

    Il utilise la base `mediatheque` de la compétence précédente (schéma et données de
    `mediatheque.sql`). Pour l’exécuter, adapte la chaîne de connexion à ta machine, installe
    `express@5` et `pg` dans un projet en modules ES, puis lance `node server.js`.

    ```js
    import express from 'express';
    import pg from 'pg';

    const pool = new pg.Pool({
      connectionString: 'postgresql://postgres:devpassword@localhost:5432/mediatheque',
    });

    const app = express();
    app.use(express.json());

    // Recherche de livres par titre, avec tri optionnel
    app.get('/books', async (req, res) => {
      const search = req.query.search ?? '';
      const sort = req.query.sort ?? 'title';
      const { rows } = await pool.query(
        `SELECT id, title, price FROM books WHERE title ILIKE '%${search}%' ORDER BY ${sort}`,
      );
      res.json(rows);
    });

    // Fiche d'un adhérent avec ses emprunts en cours
    app.get('/members/:id', async (req, res) => {
      const { rows } = await pool.query('SELECT id, name, email FROM members WHERE id = $1', [req.params.id]);
      const loans = await pool.query(
        'SELECT book_id, loaned_on, due_on FROM loans WHERE member_id = $1 AND returned_on IS NULL',
        [req.params.id],
      );
      res.json({ ...rows[0], loans: loans.rows });
    });

    // Enregistrer un emprunt (3 emprunts en cours au maximum)
    app.post('/loans', async (req, res) => {
      const { bookId, memberId, loanedOn, dueOn } = req.body;
      try {
        await pool.query('BEGIN');
        const ongoing = await pool.query(
          'SELECT count(*) AS n FROM loans WHERE member_id = $1 AND returned_on IS NULL',
          [memberId],
        );
        if (ongoing.rows[0].n >= 3) {
          return res.status(409).json({ error: 'Trop d’emprunts en cours' });
        }
        const result = await pool.query(
          'INSERT INTO loans (book_id, member_id, loaned_on, due_on) VALUES ($1, $2, $3, $4) RETURNING *',
          [bookId, memberId, loanedOn, dueOn],
        );
        await pool.query('COMMIT');
        res.status(201).json(result.rows[0]);
      } catch (error) {
        await pool.query('ROLLBACK');
        res.status(500).json({ error: error.message, detail: error.detail });
      }
    });

    // Inscription d'un adhérent
    app.post('/members', async (req, res) => {
      const { name, email } = req.body;
      try {
        const { rows } = await pool.query(
          'INSERT INTO members (name, email) VALUES ($1, $2) RETURNING *',
          [name, email],
        );
        res.status(201).json(rows[0]);
      } catch (error) {
        res.status(500).json({ error: error.message, detail: error.detail });
      }
    });

    app.listen(3000, () => console.log('API démarrée sur le port 3000'));
    ```

    Travail demandé :

    1. Liste chaque défaut : emplacement, scénario qui le révèle (requête `curl` ou séquence de
       requêtes), conséquence, gravité. Pense aussi aux défauts qui n’apparaissent qu’avec
       plusieurs requêtes successives ou simultanées.
    2. Démontre au moins deux défauts avec des requêtes réelles et leurs réponses.
    3. Propose une version corrigée, découpée en fichiers (`db.js`, repositories, `app.js`), et
       montre que tes scénarios ne reproduisent plus les défauts.
  deliverable: |
    Colle ta liste de défauts (emplacement, scénario, conséquence, gravité), tes démonstrations
    avec les réponses obtenues, puis ton code corrigé et les mêmes scénarios rejoués.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts réels, y compris ceux qui n’apparaissent qu’avec plusieurs requêtes.
        maxScore: 3
      - id: demonstration
        description: Démontre les défauts par des scénarios reproductibles et en explique la cause.
        maxScore: 3
      - id: fix-quality
        description: Propose une correction structurée et vérifiée.
        maxScore: 3

- id: database-from-node-apres-ia
  family: APRES_IA
  title: L’API qui finit par ne plus répondre
  summary: Dépanner une API Express et PostgreSQL existante, puis lui ajouter une fonctionnalité avec une migration, sans tout réécrire.
  estimatedMinutes: 90
  instructions: |
    L’API de la médiathèque a été écrite il y a quelques mois avec l’aide d’une IA. Elle tourne,
    mais les utilisateurs signalent trois problèmes, et l’équipe veut une nouvelle
    fonctionnalité. Tu dois intervenir **en modifiant le moins possible** : pas de réécriture
    complète, pas de nouvelle dépendance.

    Le projet :

    `package.json`

    ```json
    {
      "name": "library-api",
      "version": "1.0.0",
      "type": "module",
      "scripts": {
        "start": "node --env-file=.env src/server.js",
        "db:migrate": "node --env-file=.env scripts/migrate.js"
      },
      "dependencies": {
        "express": "^5.1.0",
        "pg": "^8.16.0"
      }
    }
    ```

    `src/db.js`

    ```js
    import pg from 'pg';

    if (!process.env.DATABASE_URL) {
      throw new Error('DATABASE_URL manquante');
    }

    export const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 5 });
    pool.on('error', (error) => console.error('Erreur du pool :', error.message));
    ```

    `src/repositories/books-repository.js`

    ```js
    import { pool } from '../db.js';

    function toBook(row) {
      return { id: row.id, title: row.title, isbn: row.isbn, price: row.price };
    }

    export async function search(term) {
      const { rows } = await pool.query(
        "SELECT id, title, isbn, price FROM books WHERE title ILIKE '%$1%' ORDER BY title, id",
        [term],
      );
      return rows.map(toBook);
    }

    export async function findById(id) {
      const { rows } = await pool.query('SELECT id, title, isbn, price FROM books WHERE id = $1', [id]);
      return rows.length === 0 ? null : toBook(rows[0]);
    }
    ```

    `src/repositories/loans-repository.js`

    ```js
    import { pool } from '../db.js';

    export async function findByMember(memberId) {
      const { rows } = await pool.query(
        `SELECT l.id, b.title, l.loaned_on, l.due_on, l.returned_on
         FROM loans AS l
         JOIN books AS b ON b.id = l.book_id
         WHERE l.member_id = $1
         ORDER BY l.loaned_on, l.id`,
        [memberId],
      );
      return rows.map((row) => ({
        id: row.id,
        title: row.title,
        loanedOn: row.loaned_on,
        dueOn: row.due_on,
        returnedOn: row.returned_on,
      }));
    }

    export async function create({ bookId, memberId, loanedOn, dueOn }) {
      const client = await pool.connect();
      await client.query('BEGIN');
      try {
        const out = await client.query(
          'SELECT 1 FROM loans WHERE book_id = $1 AND returned_on IS NULL FOR UPDATE',
          [bookId],
        );
        if (out.rowCount > 0) {
          throw Object.assign(new Error('Livre déjà emprunté'), { status: 409 });
        }
        const { rows } = await client.query(
          `INSERT INTO loans (book_id, member_id, loaned_on, due_on)
           VALUES ($1, $2, $3, $4)
           RETURNING id`,
          [bookId, memberId, loanedOn, dueOn],
        );
        await client.query('COMMIT');
        client.release();
        return rows[0].id;
      } catch (error) {
        await client.query('ROLLBACK');
        throw error;
      }
    }
    ```

    `src/app.js`

    ```js
    import express from 'express';
    import * as booksRepository from './repositories/books-repository.js';
    import * as loansRepository from './repositories/loans-repository.js';

    export const app = express();
    app.use(express.json());

    function parseId(value) {
      const id = Number(value);
      return Number.isInteger(id) && id > 0 ? id : null;
    }

    app.get('/books', async (req, res) => {
      const term = typeof req.query.search === 'string' ? req.query.search : '';
      res.json(await booksRepository.search(term));
    });

    app.get('/books/:id', async (req, res) => {
      const id = parseId(req.params.id);
      if (id === null) return res.status(400).json({ error: 'Identifiant invalide' });
      const book = await booksRepository.findById(id);
      if (book === null) return res.status(404).json({ error: 'Livre introuvable' });
      res.json(book);
    });

    app.get('/members/:id/loans', async (req, res) => {
      const id = parseId(req.params.id);
      if (id === null) return res.status(400).json({ error: 'Identifiant invalide' });
      res.json(await loansRepository.findByMember(id));
    });

    app.post('/loans', async (req, res) => {
      const { bookId, memberId, loanedOn, dueOn } = req.body ?? {};
      if (parseId(bookId) === null || parseId(memberId) === null) {
        return res.status(400).json({ error: 'bookId et memberId sont obligatoires' });
      }
      const id = await loansRepository.create({ bookId, memberId, loanedOn, dueOn });
      res.status(201).json({ id });
    });

    app.use((error, req, res, next) => {
      if (error.status) return res.status(error.status).json({ error: error.message });
      console.error(error.message);
      res.status(500).json({ error: 'Erreur interne du serveur' });
    });
    ```

    `src/server.js`

    ```js
    import { app } from './app.js';

    const port = Number(process.env.PORT ?? 3000);
    app.listen(port, () => console.log(`API disponible sur http://localhost:${port}`));
    ```

    `scripts/migrate.js`

    ```js
    import { readdir, readFile } from 'node:fs/promises';
    import { pool } from '../src/db.js';

    const MIGRATIONS_DIR = new URL('../migrations/', import.meta.url);

    await pool.query(
      'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())',
    );
    const files = (await readdir(MIGRATIONS_DIR)).filter((name) => name.endsWith('.sql')).sort();
    const { rows } = await pool.query('SELECT version FROM schema_migrations');
    const applied = new Set(rows.map((row) => row.version));

    for (const name of files.filter((file) => !applied.has(file))) {
      const sql = await readFile(new URL(name, MIGRATIONS_DIR), 'utf8');
      const client = await pool.connect();
      try {
        await client.query('BEGIN');
        await client.query(sql);
        await client.query('INSERT INTO schema_migrations (version) VALUES ($1)', [name]);
        await client.query('COMMIT');
        console.log(`Appliquée : ${name}`);
      } catch (error) {
        await client.query('ROLLBACK');
        console.error(`Échec de ${name} : ${error.message}`);
        process.exitCode = 1;
        break;
      } finally {
        client.release();
      }
    }
    await pool.end();
    ```

    Les migrations `001_create_catalog.sql`, `002_create_members_and_loans.sql` et
    `003_index_loans_foreign_keys.sql` sont celles de la leçon sur les migrations (schéma de la
    médiathèque, sans données). Pour reproduire l’environnement : crée une base vide, mets son URL
    dans `.env`, lance `npm install` puis `npm run db:migrate`, et charge ces données de
    développement avec `psql -f seed.sql` :

    ```sql
    INSERT INTO genres (name) VALUES ('roman'), ('informatique');
    INSERT INTO authors (name) VALUES ('Claire Martin'), ('Hugo Bernard');
    INSERT INTO books (title, isbn, genre_id, published_year, price) VALUES
      ('Le Jardin des algorithmes', '978-2-0000-0001-1', 2, 2019, 29.90),
      ('Nuit sur le port', '978-2-0000-0002-2', 1, 2021, 18.50),
      ('Le Dernier Phare', '978-2-0000-0005-5', 1, 2016, 9.90);
    INSERT INTO book_authors (book_id, author_id) VALUES (1, 1), (2, 2), (3, 2);
    INSERT INTO members (name, email, joined_on) VALUES
      ('Alice Durand', 'alice@example.com', '2023-09-01'),
      ('Bilal Mansour', 'bilal@example.com', '2023-11-15');
    INSERT INTO loans (book_id, member_id, loaned_on, due_on, returned_on) VALUES
      (1, 1, '2024-09-02', '2024-09-23', '2024-09-20'),
      (2, 2, '2024-10-01', '2024-10-22', NULL);
    ```

    Problèmes signalés :

    1. « La recherche `GET /books?search=phare` renvoie toujours une erreur 500. »
    2. « Sur l’historique d’un adhérent (`GET /members/1/loans`), les dates sont décalées d’un
       jour et contiennent une heure. »
    3. « Après quelques tentatives d’emprunt d’un livre déjà emprunté, l’API ne répond plus du
       tout et il faut la redémarrer. » (Essaie six fois de suite
       `POST /loans` avec `{"bookId":2,"memberId":1,"loanedOn":"2024-11-21","dueOn":"2024-12-12"}`.)

    Nouvelle fonctionnalité :

    4. Les adhérents peuvent noter un livre de 1 à 5, une seule fois par livre :
       `POST /books/:id/ratings` avec `{ "memberId": 1, "score": 4 }`. Réponses : `201`, `400`
       pour une note invalide, `404` pour un livre ou un adhérent inconnu, `409` si l’adhérent a
       déjà noté ce livre. `GET /books/:id` doit désormais renvoyer aussi `averageRating`
       (moyenne arrondie à une décimale, `null` sans note) et `ratingsCount`.
