- id: typescript-node-sans-ia
  family: SANS_IA
  title: Le contrat des inscriptions
  summary: Écrire seul un module de contrats Zod, une règle métier pure et leurs tests node:test, en TypeScript strict.
  estimatedMinutes: 60
  instructions: |
    Un centre de formation propose des ateliers et veut une API d’inscription. Avant d’écrire
    les routes, l’équipe te demande, **sans IA**, le module de contrats, une règle métier et
    leurs tests.

    Travaille dans un projet configuré comme `bookings-api` dans le cours : `package.json` avec
    `"type": "module"`, `express`, `zod` 4, `typescript`, `@types/node@24` et `@types/express`
    installés, les scripts `typecheck` (`tsc --noEmit`) et `test` (`node --test`), et ce
    `tsconfig.json` :

    ```json
    {
      "compilerOptions": {
        "target": "esnext",
        "module": "nodenext",
        "types": ["node"],
        "strict": true,
        "noEmit": true,
        "noUncheckedIndexedAccess": true,
        "rewriteRelativeImportExtensions": true,
        "erasableSyntaxOnly": true,
        "verbatimModuleSyntax": true,
        "skipLibCheck": true
      },
      "include": ["src", "test"]
    }
    ```

    Travail demandé :

    1. Dans `src/contracts/registrations.ts`, écris avec Zod 4 :
       - `createRegistrationSchema`, le corps d’une inscription : `workshopId` (entier
         positif), `name` (2 à 60 caractères, espaces autour retirés), `email` (adresse
         e-mail valide, avec `z.email()`), `seats` (entier de 1 à 4, **1 par défaut**). Toute
         propriété inconnue est refusée ;
       - `registrationSchema`, une inscription enregistrée : les mêmes champs plus un `id`
         entier positif, `seats` étant alors obligatoire. Ne recopie pas les règles des champs ;
       - `listRegistrationsQuerySchema`, les paramètres de `GET /api/registrations` :
         `workshopId` obligatoire et `page` (entier à partir de 1, 1 par défaut), tous deux
         reçus en texte dans l’URL ;
       - les types `CreateRegistrationInput`, `Registration` et `ListRegistrationsQuery`,
         **sans en écrire un seul à la main**.
    2. Dans `src/registrations/rules.ts`, écris
       `remainingSeats(capacity: number, registrations: readonly Registration[], workshopId: number): number`,
       qui renvoie le nombre de places restantes pour cet atelier, jamais négatif.
    3. Dans `test/registrations.test.ts`, écris au moins sept tests avec `node:test` et
       `node:assert/strict`, qui couvrent : le nettoyage du nom et la place par défaut, le
       refus de 5 places, le refus d’un e-mail invalide, le refus d’une propriété inconnue, la
       conversion des paramètres de requête, le refus d’une page vide (`page: ''`), et
       `remainingSeats` (au moins un atelier qui n’est pas concerné, et le cas « complet »).
       Pour chaque refus, vérifie **sur quel champ** porte l’erreur.

    Contraintes : aucun `any`, aucun `as`, aucun `!` d’assertion non nulle. `npm run typecheck`
    ne signale rien et `npm test` réussit.

    Réponds enfin en quelques phrases :

    - Pourquoi déduire les types avec `z.infer` plutôt que les écrire à côté des schémas ?
    - Quel est le type de `seats` dans `z.input<typeof createRegistrationSchema>` et dans
      `z.output<typeof createRegistrationSchema>` ? Pourquoi sont-ils différents ?
    - Pourquoi `npm test` ne suffit-il pas à garantir que tes tests sont corrects, et quelle
      commande le complète ?
  deliverable: |
    Colle le contenu complet de `src/contracts/registrations.ts`, `src/registrations/rules.ts`
    et `test/registrations.test.ts`, la sortie de `npm run typecheck` (vide si tout va bien),
    la sortie complète de `npm test`, puis tes réponses aux trois questions.
  rubric:
    passRatio: 0.7
    criteria:
      - id: schemas
        description: Écrit des schémas Zod 4 corrects et explique chaque règle, y compris la coercition et les valeurs par défaut.
        maxScore: 3
        levels:
          - score: 0
            description: Schémas absents, faux, ou en syntaxe Zod 3 ; ne sait pas expliquer ce qu’ils acceptent.
          - score: 1
            description: Schémas en partie corrects mais oubli de la coercition, de min(1) ou du refus des propriétés inconnues.
          - score: 2
            description: Schémas corrects ; explique strictObject, coerce et default sur des exemples.
          - score: 3
            description: Explique aussi les cas limites (chaîne vide devenue 0, '1e1' accepté, ordre trim puis min).
      - id: single-source
        description: Déduit tous les types des schémas et partage les champs sans duplication.
        maxScore: 3
        levels:
          - score: 0
            description: Écrit des types à la main ou recopie les règles des champs.
          - score: 1
            description: Utilise z.infer mais duplique les règles entre les deux schémas.
          - score: 2
            description: Une seule définition par champ, types déduits ; explique le risque de divergence.
          - score: 3
            description: Distingue précisément z.input et z.output et sait dire où chacun est utile.
      - id: tests
        description: Écrit des tests node:test qui peuvent échouer et vérifient le bon comportement.
        maxScore: 3
        levels:
          - score: 0
            description: Tests absents, qui ne s’exécutent pas, ou qui ne vérifient rien.
          - score: 1
            description: Tests présents mais qui ne vérifient que success === false ou contiennent une assertion conditionnelle.
          - score: 2
            description: Chaque refus vérifie le champ en erreur ; remainingSeats couvre un autre atelier et le cas complet.
          - score: 3
            description: Justifie le choix des cas limites et montre qu’un test échoue si la règle est retirée.
      - id: tooling
        description: Comprend la répartition des rôles entre tsc et node --test.
        maxScore: 2
        levels:
          - score: 0
            description: Croit que node --test vérifie les types.
          - score: 1
            description: Sait qu’il faut tsc mais ne sait pas expliquer pourquoi ni sur quels fichiers.
          - score: 2
            description: Explique le retrait des types, l’inclusion de test dans tsconfig et un script qui enchaîne les deux.

- id: typescript-node-avec-ia
  family: AVEC_IA
  title: Le prêt de matériel
  summary: Construire avec une IA une petite API Express 5 en TypeScript strict, validée par Zod et testée, puis en défendre chaque ligne.
  estimatedMinutes: 120
  instructions: |
    Tu peux utiliser une IA autant que tu veux pour ce mini-projet. À l’oral, tu devras
    expliquer chaque ligne sans aide, prévoir le résultat de petites modifications et corriger
    toi-même un comportement. Vérifie tout ce que l’IA propose : beaucoup d’exemples en ligne
    utilisent Zod 3 ou Express 4.

    Une association prête du matériel (vidéoprojecteurs, caméras, micros) à ses membres.
    Construis `loans-api`, une API en mémoire, sans base de données.

    Configuration :

    1. Projet Node.js 24 en modules ES, TypeScript strict avec la configuration du cours
       (`tsconfig.json` pour la vérification de `src` et `test`, `tsconfig.build.json` pour
       compiler `src` vers `dist/` avec `noEmitOnError`).
    2. Scripts : `dev` (`node --watch src/server.ts`), `typecheck`, `test`, `check` (types puis
       tests), `build` et `start` (`node dist/server.js`).

    Fonctionnement :

    3. Un module `src/contracts/loans.ts` contient **tous** les schémas Zod 4 et les types
       déduits. Matériel disponible : `projector` (stock 2), `camera` (stock 3), `microphone`
       (stock 5). Un prêt a un `id`, un `item`, un `borrower` (2 à 60 caractères, espaces
       retirés), une `quantity` (entier de 1 à 3), une `startDate` et une `endDate` (dates
       ISO, la fin ne précède pas le début) et un booléen `returned`.
    4. Routes :
       - `GET /api/loans` avec les paramètres facultatifs `item`, `returned` (`true` ou
         `false`) et `limit` (1 à 50, 20 par défaut) ;
       - `GET /api/loans/:id` ;
       - `POST /api/loans` : crée un prêt non rendu ; répond **409** si la quantité demandée
         dépasse le stock restant de ce matériel (stock moins les quantités des prêts non
         rendus) ;
       - `POST /api/loans/:id/return` : marque le prêt comme rendu ; 409 s’il l’était déjà.
    5. Le corps est validé par un **middleware réutilisable** ; la requête et les paramètres
       de route sont validés dans les gestionnaires. Toute entrée invalide reçoit
       `400 { "error": "Requête invalide", "issues": [...] }`, une ressource absente 404. Un
       gestionnaire d’erreurs centralisé, typé avec `err: unknown`, produit toutes les
       réponses d’erreur, sans jamais exposer un message interne.
    6. Le calcul du stock restant est une fonction pure dans un module séparé.
    7. Tests `node:test` : au moins un fichier pour la fonction pure et un fichier de tests de
       routes (application neuve par test, port 0, statut **et** corps vérifiés, réponses
       lues avec les schémas du contrat). Au moins huit tests au total.

    Contraintes : aucun `any`, aucun `as` (sauf `as const`), aucun type écrit à la main pour
    une donnée qui a un schéma, aucune syntaxe Zod 3.
  deliverable: |
    Colle :

    1. l’arborescence du projet (sans `node_modules`) ;
    2. le contenu de `tsconfig.json`, `tsconfig.build.json`, du module de contrats, de la
       fonction pure, du middleware de validation, du gestionnaire d’erreurs et des routes ;
    3. le contenu de tes fichiers de test ;
    4. la sortie de `npm run check`, puis celle de `npm run build` suivie de la liste des
       fichiers de `dist/` ;
    5. la sortie de ces requêtes, serveur lancé avec `npm run dev` :
       `curl -s --json '{"item":"projector","borrower":" Ada ","quantity":2,"startDate":"2026-12-01","endDate":"2026-12-03"}' http://localhost:3000/api/loans`,
       la même requête une seconde fois,
       `curl -s "http://localhost:3000/api/loans?returned=false&limit=0"` et
       `curl -s --json '{"item":"drone","quantity":"2"}' http://localhost:3000/api/loans` ;
    6. en quelques lignes : ce que l’IA t’a apporté, et ce que tu as dû corriger ou vérifier.
  rubric:
    passRatio: 0.7
    criteria:
      - id: code-ownership
        description: Explique chaque partie de son code et de sa configuration sans aide.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des parties importantes de son propre projet.
          - score: 1
            description: Explique le déroulé global mais pas les options du tsconfig ni les génériques du middleware.
          - score: 2
            description: Explique précisément la configuration, le middleware, les schémas et le gestionnaire d’erreurs.
          - score: 3
            description: Explique aussi les choix écartés et ce qu’il a corrigé dans les propositions de l’IA.
      - id: runtime-validation
        description: Distingue ce que garantissent les types et ce que garantit la validation à l’exécution.
        maxScore: 3
        levels:
          - score: 0
            description: Pense qu’annoter req.body suffit à le valider.
          - score: 1
            description: Valide les entrées mais ne sait pas expliquer pourquoi un type ne suffit pas.
          - score: 2
            description: Explique l’effacement des types, le rôle de safeParse et l’origine du type de req.body.
          - score: 3
            description: Traite les cas subtils (coercition des booléens et des nombres, req.query en lecture seule, propriétés inconnues).
      - id: shared-contracts
        description: Organise schémas et types dans un module de contrats unique, importé partout.
        maxScore: 2
        levels:
          - score: 0
            description: Types dupliqués ou écrits à la main à côté des schémas.
          - score: 1
            description: Module de contrats présent mais quelques types recopiés ou un z.infer mal placé.
          - score: 2
            description: Une seule source de vérité, utilisée par les routes, les règles et les tests, avec import type à bon escient.
      - id: tests
        description: Teste la fonction pure et les routes de façon fiable.
        maxScore: 3
        levels:
          - score: 0
            description: Tests absents ou qui ne peuvent pas échouer.
          - score: 1
            description: Tests présents mais dépendants les uns des autres ou ne vérifiant pas le statut.
          - score: 2
            description: Tests indépendants, statut et corps vérifiés, réponses validées avec les schémas.
          - score: 3
            description: Couvre les cas limites (stock exactement épuisé, prêt déjà rendu) et justifie chaque cas.
      - id: modification
        description: Réalise ou décrit correctement une modification demandée pendant l’oral.
        maxScore: 3
        levels:
          - score: 0
            description: Ne parvient pas à modifier le comportement.
          - score: 1
            description: Modification partielle ou qui casse un cas existant.
          - score: 2
            description: Modification correcte, guidée par tsc, avec un test ou une requête de vérification.
          - score: 3
            description: Modification correcte, vérifiée sur plusieurs cas dont un cas limite, sans duplication introduite.

- id: typescript-node-contre-ia
  family: CONTRE_IA
  title: L’API de tâches qui passe tous ses tests
  summary: Trouver et corriger les défauts d’une API Express en TypeScript générée par une IA, dont les tests et tsc ne signalent rien.
  estimatedMinutes: 90
  instructions: |
    Un assistant a généré cette API de gestion de tâches. `npm run typecheck` ne signale
    **aucune erreur** et `npm test` affiche trois tests réussis : l’équipe pense pouvoir la
    déployer. Règles métier :

    - une tâche a un titre (1 à 100 caractères), une priorité (`low`, `normal` ou `high`,
      `normal` par défaut), une échéance facultative et un état `done` ;
    - `GET /api/tasks` trie les tâches par priorité (haute, normale, basse) ; `done=true` ou
      `done=false` filtre selon l’état ; `limit` est compris entre 1 et 100 ;
    - un client ne peut modifier que le titre, la priorité, l’échéance et `done` ;
    - toute entrée invalide reçoit une réponse 400 claire, jamais une 500, et aucune réponse ne
      révèle de détail interne ;
    - aucune requête ne doit pouvoir arrêter le serveur, même si l’enregistrement sur disque
      échoue.

    ```json
    {
      "name": "tasks-api",
      "version": "1.0.0",
      "type": "module",
      "scripts": {
        "dev": "node --watch src/server.ts",
        "typecheck": "tsc --noEmit",
        "test": "node --test"
      },
      "dependencies": {
        "express": "^5.3.0",
        "zod": "^4.6.7"
      },
      "devDependencies": {
        "@types/express": "^5.0.6",
        "@types/node": "^24.19.2",
        "typescript": "^7.0.2"
      }
    }
    ```

    ```json
    {
      "compilerOptions": {
        "target": "esnext",
        "module": "nodenext",
        "types": ["node"],
        "strict": false,
        "noEmit": true,
        "rewriteRelativeImportExtensions": true,
        "erasableSyntaxOnly": true,
        "verbatimModuleSyntax": true,
        "skipLibCheck": true
      },
      "include": ["src"]
    }
    ```

    ```ts
    // src/types.ts
    export type Priority = 'low' | 'medium' | 'high';

    export interface Task {
      id: number;
      title: string;
      priority: Priority;
      dueDate?: string;
      done: boolean;
      createdAt: string;
    }
    ```

    ```ts
    // src/contracts.ts
    import { z } from 'zod';

    export const createTaskSchema = z.object({
      title: z.string().trim().min(1).max(100),
      priority: z.enum(['low', 'normal', 'high']).default('normal'),
      dueDate: z.iso.date().optional(),
    });

    export const updateTaskSchema = createTaskSchema.partial().extend({
      done: z.boolean().optional(),
    });

    export const listTasksQuerySchema = z.object({
      done: z.coerce.boolean().optional(),
      limit: z.coerce.number().int().max(100).default(20),
    });

    export type CreateTaskInput = z.infer<typeof createTaskSchema>;
    export type UpdateTaskInput = z.infer<typeof createTaskSchema>;
    ```

    ```ts
    // src/store.ts
    import { writeFile } from 'node:fs/promises';
    import type { UpdateTaskInput } from './contracts.ts';
    import type { Priority, Task } from './types.ts';

    const tasks: Task[] = [];
    let nextId = 1;

    const priorityRank: Record<Priority, number> = { high: 0, medium: 1, low: 2 };

    // Sauvegarde une copie des tâches pour les retrouver au prochain démarrage
    async function persist(): Promise<void> {
      const file = process.env.DATA_FILE ?? 'data/tasks.json';
      await writeFile(file, JSON.stringify(tasks, null, 2));
    }

    export function listTasks(filters: { done?: boolean; limit: number }): Task[] {
      return tasks
        .filter((task) => filters.done === undefined || task.done === filters.done)
        .sort((a, b) => priorityRank[a.priority] - priorityRank[b.priority])
        .slice(0, filters.limit);
    }

    export function getTask(id) {
      return tasks.find((task) => task.id === id);
    }

    export async function addTask(input: Omit<Task, 'id' | 'done' | 'createdAt'>): Promise<Task> {
      const task: Task = { id: nextId++, done: false, createdAt: new Date().toISOString(), ...input };
      tasks.push(task);
      await persist();
      return task;
    }

    export async function updateTask(id: number, changes: UpdateTaskInput): Promise<Task | undefined> {
      const task = tasks.find((item) => item.id === id);
      if (!task) return undefined;
      Object.assign(task, changes);
      await persist();
      return task;
    }

    export async function removeTask(id: number): Promise<boolean> {
      const index = tasks.findIndex((item) => item.id === id);
      if (index === -1) return false;
      tasks.splice(index, 1);
      await persist();
      return true;
    }
    ```

    ```ts
    // src/app.ts
    import express from 'express';
    import type { ErrorRequestHandler, Request } from 'express';
    import { createTaskSchema, listTasksQuerySchema } from './contracts.ts';
    import type { UpdateTaskInput } from './contracts.ts';
    import { addTask, getTask, listTasks, removeTask, updateTask } from './store.ts';
    import type { Task } from './types.ts';

    export const app = express();
    app.use(express.json());

    app.get('/api/tasks', (req, res) => {
      const filters = listTasksQuerySchema.parse(req.query);
      res.json(listTasks(filters));
    });

    app.get('/api/tasks/:id', (req, res) => {
      const task = getTask(req.params.id);
      if (!task) {
        res.status(404).json({ error: 'Tâche introuvable' });
        return;
      }
      res.json(task);
    });

    app.post('/api/tasks', async (req, res) => {
      const input = createTaskSchema.parse(req.body);
      const task = await addTask(input as Omit<Task, 'id' | 'done' | 'createdAt'>);
      res.status(201).json(task);
    });

    app.patch('/api/tasks/:id', async (req: Request<{ id: string }, Task, UpdateTaskInput>, res) => {
      const task = await updateTask(Number(req.params.id), req.body);
      if (!task) {
        res.status(404).json({ error: 'Tâche introuvable' } as any);
        return;
      }
      res.json(task);
    });

    app.delete('/api/tasks/:id', (req, res) => {
      removeTask(Number(req.params.id)).then((removed) => {
        res.sendStatus(removed ? 204 : 404);
      });
    });

    const errorHandler: ErrorRequestHandler = (err, req, res, next) => {
      console.error(err);
      res.status(err.status || 500).json({ error: err.message });
    };
    app.use(errorHandler);
    ```

    ```ts
    // src/server.ts
    import { app } from './app.ts';

    const port = Number(process.env.PORT ?? 3000);
    app.listen(port, () => console.log(`API prête sur http://localhost:${port}`));
    ```

    ```ts
    // test/tasks.test.ts
    import { after, before, describe, it } from 'node:test';
    import assert from 'node:assert/strict';
    import type { AddressInfo } from 'node:net';
    import { app } from '../src/app.ts';
    import type { Task } from '../src/types.ts';

    describe('API des tâches', () => {
      let baseUrl: string;
      const server = app.listen(0);

      before(() => {
        baseUrl = `http://localhost:${(server.address() as AddressInfo).port}/api/tasks`;
      });

      after(() => server.close());

      it('crée une tâche', async () => {
        const response = await fetch(baseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Écrire le rapport', priority: 'high' }),
        });
        assert.equal(response.status, 201);
      });

      it('refuse un titre vide', async () => {
        const response = await fetch(baseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: '' }),
        });
        assert.ok(response.status >= 400);
      });

      it('marque une tâche comme faite', async () => {
        const response = await fetch(`${baseUrl}/1`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done: true }),
        });
        const task = (await response.json()) as Task;
        if (task.done) {
          assert.equal(task.done, true);
        }
      });
    });
    ```

    Travail demandé :

    1. Installe le projet et crée le dossier `data/`, où le serveur et les tests enregistrent
       les tâches, puis lance-le. Envoie des requêtes qui mettent les règles métier à l’épreuve : entrées invalides, tri,
       filtres, modification, suppression, et échec de l’enregistrement (par exemple
       `DATA_FILE=absent/tasks.json`).
    2. Liste chaque défaut trouvé : le fichier et l’extrait concerné, le symptôme observé ou
       possible, la cause précise, la gravité, et la requête ou l’entrée qui le révèle.
    3. Corrige le projet en modifiant le moins de code possible. Les tests doivent être
       corrigés eux aussi : un test qui ne peut pas échouer est un défaut.
    4. Explique pourquoi ni `tsc` ni les tests n’avaient rien signalé.
  deliverable: |
    Colle ta liste de défauts (fichier, extrait, symptôme, cause, gravité, requête
    révélatrice), puis le contenu complet des fichiers modifiés, la sortie de
    `npm run typecheck` et de `npm test` après correction, et ton explication du silence de
    `tsc` et des tests.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts réels, y compris ceux qui ne se manifestent qu’avec certaines entrées ou en cas de panne.
        maxScore: 3
      - id: root-cause
        description: Explique la cause technique de chaque défaut et pourquoi tsc et les tests ne l’ont pas vu.
        maxScore: 3
      - id: fix-quality
        description: Corrige de façon ciblée, avec une source de vérité unique et une validation à l’exécution.
        maxScore: 3
      - id: tests
        description: Rend les tests capables d’échouer et les fait vérifier par tsc.
        maxScore: 2

- id: typescript-node-apres-ia
  family: APRES_IA
  title: Les ateliers complets
  summary: Corriger un bug et faire évoluer une API Express en TypeScript existante sans la régénérer, en supprimant au passage une duplication de types.
  estimatedMinutes: 75
  instructions: |
    Cette API d’ateliers fonctionne et ses trois tests passent. Tu dois la faire évoluer **en
    modifiant le moins de code possible**, sans la régénérer. Elle utilise la même
    configuration que le cours : le `tsconfig.json` strict de `bookings-api` (qui inclut `src`
    et `test`), Node.js 24, Express 5, Zod 4, et les scripts `typecheck`, `test` et `check`.

    ```ts
    // src/types.ts
    export type Workshop = {
      id: number;
      title: string;
      date: string;
      capacity: number;
      registered: number;
    };

    export type CreateWorkshopInput = Omit<Workshop, 'id' | 'registered'>;
    ```

    ```ts
    // src/contracts.ts
    import { z } from 'zod';

    export const createWorkshopSchema = z.strictObject({
      title: z.string().trim().min(3).max(80),
      date: z.iso.date(),
      capacity: z.number().int().min(1).max(30),
    });

    export const listWorkshopsQuerySchema = z.object({
      available: z.coerce.boolean().optional(),
    });

    export const workshopIdParamsSchema = z.object({
      id: z.coerce.number().int().positive(),
    });
    ```

    ```ts
    // src/http.ts
    import type { NextFunction, Request, RequestHandler, Response } from 'express';
    import type { z } from 'zod';

    export class HttpError extends Error {
      readonly status: number;

      constructor(status: number, message: string) {
        super(message);
        this.status = status;
      }
    }

    export function parseInput<Schema extends z.ZodType>(schema: Schema, value: unknown): z.output<Schema> {
      const result = schema.safeParse(value);
      if (!result.success) {
        throw new HttpError(400, formatIssues(result.error));
      }
      return result.data;
    }

    export function validateBody<Schema extends z.ZodType>(
      schema: Schema,
    ): RequestHandler<Record<string, string>, unknown, z.output<Schema>> {
      return (req, res, next) => {
        req.body = parseInput(schema, req.body);
        next();
      };
    }

    function formatIssues(error: z.ZodError): string {
      return error.issues.map((issue) => `${issue.path.join('.')} : ${issue.message}`).join(' ; ');
    }

    export function errorHandler(err: unknown, req: Request, res: Response, next: NextFunction): void {
      if (err instanceof HttpError) {
        res.status(err.status).json({ error: err.message });
        return;
      }
      console.error(err);
      res.status(500).json({ error: 'Erreur interne du serveur' });
    }
    ```

    ```ts
    // src/routes.ts
    import { Router } from 'express';
    import type { Response } from 'express';
    import { createWorkshopSchema, listWorkshopsQuerySchema, workshopIdParamsSchema } from './contracts.ts';
    import { HttpError, parseInput, validateBody } from './http.ts';
    import type { Workshop } from './types.ts';

    export function createWorkshopsRouter(workshops: Workshop[]): Router {
      const router = Router();
      let nextId = workshops.length + 1;

      router.get('/', (req, res: Response<Workshop[]>) => {
        const { available } = parseInput(listWorkshopsQuerySchema, req.query);
        const result = workshops.filter(
          (workshop) => available === undefined || (workshop.registered < workshop.capacity) === available,
        );
        res.json(result);
      });

      router.post('/', validateBody(createWorkshopSchema), (req, res: Response<Workshop>) => {
        const workshop: Workshop = { id: nextId, registered: 0, ...req.body };
        nextId += 1;
        workshops.push(workshop);
        res.status(201).json(workshop);
      });

      router.patch('/:id', (req, res: Response<Workshop>) => {
        const { id } = parseInput(workshopIdParamsSchema, req.params);
        const workshop = workshops.find((item) => item.id === id);
        if (workshop === undefined) {
          throw new HttpError(404, `Atelier ${id} introuvable`);
        }
        Object.assign(workshop, req.body as Partial<Workshop>);
        res.json(workshop);
      });

      return router;
    }
    ```

    ```ts
    // src/app.ts
    import express from 'express';
    import type { Express } from 'express';
    import { errorHandler } from './http.ts';
    import { createWorkshopsRouter } from './routes.ts';
    import type { Workshop } from './types.ts';

    export function createApp(workshops: Workshop[] = []): Express {
      const app = express();
      app.use(express.json());
      app.use('/api/workshops', createWorkshopsRouter(workshops));
      app.use(errorHandler);
      return app;
    }
