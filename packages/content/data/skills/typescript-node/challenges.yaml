    import { once } from 'node:events';
    import type { Server } from 'node:http';
    import { createApp } from '../src/app.ts';

    describe('API /api/workshops', () => {
      let server: Server;
      let baseUrl: string;

      beforeEach(async () => {
        server = createApp([
          { id: 1, title: 'Découvrir Git', date: '2026-12-05', capacity: 12, registered: 12 },
          { id: 2, title: 'Premiers pas en SQL', date: '2026-12-12', capacity: 10, registered: 4 },
        ]).listen(0, '127.0.0.1');
        await once(server, 'listening');
        const address = server.address();
        if (address === null || typeof address === 'string') {
          throw new Error('Adresse inattendue');
        }
        baseUrl = `http://127.0.0.1:${address.port}/api/workshops`;
      });

      afterEach(() => {
        server.close();
      });

      it('GET ?available=true ne renvoie que les ateliers avec des places', async () => {
        const response = await fetch(`${baseUrl}?available=true`);
        assert.equal(response.status, 200);
        const body: unknown = await response.json();
        assert.deepEqual(body, [
          { id: 2, title: 'Premiers pas en SQL', date: '2026-12-12', capacity: 10, registered: 4 },
        ]);
      });

      it('POST crée un atelier et répond 201', async () => {
        const response = await fetch(baseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: ' Tests avec node:test ', date: '2026-12-19', capacity: 8 }),
        });
        assert.equal(response.status, 201);
        assert.deepEqual(await response.json(), {
          id: 3,
          registered: 0,
          title: 'Tests avec node:test',
          date: '2026-12-19',
          capacity: 8,
        });
      });

      it('POST refuse une capacité de 0 avec 400', async () => {
        const response = await fetch(baseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Atelier vide', date: '2026-12-19', capacity: 0 }),
        });
        assert.equal(response.status, 400);
      });
    });
