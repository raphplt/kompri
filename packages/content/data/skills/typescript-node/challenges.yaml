- id: typescript-node-apres-ia
  family: APRES_IA
  title: Les ateliers complets
  summary: Corriger un bug et faire évoluer une API Express en TypeScript existante sans la régénérer,
    en supprimant au passage une duplication de types.
  estimatedMinutes: 75
  instructions: "Cette API d’ateliers fonctionne et ses trois tests passent. Tu dois la faire évoluer\
    \ **en\nmodifiant le moins de code possible**, sans la régénérer. Elle utilise la même\nconfiguration\
    \ que le cours : le `tsconfig.json` strict de `bookings-api` (qui inclut `src`\net `test`), Node.js\
    \ 24, Express 5, Zod 4, et les scripts `typecheck`, `test` et `check`.\n\n```ts\n// src/types.ts\n\
    export type Workshop = {\n  id: number;\n  title: string;\n  date: string;\n  capacity: number;\n\
    \  registered: number;\n};\n\nexport type CreateWorkshopInput = Omit<Workshop, 'id' | 'registered'>;\n\
    ```\n\n```ts\n// src/contracts.ts\nimport { z } from 'zod';\n\nexport const createWorkshopSchema =\
    \ z.strictObject({\n  title: z.string().trim().min(3).max(80),\n  date: z.iso.date(),\n  capacity:\
    \ z.number().int().min(1).max(30),\n});\n\nexport const listWorkshopsQuerySchema = z.object({\n  available:\
    \ z.coerce.boolean().optional(),\n});\n\nexport const workshopIdParamsSchema = z.object({\n  id: z.coerce.number().int().positive(),\n\
    });\n```\n\n```ts\n// src/http.ts\nimport type { NextFunction, Request, RequestHandler, Response }\
    \ from 'express';\nimport type { z } from 'zod';\n\nexport class HttpError extends Error {\n  readonly\
    \ status: number;\n\n  constructor(status: number, message: string) {\n    super(message);\n    this.status\
    \ = status;\n  }\n}\n\nexport function parseInput<Schema extends z.ZodType>(schema: Schema, value:\
    \ unknown): z.output<Schema> {\n  const result = schema.safeParse(value);\n  if (!result.success)\
    \ {\n    throw new HttpError(400, formatIssues(result.error));\n  }\n  return result.data;\n}\n\n\
    export function validateBody<Schema extends z.ZodType>(\n  schema: Schema,\n): RequestHandler<Record<string,\
    \ string>, unknown, z.output<Schema>> {\n  return (req, res, next) => {\n    req.body = parseInput(schema,\
    \ req.body);\n    next();\n  };\n}\n\nfunction formatIssues(error: z.ZodError): string {\n  return\
    \ error.issues.map((issue) => `${issue.path.join('.')} : ${issue.message}`).join(' ; ');\n}\n\nexport\
    \ function errorHandler(err: unknown, req: Request, res: Response, next: NextFunction): void {\n \
    \ if (err instanceof HttpError) {\n    res.status(err.status).json({ error: err.message });\n    return;\n\
    \  }\n  console.error(err);\n  res.status(500).json({ error: 'Erreur interne du serveur' });\n}\n\
    ```\n\n```ts\n// src/routes.ts\nimport { Router } from 'express';\nimport type { Response } from 'express';\n\
    import { createWorkshopSchema, listWorkshopsQuerySchema, workshopIdParamsSchema } from './contracts.ts';\n\
    import { HttpError, parseInput, validateBody } from './http.ts';\nimport type { Workshop } from './types.ts';\n\
    \nexport function createWorkshopsRouter(workshops: Workshop[]): Router {\n  const router = Router();\n\
    \  let nextId = workshops.length + 1;\n\n  router.get('/', (req, res: Response<Workshop[]>) => {\n\
    \    const { available } = parseInput(listWorkshopsQuerySchema, req.query);\n    const result = workshops.filter(\n\
    \      (workshop) => available === undefined || (workshop.registered < workshop.capacity) === available,\n\
    \    );\n    res.json(result);\n  });\n\n  router.post('/', validateBody(createWorkshopSchema), (req,\
    \ res: Response<Workshop>) => {\n    const workshop: Workshop = { id: nextId, registered: 0, ...req.body\
    \ };\n    nextId += 1;\n    workshops.push(workshop);\n    res.status(201).json(workshop);\n  });\n\
    \n  router.patch('/:id', (req, res: Response<Workshop>) => {\n    const { id } = parseInput(workshopIdParamsSchema,\
    \ req.params);\n    const workshop = workshops.find((item) => item.id === id);\n    if (workshop ===\
    \ undefined) {\n      throw new HttpError(404, `Atelier ${id} introuvable`);\n    }\n    Object.assign(workshop,\
    \ req.body as Partial<Workshop>);\n    res.json(workshop);\n  });\n\n  return router;\n}\n```\n\n\
    ```ts\n// src/app.ts\nimport express from 'express';\nimport type { Express } from 'express';\nimport\
    \ { errorHandler } from './http.ts';\nimport { createWorkshopsRouter } from './routes.ts';\nimport\
    \ type { Workshop } from './types.ts';\n\nexport function createApp(workshops: Workshop[] = []): Express\
    \ {\n  const app = express();\n  app.use(express.json());\n  app.use('/api/workshops', createWorkshopsRouter(workshops));\n\
    \  app.use(errorHandler);\n  return app;\n}\n```\n\n```ts\n// src/server.ts\nimport { createApp }\
    \ from './app.ts';\n\nconst app = createApp([\n  { id: 1, title: 'Découvrir Git', date: '2026-12-05',\
    \ capacity: 12, registered: 12 },\n  { id: 2, title: 'Premiers pas en SQL', date: '2026-12-12', capacity:\
    \ 10, registered: 4 },\n]);\nconst port = Number(process.env.PORT ?? 3000);\napp.listen(port, () =>\
    \ console.log(`API prête sur http://localhost:${port}`));\n```\n\n```ts\n// test/workshops.test.ts\n\
    import { afterEach, beforeEach, describe, it } from 'node:test';\nimport assert from 'node:assert/strict';\n\
    import { once } from 'node:events';\nimport type { Server } from 'node:http';\nimport { createApp\
    \ } from '../src/app.ts';\n\ndescribe('API /api/workshops', () => {\n  let server: Server;\n  let\
    \ baseUrl: string;\n\n  beforeEach(async () => {\n    server = createApp([\n      { id: 1, title:\
    \ 'Découvrir Git', date: '2026-12-05', capacity: 12, registered: 12 },\n      { id: 2, title: 'Premiers\
    \ pas en SQL', date: '2026-12-12', capacity: 10, registered: 4 },\n    ]).listen(0, '127.0.0.1');\n\
    \    await once(server, 'listening');\n    const address = server.address();\n    if (address ===\
    \ null || typeof address === 'string') {\n      throw new Error('Adresse inattendue');\n    }\n  \
    \  baseUrl = `http://127.0.0.1:${address.port}/api/workshops`;\n  });\n\n  afterEach(() => {\n   \
    \ server.close();\n  });\n\n  it('GET ?available=true ne renvoie que les ateliers avec des places',\
    \ async () => {\n    const response = await fetch(`${baseUrl}?available=true`);\n    assert.equal(response.status,\
    \ 200);\n    const body: unknown = await response.json();\n    assert.deepEqual(body, [\n      { id:\
    \ 2, title: 'Premiers pas en SQL', date: '2026-12-12', capacity: 10, registered: 4 },\n    ]);\n \
    \ });\n\n  it('POST crée un atelier et répond 201', async () => {\n    const response = await fetch(baseUrl,\
    \ {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({\
    \ title: ' Tests avec node:test ', date: '2026-12-19', capacity: 8 }),\n    });\n    assert.equal(response.status,\
    \ 201);\n    assert.deepEqual(await response.json(), {\n      id: 3,\n      registered: 0,\n     \
    \ title: 'Tests avec node:test',\n      date: '2026-12-19',\n      capacity: 8,\n    });\n  });\n\n\
    \  it('POST refuse une capacité de 0 avec 400', async () => {\n    const response = await fetch(baseUrl,\
    \ {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({\
    \ title: 'Atelier vide', date: '2026-12-19', capacity: 0 }),\n    });\n    assert.equal(response.status,\
    \ 400);\n  });\n});\n```\n\nDemandes de l’équipe :\n\n1. **Bug signalé** : la page « ateliers complets\
    \ » appelle\n   `GET /api/workshops?available=false` et affiche… les ateliers qui ont encore des\n\
    \   places. Trouve la cause, corrige-la, et ajoute le test qui l’aurait détecté.\n2. **Évolution**\
    \ : chaque atelier a désormais un niveau, `beginner`, `intermediate` ou\n   `advanced`, obligatoire\
    \ à la création et filtrable avec `GET /api/workshops?level=…`.\n   Le type `Workshop` existe aujourd’hui\
    \ en double (à la main dans `types.ts`, implicitement\n   dans le schéma) : fais en sorte qu’il n’y\
    \ ait plus qu’**une** définition, dont les types\n   sont déduits, avant d’ajouter le champ.\n3. **Sécurité**\
    \ : la route `PATCH` accepte n’importe quoi (essaie\n   `{\"registered\":99,\"capacity\":\"beaucoup\"\
    ,\"id\":7}`). Valide son corps : seuls `title`,\n   `date`, `capacity` et `level` sont modifiables,\
    \ chacun avec les règles de la création.\n4. Ajoute des tests pour le filtre `level`, le refus d’un\
    \ atelier sans niveau et le refus\n   d’un `PATCH` sur `registered`. Les tests existants doivent continuer\
    \ à passer (adapte\n   seulement leurs données).\n"
  deliverable: 'Colle les fichiers modifiés (en entier), la liste des lignes modifiées ou supprimées avec

    la raison de chaque changement, la sortie de `npm run typecheck` juste après l’ajout du

    niveau au contrat (avant d’adapter les autres fichiers), puis la sortie finale de

    `npm run check`.

    '
  rubric:
    passRatio: 0.7
    criteria:
    - id: bug-diagnosis
      description: Explique la cause du bug par la coercition booléenne et le corrige avec un test qui
