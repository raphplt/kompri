- id: http-in-depth-apres-ia
  family: APRES_IA
  title: La cantine coupée en deux
  summary: Dépanner une application dont l’interface et l’API ont été séparées, avec les outils du navigateur,
    curl et des corrections minimales d’en-têtes et de statuts.
  estimatedMinutes: 75
  instructions: "La cantine d’un collège avait une petite application : une page qui affiche le menu\n\
    du jour et permet de commander. Pour « moderniser », une IA a séparé l’interface et\nl’API en deux\
    \ serveurs. Depuis, rien ne va. Tu dois remettre l’application en état\n**en modifiant le moins de\
    \ choses possible**, sans régénérer le projet.\n\nArborescence :\n\n```text\napi.mjs            API,\
    \ port 3000\nfront.mjs          serveur de l’interface, port 5173\npublic/index.html\npublic/app.js\n\
    ```\n\n`api.mjs` :\n\n```js\nimport { createServer } from 'node:http';\n\nconst cookToken = process.env.COOK_TOKEN;\n\
    let menu = {\n  date: '2026-11-23',\n  dishes: ['Lentilles corail', 'Gratin de courge'],\n};\nconst\
    \ orders = [];\n\nfunction sendJson(res, status, data, headers = {}) {\n  const body = `${JSON.stringify(data)}\\\
    n`;\n  res.writeHead(status, {\n    'Content-Type': 'application/json; charset=utf-8',\n    'Content-Length':\
    \ Buffer.byteLength(body),\n    ...headers,\n  });\n  res.end(body);\n}\n\nasync function readJson(req)\
    \ {\n  let raw = '';\n  for await (const chunk of req) raw += chunk;\n  return JSON.parse(raw);\n\
    }\n\nasync function handle(req, res) {\n  const { pathname } = new URL(req.url, 'http://localhost');\n\
    \n  if (pathname === '/api/menu' && req.method === 'GET') {\n    return sendJson(res, 200, menu, {\n\
    \      'Cache-Control': 'public, max-age=86400',\n    });\n  }\n\n  if (pathname === '/api/menu' &&\
    \ req.method === 'PUT') {\n    if (!cookToken || req.headers.authorization !== `Bearer ${cookToken}`)\
    \ {\n      return sendJson(\n        res,\n        401,\n        { error: 'Réservé à la cuisine' },\n\
    \        {\n          'WWW-Authenticate': 'Bearer',\n        },\n      );\n    }\n    const input\
    \ = await readJson(req);\n    if (typeof input?.date !== 'string' || !Array.isArray(input?.dishes))\
    \ {\n      return sendJson(res, 400, { error: 'date et dishes sont obligatoires' });\n    }\n    menu\
    \ = { date: input.date, dishes: input.dishes };\n    return sendJson(res, 200, menu);\n  }\n\n  if\
    \ (pathname === '/api/orders' && req.method === 'POST') {\n    if (!req.headers['content-type']?.startsWith('application/json'))\
    \ {\n      return sendJson(res, 415, { error: 'Corps JSON attendu' });\n    }\n    const input = await\
    \ readJson(req);\n    if (typeof input?.name !== 'string' || !menu.dishes.includes(input?.dish)) {\n\
    \      return sendJson(res, 400, { error: 'Nom ou plat invalide' });\n    }\n    const order = { id:\
    \ orders.length + 1, name: input.name, dish: input.dish };\n    orders.push(order);\n    return sendJson(res,\
    \ 200, order);\n  }\n\n  return sendJson(res, 404, { error: 'Ressource introuvable' });\n}\n\nconst\
    \ server = createServer(async (req, res) => {\n  try {\n    await handle(req, res);\n  } catch (error)\
    \ {\n    if (error instanceof SyntaxError) {\n      return sendJson(res, 400, { error: 'JSON invalide'\
    \ });\n    }\n    console.error(error);\n    sendJson(res, 500, { error: 'Erreur interne' });\n  }\n\
    });\n\nserver.listen(3000, () =>\n  console.log('API de la cantine sur http://localhost:3000'),\n\
    );\n```\n\n`front.mjs` (fonctionne correctement, à ne pas modifier) :\n\n```js\nimport { createServer\
    \ } from 'node:http';\nimport { readFile } from 'node:fs/promises';\n\nconst types = {\n  '/index.html':\
    \ 'text/html; charset=utf-8',\n  '/app.js': 'text/javascript; charset=utf-8',\n};\n\nconst server\
    \ = createServer(async (req, res) => {\n  const { pathname } = new URL(req.url, 'http://localhost');\n\
    \  const file = pathname === '/' ? '/index.html' : pathname;\n  if (!types[file]) {\n    res.writeHead(404,\
    \ { 'Content-Type': 'text/plain; charset=utf-8' });\n    return res.end('Introuvable\\n');\n  }\n\
    \  const body = await readFile(new URL(`./public${file}`, import.meta.url));\n  res.writeHead(200,\
    \ { 'Content-Type': types[file] });\n  res.end(body);\n});\n\nserver.listen(5173, () => console.log('Interface\
    \ sur http://localhost:5173'));\n```\n\n`public/index.html` :\n\n```html\n<!doctype html>\n<html lang=\"\
    fr\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Cantine</title>\n    <script src=\"app.js\"\
    \ type=\"module\"></script>\n  </head>\n  <body>\n    <h1>Menu du jour</h1>\n    <ul id=\"dishes\"\
    ></ul>\n    <form id=\"order-form\">\n      <label>Prénom <input name=\"name\" required></label>\n\
    \      <label>Plat <input name=\"dish\" required></label>\n      <button>Commander</button>\n    </form>\n\
    \    <p id=\"status\" role=\"status\"></p>\n  </body>\n</html>\n```\n\n`public/app.js` (à ne pas modifier\
    \ : il est déjà utilisé par l’application mobile\nde la cantine, qui suit la même logique) :\n\n```js\n\
    const apiUrl = 'http://localhost:3000';\nconst list = document.querySelector('#dishes');\nconst statusText\
    \ = document.querySelector('#status');\nconst form = document.querySelector('#order-form');\n\nasync\
    \ function loadMenu() {\n  const response = await fetch(`${apiUrl}/api/menu`);\n  const menu = await\
    \ response.json();\n  for (const dish of menu.dishes) {\n    const item = document.createElement('li');\n\
    \    item.textContent = dish;\n    list.append(item);\n  }\n}\n\nform.addEventListener('submit', async\
    \ (event) => {\n  event.preventDefault();\n  const response = await fetch(`${apiUrl}/api/orders`,\
    \ {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({\n\
    \      name: form.elements.name.value,\n      dish: form.elements.dish.value,\n    }),\n  });\n  statusText.textContent\
    \ =\n    response.status === 201\n      ? 'Commande enregistrée'\n      : `Erreur ${response.status}`;\n\
    });\n\nloadMenu();\n```\n\nLancement, dans deux terminaux :\n\n```bash\nCOOK_TOKEN=chef-secret node\
    \ api.mjs\nnode front.mjs\n```\n\nPuis ouvre `http://localhost:5173/` avec les outils de développement.\n\
    \nProblèmes signalés, à traiter dans l’ordre :\n\n1. Le menu ne s’affiche plus.\n2. Une fois le menu\
    \ réparé, le bouton « Commander » ne fonctionne pas.\n3. Une fois les commandes envoyées, la page\
    \ affiche « Erreur 200 » alors que la\n   commande est bien enregistrée.\n4. Le cuisinier met à jour\
    \ le menu avec la commande ci-dessous, mais les élèves\n   voient encore l’ancien menu en rechargeant\
    \ la page, et ce jusqu’au lendemain.\n\n```bash\ncurl -i -X PUT -H 'Authorization: Bearer chef-secret'\
    \ --json '{\"date\":\"2026-11-24\",\"dishes\":[\"Soupe de potiron\",\"Riz cantonais\"]}' http://localhost:3000/api/menu\n\
    ```\n\nPour chaque problème : décris ce que montrent la console et le panneau Réseau,\nexplique la\
    \ cause en termes HTTP, applique la correction minimale dans `api.mjs`,\net donne une commande curl\
    \ qui prouve que la correction est en place.\n"
  deliverable: 'Colle le contenu final de `api.mjs`, la liste des lignes modifiées ou ajoutées avec

    la raison de chacune, puis pour chaque problème : observation, cause, correction et

    commande curl de vérification avec un extrait de sa sortie.

    '
  rubric:
    passRatio: 0.7
    criteria:
    - id: cors-diagnosis
      description: Diagnostique les deux échecs CORS à partir de la console et du panneau Réseau.
      maxScore: 3
    - id: status-and-cache
      description: Corrige le code de statut de création et la politique de cache en les expliquant.
      maxScore: 3
    - id: verification
      description: Prouve chaque correction par une commande curl et une observation dans le navigateur.
      maxScore: 2
    - id: minimal-change
      description: Fait évoluer le code existant de façon ciblée.
      maxScore: 2
