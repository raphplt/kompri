- id: css-layout-responsive-sans-ia
  family: SANS_IA
  title: La page de la Fête des jardins
  summary: Mettre en page une page d’événement mobile d’abord avec flexbox, grid, le positionnement et une typographie fluide.
  estimatedMinutes: 60
  instructions: |
    Tu mets en page la page d’un événement. Travaille sans aide : ni IA, ni recherche
    en ligne. L’inspecteur du navigateur et son mode responsive sont autorisés.

    Voici `index.html`, que tu ne dois **pas** modifier. Les images peuvent être
    remplacées par n’importe quels fichiers de mêmes noms pour tes essais.

    ```html
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Fête des jardins</title>
        <link rel="stylesheet" href="event.css">
      </head>
      <body>
        <header class="site-header">
          <a class="brand" href="index.html">Fête des jardins</a>
          <nav>
            <ul class="nav-list">
              <li><a href="#programme">Programme</a></li>
              <li><a href="#infos">Infos pratiques</a></li>
              <li><a href="inscription.html">S’inscrire</a></li>
            </ul>
          </nav>
        </header>
        <div class="layout">
          <main class="content">
            <h1>Fête des jardins</h1>
            <section id="programme">
              <h2>Ateliers</h2>
              <ul class="workshops">
                <li class="workshop">
                  <img src="semis.jpg" width="800" height="600" alt="Mains qui sèment des graines">
                  <h3>Semis de printemps</h3>
                  <p>10 h – 11 h</p>
                </li>
                <li class="workshop">
                  <span class="badge">Complet</span>
                  <img src="compost.jpg" width="1200" height="800" alt="Bac à compost en bois">
                  <h3>Réussir son compost</h3>
                  <p>11 h – 12 h</p>
                </li>
                <li class="workshop">
                  <img src="greffe.jpg" width="600" height="800" alt="Greffe d’un jeune pommier">
                  <h3>Initiation à la greffe</h3>
                  <p>14 h – 15 h 30</p>
                </li>
                <li class="workshop">
                  <img src="abeilles.jpg" width="800" height="600" alt="Abeilles sur une fleur de lavande">
                  <h3>Accueillir les pollinisateurs</h3>
                  <p>16 h – 17 h</p>
                </li>
              </ul>
            </section>
          </main>
          <aside id="infos" class="infos">
            <h2>Infos pratiques</h2>
            <p>Samedi 6 juin, de 10 h à 18 h, au parc des Glycines. Entrée libre.</p>
          </aside>
        </div>
        <footer class="site-footer">
          <p>Organisé par l’association Les Jardins partagés.</p>
        </footer>
      </body>
    </html>
    ```

    ## Partie 1 — La feuille `event.css`

    Écris la feuille **mobile d’abord**, avec au plus deux media queries en `rem` :

    1. L’en-tête reste collé en haut de la fenêtre pendant le défilement, sans masquer
       le début du contenu au chargement. Le nom de l’événement est à gauche, la
       navigation à droite ; les liens sont côte à côte et passent à la ligne si la
       place manque.
    2. Les ateliers forment une grille qui crée **autant de colonnes que possible**,
       chacune d’au moins 14rem, **sans media query**, avec 1rem d’écart.
    3. Toutes les photos d’ateliers occupent la largeur de leur carte, au format 4/3,
       recadrées sans déformation, sans espace parasite en dessous.
    4. Le badge « Complet » est placé dans le coin supérieur droit de **sa** carte.
    5. À partir de 48rem, le contenu principal et l’encadré « Infos pratiques » sont côte
       à côte (encadré de 18rem à droite) ; l’ensemble ne dépasse pas 72rem de large et
       se centre.
    6. Le titre `h1` a une taille fluide comprise entre 2rem et 3rem, qui garde une part
       en `rem`.
    7. Aucune barre de défilement horizontale à 320 px de large.

    ## Partie 2 — Raisonner sans exécuter

    Réponds d’abord par écrit, puis vérifie dans le navigateur. Si ta prédiction était
    fausse, garde-la et explique ton erreur.

    a. La liste des ateliers mesure exactement 700 px de large (police par défaut de
       16 px). Combien de colonnes y a-t-il, et quelle est leur largeur ? Et à 704 px ?
    b. Si on retirait la règle qui permet au badge de se placer dans sa carte, où
       apparaîtrait-il ? Pourquoi ?
    c. Pourquoi `display: flex` sur l’élément `nav` ne mettrait-il pas les liens côte à
       côte ?
  deliverable: |
    Colle le contenu complet de `event.css`, puis tes réponses aux questions a, b et c
    (prédiction, vérification, explication de l’écart éventuel). Indique les largeurs de
    fenêtre auxquelles tu as testé ta page.
  rubric:
    passRatio: 0.7
    criteria:
      - id: flexbox
        description: Utilise flexbox sur le bon conteneur et explique axes, alignement et passage à la ligne.
        maxScore: 3
        levels:
          - score: 0
            description: Flexbox absent, mal placé, ou incapacité à expliquer ce qu’il fait.
          - score: 1
            description: En-tête fonctionnel mais explication confuse des axes ou du rôle des enfants directs.
          - score: 2
            description: Explique enfants directs, axe principal, justify-content, align-items et flex-wrap.
          - score: 3
            description: Compare aussi plusieurs solutions (space-between ou marge auto) et anticipe le comportement sur petit écran.
      - id: grid
        description: Construit et calcule une grille adaptative et une mise en page en deux colonnes.
        maxScore: 3
        levels:
          - score: 0
            description: Grille absente ou incapacité à prédire le nombre de colonnes.
          - score: 1
            description: Grille fonctionnelle mais calcul des colonnes faux (gap oublié).
          - score: 2
            description: Calcule correctement 2 colonnes à 700 px et 3 à 704 px, explique auto-fit, minmax et fr.
          - score: 3
            description: Explique aussi auto-fill, minmax(0, 1fr) et le passage à une colonne dans la zone principale étroite.
      - id: positioning
        description: Maîtrise le positionnement relatif, absolu et collant et leurs conséquences sur le flux.
        maxScore: 2
        levels:
          - score: 0
            description: Badge mal placé ou ne sait pas expliquer le bloc de référence.
          - score: 1
            description: Badge correct mais explication approximative, ou en-tête fixe qui masque le contenu.
          - score: 2
            description: Explique ancêtre positionné, bloc conteneur initial et différence entre sticky et fixed.
      - id: responsive
        description: Applique mobile d’abord, des unités relatives, des images adaptatives et une typographie fluide accessible.
        maxScore: 3
        levels:
          - score: 0
            description: Largeurs fixes, défilement horizontal ou images déformées.
          - score: 1
            description: Page utilisable mais media queries en bureau d’abord ou en px, ou titre en vw seul.
          - score: 2
            description: Mobile d’abord en rem, images recadrées sans déformation, clamp avec une part en rem.
          - score: 3
            description: Justifie aussi height auto avec les attributs, la limite de vw face au zoom et ses largeurs de test.

- id: css-layout-responsive-avec-ia
  family: AVEC_IA
  title: La vitrine d’un atelier de céramique
  summary: Construire avec une IA une page d’accueil responsive complète, puis justifier chaque choix de mise en page et le tester méthodiquement.
  estimatedMinutes: 120
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu devras expliquer chaque
    règle sans aide, prévoir l’effet d’une modification de largeur et corriger
    toi-même une mise en page.

    Un atelier de céramique veut une page d’accueil. Tu écris le HTML et le CSS. Contenu
    attendu :

    - un en-tête avec le nom de l’atelier et une navigation de quatre liens ;
    - une bannière avec une grande photo, un titre et un lien « Réserver un cours » ;
    - une section « Nos créations » avec au moins six pièces (photo, nom, prix) ;
    - une section « Les cours » avec trois formules présentées côte à côte sur grand
      écran, dont la formule centrale mise en avant par un badge « Le plus choisi » ;
    - un pied de page en trois blocs (adresse, horaires, réseaux).

    Exigences techniques :

    1. Mobile d’abord, avec **au plus trois** points de rupture, en `rem`, choisis
       selon le contenu. Pour chacun, explique dans un commentaire CSS ce qui casserait
       sans lui.
    2. Flexbox **et** grid sont utilisés, chacun là où il est le plus adapté. Aucune
       largeur fixe en pixels pour la mise en page (les bordures et petits détails sont
       acceptés).
    3. La photo de la bannière utilise `srcset` et `sizes` (trois fichiers de largeurs
       différentes, noms au choix) ; les photos des créations ont toutes le même format,
       recadrées sans déformation, avec leurs attributs `width` et `height`.
    4. Le titre de la bannière a une taille fluide avec `clamp()` qui garde une part en
       `rem`.
    5. Les trois formules ont la même hauteur et leur bouton aligné en bas, quelle que
       soit la longueur des textes.
    6. La page est utilisable à 320 px de large sans défilement horizontal et reste
       lisible avec un zoom à 200 %. L’ordre visuel suit l’ordre du HTML.
    7. Les propriétés personnalisées regroupent couleurs et espacements.

    Conseil : demande à l’IA pourquoi elle choisit flexbox ou grid à chaque endroit,
    puis vérifie ses affirmations en redimensionnant la fenêtre dans le mode
    responsive de l’inspecteur.
  deliverable: |
    Colle :
    - le HTML et le CSS complets ;
    - un tableau de tests : largeurs essayées (au moins 320, 768, 1024 et 1440 px), zoom
      à 200 %, et pour chacun ce que tu as observé et éventuellement corrigé ;
    - pour chaque utilisation de flexbox et de grid, une phrase qui justifie le choix ;
    - le fichier d’image que le navigateur choisit pour la bannière à 360 px de large
      avec une densité de 2, et comment tu l’as vérifié (par exemple `currentSrc` dans
      la console) ;
    - en quelques lignes : ce que l’IA t’a apporté, et ce que tu as dû corriger.
  rubric:
    passRatio: 0.7
    criteria:
      - id: code-ownership
        description: Explique chaque règle de mise en page sans aide, y compris celles proposées par l’IA.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des règles importantes de sa propre page.
          - score: 1
            description: Explique le rôle global des règles mais pas le calcul des tailles ou des colonnes.
          - score: 2
            description: Explique précisément chaque conteneur flex ou grid, les tailles produites et les points de rupture.
          - score: 3
            description: Explique aussi les propositions de l’IA qu’il a rejetées ou corrigées, avec la raison.
      - id: layout-choices
        description: Justifie le choix entre flexbox et grid et prédit le résultat d’une modification.
        maxScore: 3
        levels:
          - score: 0
            description: Choix arbitraires, incapacité à prédire un changement.
          - score: 1
            description: Justifications génériques sans lien avec le contenu.
          - score: 2
            description: Justifie chaque choix (un axe ou deux, tailles venues du contenu ou du conteneur) et prédit correctement.
          - score: 3
            description: Réalise une modification demandée en direct et anticipe ses effets sur toutes les largeurs.
      - id: responsive-testing
        description: Teste méthodiquement la page sur plusieurs largeurs et au zoom, et corrige les problèmes trouvés.
        maxScore: 3
        levels:
          - score: 0
            description: Aucun test documenté, ou défilement horizontal non détecté.
          - score: 1
            description: Tests partiels, sans correction ou sans le zoom à 200 %.
          - score: 2
            description: Tests complets, problèmes corrigés et expliqués.
          - score: 3
            description: Explique aussi la vérification de l’image choisie par srcset et les limites de la simulation.
      - id: accessibility
        description: Préserve l’accessibilité de la mise en page (ordre, zoom, textes alternatifs, typographie).
        maxScore: 2
        levels:
          - score: 0
            description: Ordre visuel incohérent avec le HTML, texte en vw seul ou zoom cassé.
          - score: 1
            description: Accessibilité respectée en partie, sans justification.
          - score: 2
            description: Ordre logique, typographie qui suit le zoom, alternatives textuelles pertinentes, justifiés à l’oral.

- id: css-layout-responsive-contre-ia
  family: CONTRE_IA
  title: La boutique qui déborde
  summary: Trouver et corriger les défauts de mise en page et de responsive d’une page produit générée.
  estimatedMinutes: 60
  instructions: |
    Une ressourcerie a fait générer la page de sa boutique en ligne par un assistant.
    Sur ordinateur, « ça passe à peu près » ; sur téléphone, les clients se plaignent.
    Voici les deux fichiers.

    `index.html` :

    ```html
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <title>La Ressourcerie — Boutique</title>
        <link rel="stylesheet" href="shop.css">
      </head>
      <body>
        <header class="site-header">
          <a class="brand" href="index.html">La Ressourcerie</a>
          <nav class="site-nav">
            <ul>
              <li><a href="meubles.html">Meubles</a></li>
              <li><a href="vaisselle.html">Vaisselle</a></li>
              <li><a href="livres.html">Livres</a></li>
            </ul>
          </nav>
        </header>
        <main class="container">
          <h1>Objets de seconde main</h1>
          <ul class="products">
            <li class="product">
              <span class="badge">Nouveau</span>
              <img src="chaise.jpg" width="1200" height="800" alt="Chaise en bois peinte en vert">
              <div class="product-info">
                <div class="product-details">
                  <h2 class="product-name">Chaise bistrot</h2>
                  <p class="product-ref">Réf. MEUBLE_CHAISE_BISTROT_BOIS_PEINT_2026_000147</p>
                </div>
                <p class="product-price">25 €</p>
              </div>
            </li>
            <li class="product">
              <img src="bols.jpg" width="600" height="600" alt="Six bols en grès bleu">
              <div class="product-info">
                <div class="product-details">
                  <h2 class="product-name">Lot de six bols</h2>
                  <p class="product-ref">Réf. VAISSELLE_BOL_GRES_BLEU_LOT6_2026_000212</p>
                </div>
                <p class="product-price">12 €</p>
              </div>
            </li>
            <li class="product">
              <span class="badge">Nouveau</span>
              <img src="lampe.jpg" width="800" height="1200" alt="Lampe de bureau articulée en métal noir">
              <div class="product-info">
                <div class="product-details">
                  <h2 class="product-name">Lampe d’architecte</h2>
                  <p class="product-ref">Réf. LUMINAIRE_LAMPE_BUREAU_ARTICULEE_2026_000098</p>
                </div>
                <p class="product-price">18 €</p>
              </div>
            </li>
          </ul>
        </main>
      </body>
    </html>
    ```

    `shop.css` :

    ```css
    /* Boutique en ligne, feuille proposée par un assistant */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background-color: white;
      border-bottom: 1px solid #d1d5db;
    }

    .site-nav {
      display: flex;
      gap: 1rem;
    }

    .site-nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      font-size: 5vw;
      line-height: 1.2;
    }

    @media (min-width: 48rem) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .products {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .product {
      display: flex;
      flex-direction: column;
      border: 1px solid #d1d5db;
    }

    .product img {
      max-width: 100%;
    }

    .badge {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      padding: 0.125rem 0.5rem;
      background-color: darkred;
      color: white;
    }

    .product-info {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
    }

    .product-details {
      flex: 1;
    }

    .product-name {
      margin: 0;
      font-size: 1.25rem;
    }

    .product-ref {
      margin: 0;
      color: #4b5563;
      font-size: 0.875rem;
    }

    .product-price {
      margin: 0;
      font-weight: bold;
    }
    ```

    Ce que voulait la ressourcerie : une page mobile d’abord, une colonne de produits sur
    téléphone et trois à partir de 48rem, un en-tête toujours accessible qui ne cache
    rien, une navigation en ligne, des photos non déformées, un badge « Nouveau » dans le
    coin de chaque produit concerné, aucun défilement horizontal, un titre lisible et
    qui suit le zoom.

    Travail demandé :

    1. Teste la page dans le mode responsive de l’inspecteur (au moins à 375 px et à
       1280 px) et décris ce qui s’affiche réellement.
    2. Liste chaque défaut : l’endroit (HTML ou CSS), le symptôme, la cause précise
       (le mécanisme de mise en page en jeu) et sa gravité. Certains défauts
       n’apparaissent qu’après en avoir corrigé d’autres : refais un tour de tests
       après chaque correction.
    3. Propose les fichiers corrigés, en modifiant le moins de lignes possible.
    4. Pour chaque correction, indique comment tu l’as vérifiée.
  deliverable: |
    Colle ta liste de défauts (endroit, symptôme, cause, gravité), puis les fichiers
    corrigés complets, puis tes vérifications avec les largeurs testées.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts réels, y compris ceux qui n’apparaissent qu’à certaines largeurs ou après d’autres corrections.
        maxScore: 4
      - id: root-cause
        description: Explique chaque défaut par le mécanisme de mise en page en jeu.
        maxScore: 3
      - id: fix-quality
        description: Propose des corrections minimales, justes et vérifiées à plusieurs largeurs.
        maxScore: 3

- id: css-layout-responsive-apres-ia
  family: APRES_IA
  title: La Cantine du Canal sur mobile
  summary: Rendre responsive un site de restaurant conçu pour ordinateur, sans le réécrire, en dépannant un en-tête collant cassé.
  estimatedMinutes: 75
  instructions: |
    Le site de La Cantine du Canal a été généré il y a un an pour un écran d’ordinateur.
    Le restaurant veut qu’il fonctionne sur téléphone. Tu dois le faire évoluer **en
    modifiant le moins de lignes possible**, sans régénérer la feuille. Tu peux modifier
    le HTML seulement pour la demande 5.

    `index.html` :

    ```html
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>La Cantine du Canal</title>
        <link rel="stylesheet" href="styles.css">
      </head>
      <body>
        <div class="page">
          <header class="site-header">
            <a class="brand" href="index.html">La Cantine du Canal</a>
            <nav>
              <ul class="nav-list">
                <li><a href="#menu">Menu</a></li>
                <li><a href="#infos">Infos pratiques</a></li>
                <li><a href="reservation.html">Réserver</a></li>
              </ul>
            </nav>
          </header>
          <section class="hero">
            <img class="hero-img" src="salle-1600.jpg" width="1600" height="900" alt="La salle du restaurant au bord du canal">
            <h1 class="hero-title">Cuisine du marché, au bord de l’eau</h1>
          </section>
          <main class="container">
            <section id="menu">
              <h2>Le menu de la semaine</h2>
              <ul class="dishes">
                <li class="dish">
                  <h3>Velouté de châtaignes</h3>
                  <p>Crème fouettée au lard fumé.</p>
                  <p class="dish-price">8 €</p>
                </li>
                <li class="dish">
                  <h3>Brandade de cabillaud</h3>
                  <p>Salade de pousses, huile d’olive.</p>
                  <p class="dish-price">17 €</p>
                </li>
                <li class="dish">
                  <h3>Risotto aux cèpes</h3>
                  <p>Parmesan affiné 24 mois.</p>
                  <p class="dish-price">16 €</p>
                </li>
                <li class="dish">
                  <h3>Tarte fine aux pommes</h3>
                  <p>Glace à la vanille de Madagascar.</p>
                  <p class="dish-price">7 €</p>
                </li>
              </ul>
            </section>
            <section id="infos">
              <h2>Infos pratiques</h2>
              <p>Du mardi au samedi, de 12 h à 14 h 30. Réservation conseillée le vendredi.</p>
            </section>
          </main>
        </div>
      </body>
    </html>
    ```

    `styles.css` :

    ```css
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      line-height: 1.5;
      color: #1c1917;
    }

    /* Évite la barre de défilement horizontale */
    .page {
      overflow: hidden;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background-color: white;
    }

    .nav-list {
      display: flex;
      gap: 32px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .hero {
      position: relative;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-title {
      position: absolute;
      left: 32px;
      bottom: 32px;
      margin: 0;
      font-size: 56px;
      line-height: 1.1;
      color: white;
      text-shadow: 0 2px 8px rgb(0 0 0 / 60%);
    }

    .container {
      width: 960px;
      margin: 0 auto;
      padding: 32px 0;
    }

    .dishes {
      display: flex;
      gap: 24px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .dish {
      width: 25%;
      padding: 16px;
      border: 1px solid #d6d3d1;
    }

    .dish-price {
      font-weight: bold;
    }
    ```

    Demandes du restaurant :

    1. **Bug** : sur téléphone, le menu et les infos pratiques sont **coupés à droite**,
       et on ne peut pas faire défiler pour les lire. Trouve la cause et corrige-la.
    2. **Bug** : l’en-tête devait rester visible pendant le défilement, mais il part avec
       la page, sur téléphone comme sur ordinateur. Explique pourquoi et corrige-le.
    3. **Évolution** : les plats s’affichent sur une colonne sur téléphone, deux colonnes
       à partir de 40rem, quatre à partir de 64rem. Mobile d’abord.
    4. **Évolution** : sur téléphone, le nom du restaurant et les liens ne doivent jamais
       déborder : les éléments passent à la ligne si nécessaire, avec des espacements
