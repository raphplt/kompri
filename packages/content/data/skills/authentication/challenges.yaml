- id: authentication-sans-ia
  family: SANS_IA
  title: Le coffre à mots de passe
  summary: Écrire seul un module de hachage scrypt et une fonction de connexion sûre, puis les tester avec node:test.
  estimatedMinutes: 60
  instructions: |
    Tu travailles seul, sans IA, avec Node.js 24 et les modules intégrés `node:crypto`,
    `node:util`, `node:test` et `node:assert`. Aucune dépendance npm.

    1. **`password.js`** exporte deux fonctions asynchrones :
       - `hashPassword(password)` : hache avec scrypt, un sel aléatoire de 16 octets par appel,
         les paramètres minimaux recommandés par l’OWASP (N=2^17, r=8, p=1), et renvoie une
         chaîne qui contient l’algorithme, les paramètres, le sel et l’empreinte ;
       - `verifyPassword(password, stored)` : renvoie `true` ou `false` en recalculant
         l’empreinte avec les paramètres lus dans `stored`, et compare en temps constant.
       Le calcul ne doit pas bloquer la boucle d’événements.
    2. **`login.js`** exporte `authenticate(findUserByEmail, email, password)` :
       - `findUserByEmail` est une fonction asynchrone fournie par l’appelant, qui renvoie
         `{ id, email, passwordHash }` ou `null` (cela permet de tester sans base) ;
       - l’e-mail est normalisé (espaces retirés, minuscules) ;
       - la fonction renvoie `{ id, email }` si les identifiants sont corrects, sinon `null` ;
       - la durée de la fonction ne doit pas révéler si le compte existe.
    3. **`password.test.js`** contient au moins cinq tests :
       - deux hachages du même mot de passe sont différents ;
       - le bon mot de passe est accepté, un mot de passe différent d’un seul caractère est
         refusé ;
       - le format stocké contient bien les paramètres attendus ;
       - `authenticate` renvoie `null` pour un compte inconnu **et** pour un mauvais mot de
         passe, et l’utilisateur pour de bons identifiants saisis avec des majuscules ;
       - la fonction de recherche est bien appelée avec l’e-mail normalisé.

    Lance les tests avec `node --test` et garde la sortie.
  deliverable: |
    Colle `password.js`, `login.js`, `password.test.js` et la sortie de `node --test`. Ajoute
    un court paragraphe (cinq à huit lignes) qui explique, avec tes mots, le rôle du sel, de
    `maxmem` et de `timingSafeEqual`, et ce que fait ta fonction quand le compte n’existe pas.
  rubric:
    passRatio: 0.7
    criteria:
      - id: hashing
        description: Hache correctement avec scrypt et explique chaque paramètre et le sel.
        maxScore: 3
        levels:
          - score: 0
            description: Hachage rapide, sel constant ou absent, ou ne sait pas expliquer.
          - score: 1
            description: Scrypt avec sel aléatoire mais paramètres non stockés ou non expliqués.
          - score: 2
            description: Format complet, maxmem justifié, rôle du sel et du coût expliqués.
          - score: 3
            description: Explique aussi l’évolution des paramètres, Argon2id et la limite de bcrypt.
      - id: verification
        description: Vérifie en temps constant et sans révéler l’existence du compte.
        maxScore: 3
        levels:
          - score: 0
            description: Comparaison === ou messages et durées différents selon le cas.
          - score: 1
            description: timingSafeEqual utilisé mais compte inconnu traité plus vite.
          - score: 2
            description: Empreinte factice, résultat identique, explique l’énumération de comptes.
          - score: 3
            description: Explique aussi pourquoi la longueur des tampons doit être égale et comment il l’a garanti.
      - id: tests
        description: Écrit des tests pertinents qui échoueraient si une protection disparaissait.
        maxScore: 2
        levels:
          - score: 0
            description: Tests absents ou qui ne vérifient rien de significatif.
          - score: 1
            description: Cas nominaux testés, cas d’échec ou normalisation absents.
          - score: 2
            description: Cas nominaux et d’échec couverts, fonction de recherche factice (findUserByEmail) utilisée pour vérifier les appels.

- id: authentication-avec-ia
  family: AVEC_IA
  title: Le carnet d’adresses partagé en famille
  summary: Construire avec une IA une API multi-utilisateur avec sessions et contrôle d’accès, puis en défendre chaque choix.
  estimatedMinutes: 150
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu expliqueras chaque ligne sans
    aide, tu justifieras tes choix de sécurité et tu modifieras le code en direct.

    Objectif : une API Express 5 + PostgreSQL de carnet d’adresses personnel.

    1. **Comptes** : `POST /api/auth/register`, `POST /api/auth/login`,
       `POST /api/auth/logout`, `GET /api/auth/me`. Mots de passe hachés avec scrypt (ou
       Argon2id si tu sais justifier ton choix et ses paramètres), politique de longueur
       conforme à la leçon, e-mail normalisé.
    2. **Sessions** stockées dans PostgreSQL (empreinte du jeton, utilisateur, expiration de
       sept jours), cookie `HttpOnly`, `SameSite=Lax`, `Secure` en production, régénération à
       la connexion, suppression à la déconnexion. Pas de bibliothèque de session.
    3. **Limitation** des échecs de connexion, avec 429 et `Retry-After`.
    4. **Contacts** : `GET/POST /api/contacts`, `GET/PATCH/DELETE /api/contacts/:id`. Un
       contact a un nom (obligatoire), un e-mail et un téléphone facultatifs. Chaque
       utilisateur ne voit et ne modifie **que** ses contacts.
    5. **Tests** `node:test` sur une base de test : au moins un parcours complet
       (inscription, création, lecture, déconnexion, 401 ensuite), et des tests à **deux
       utilisateurs** pour la lecture, la modification et la suppression.
    6. Migrations SQL versionnées (`001_…sql`, `002_…sql` si besoin).
  deliverable: |
    Colle les migrations, les fichiers sources (application, mots de passe, sessions,
    middlewares, limiteur), les tests et la sortie de `node --test`. Termine par une liste de
    ce que l’IA a proposé et que tu as refusé ou corrigé, avec la raison.
  rubric:
    passRatio: 0.7
    criteria:
      - id: ownership
        description: Explique et maîtrise chaque partie du code, y compris celles écrites par l’IA.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des parties importantes de son code.
          - score: 1
            description: Explique le fonctionnement général mais pas les décisions de sécurité.
          - score: 2
            description: Explique chaque middleware, requête et décision de sécurité.
          - score: 3
            description: Explique aussi les propositions de l’IA écartées et pourquoi.
      - id: sessions
        description: Justifie la conception des sessions et des cookies.
        maxScore: 3
        levels:
          - score: 0
            description: Jeton prévisible, pas d’expiration ou déconnexion seulement côté navigateur.
          - score: 1
            description: Sessions fonctionnelles mais attributs de cookie ou régénération mal expliqués.
          - score: 2
            description: Explique entropie, empreinte en base, expiration serveur, régénération et attributs.
          - score: 3
            description: Compare avec un JWT et explique ce que changerait le passage à plusieurs serveurs.
      - id: access-control
        description: Garantit et prouve l’isolation des données entre utilisateurs.
        maxScore: 3
        levels:
          - score: 0
            description: Au moins une route permet d’atteindre les données d’un autre utilisateur.
          - score: 1
            description: Isolation correcte mais non testée ou non expliquée.
          - score: 2
            description: Isolation sur toutes les routes, prouvée par des tests à deux utilisateurs.
          - score: 3
            description: Prévoit correctement quel test échoue si un filtre est retiré pendant l’oral.
      - id: modification
        description: Réalise une modification demandée à l’oral sans affaiblir la sécurité.
        maxScore: 2
        levels:
          - score: 0
            description: Échoue ou introduit une faille.
          - score: 1
            description: Modification fonctionnelle mais non testée.
          - score: 2
            description: Modification correcte, sûre, accompagnée d’un test.

- id: authentication-contre-ia
  family: CONTRE_IA
  title: L’espace client des factures
  summary: Auditer une authentification générée par une IA, démontrer ses failles et la corriger.
  estimatedMinutes: 90
  instructions: |
    Une petite entreprise a fait générer par un assistant l’espace client de son application de
    facturation. Chaque client doit voir ses factures ; un administrateur voit tout. Avant la
    mise en ligne, on te demande un audit de l’authentification et des contrôles d’accès.

    Schéma :

    ```sql
    CREATE TABLE users (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      email text NOT NULL UNIQUE,
      display_name text NOT NULL,
      password_hash text NOT NULL,
      role text NOT NULL DEFAULT 'customer' CHECK (role IN ('customer', 'admin'))
    );

    CREATE TABLE invoices (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      owner_id integer NOT NULL REFERENCES users (id) ON DELETE CASCADE,
      label text NOT NULL,
      amount_cents integer NOT NULL CHECK (amount_cents >= 0)
    );
    ```

    `server.js` :

    ```js
    import express from 'express';
    import pg from 'pg';
    import crypto from 'node:crypto';

    const app = express();
    const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
    const sessions = new Map();

    app.use(express.json());

    function hashPassword(password) {
      return crypto.scryptSync(password, 'invoices-app', 64).toString('hex');
    }

    function getCookie(req, name) {
      const match = (req.headers.cookie || '').match(new RegExp(`${name}=([^;]+)`));
      return match ? match[1] : null;
    }

    function auth(req, res, next) {
      const sid = getCookie(req, 'session');
      const session = sid && sessions.get(sid);
      if (!session) return res.status(401).json({ error: 'Non connecté' });
      req.user = session.user;
      next();
    }

    app.post('/api/register', async (req, res) => {
      const { email, password, displayName } = req.body;
      if (!email || !password || password.length < 8) {
        return res.status(400).json({ error: 'Email et mot de passe (8 caractères min.) requis' });
      }
      const result = await pool.query(
        'INSERT INTO users (email, display_name, password_hash) VALUES ($1, $2, $3) RETURNING id, email, display_name, role',
        [email, displayName || email, hashPassword(password)],
      );
      res.status(201).json(result.rows[0]);
    });

    app.post('/api/login', async (req, res) => {
      const { email, password } = req.body;
      const result = await pool.query('SELECT * FROM users WHERE email = $1', [email]);
      const user = result.rows[0];
      if (!user) {
        return res.status(404).json({ error: 'Aucun compte avec cet email' });
      }
      if (user.password_hash !== hashPassword(password)) {
        return res.status(401).json({ error: 'Mot de passe incorrect' });
      }
      const sid = Buffer.from(`${user.id}:${Date.now()}`).toString('base64url');
      sessions.set(sid, { user });
      res.cookie('session', sid);
      res.json({ id: user.id, email: user.email, role: user.role });
    });

    app.post('/api/logout', (req, res) => {
      res.clearCookie('session');
      res.status(204).end();
    });

    app.get('/api/me', auth, (req, res) => {
      res.json(req.user);
    });

    app.patch('/api/me', auth, async (req, res) => {
      const fields = Object.keys(req.body);
      if (fields.length === 0) return res.status(400).json({ error: 'Rien à modifier' });
      const assignments = fields.map((field, i) => `${field} = $${i + 1}`).join(', ');
      const values = fields.map((field) => req.body[field]);
      const result = await pool.query(
        `UPDATE users SET ${assignments} WHERE id = $${fields.length + 1} RETURNING id, email, display_name, role`,
        [...values, req.user.id],
      );
      res.json(result.rows[0]);
    });

    app.get('/api/invoices', auth, async (req, res) => {
      const result = await pool.query('SELECT * FROM invoices WHERE owner_id = $1 ORDER BY id', [
        req.user.id,
      ]);
      res.json(result.rows);
    });

    app.get('/api/invoices/:id', auth, async (req, res) => {
      const result = await pool.query('SELECT * FROM invoices WHERE id = $1', [req.params.id]);
      if (!result.rows[0]) return res.status(404).json({ error: 'Facture introuvable' });
      res.json(result.rows[0]);
    });

    app.get('/api/admin/invoices', auth, async (req, res) => {
      if (req.user.role !== 'admin') return res.status(403).json({ error: 'Réservé aux administrateurs' });
      const result = await pool.query('SELECT * FROM invoices ORDER BY id');
      res.json(result.rows);
    });

    app.listen(3000, () => console.log('API factures sur http://localhost:3000'));
    ```

    Travail demandé :

    1. Liste chaque défaut : ligne, scénario d’attaque concret, conséquence, catégorie du Top
       10 OWASP 2025, gravité.
    2. Démontre au moins trois défauts sur une base de test (commandes `curl` et sorties). Un
       client ordinaire qui devient administrateur compte comme une démonstration majeure.
    3. Réécris le code pour corriger tous les défauts, en t’appuyant sur ce que tu as appris
       (scrypt correct, sessions en base, cookie sûr, contrôle d’accès).
    4. Écris au moins trois tests `node:test` qui échouaient sur le code d’origine et passent
       sur le tien.
  deliverable: |
    Colle ton tableau de défauts, les démonstrations (commandes et sorties), le code corrigé
    complet (et la migration si tu modifies le schéma), les tests et la sortie de
    `node --test`.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les failles d’authentification et d’autorisation, y compris les plus discrètes.
        maxScore: 4
      - id: demonstration
        description: Démontre les failles de façon reproductible et explique leur mécanisme.
        maxScore: 3
      - id: fixes
        description: Corrige avec les techniques enseignées et sans régression.
        maxScore: 3
      - id: regression-tests
        description: Écrit des tests qui prouvent les corrections.
        maxScore: 2

- id: authentication-apres-ia
  family: APRES_IA
  title: Les sessions qui s’évaporent
  summary: Dépanner et faire évoluer une API de tâches dont les sessions sont perdues à chaque redémarrage.
  estimatedMinutes: 120
  instructions: |
    Cette API de tâches personnelles fonctionne et ses utilisateurs l’apprécient. Elle a été
    écrite avec une IA. Tu dois la faire évoluer **sans la réécrire** : garde la structure,
    les routes et le module de mots de passe.

    `migrations/001_init.sql` :

    ```sql
    CREATE TABLE users (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      email text NOT NULL UNIQUE,
      password_hash text NOT NULL
    );

    CREATE TABLE tasks (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      owner_id integer NOT NULL REFERENCES users (id) ON DELETE CASCADE,
      title text NOT NULL,
      done boolean NOT NULL DEFAULT false
    );
    ```

    `src/password.js` est le module scrypt de la leçon (`hashPassword` et `verifyPassword`,
    N=2^17, r=8, p=1, sel aléatoire, `timingSafeEqual`) ; il est correct et ne doit pas être
    modifié.

    `src/app.js` :

    ```js
    import express from 'express';
    import { randomBytes } from 'node:crypto';
    import { hashPassword, verifyPassword } from './password.js';

    function readCookie(req, name) {
      for (const part of (req.headers.cookie ?? '').split(';')) {
        const [key, ...rest] = part.trim().split('=');
        if (key === name) return rest.join('=');
      }
      return null;
    }

    export function createApp({ pool, secureCookies = false }) {
      const app = express();
      const sessions = new Map(); // jeton -> identifiant d’utilisateur
      app.disable('x-powered-by');
      app.use(express.json({ limit: '10kb' }));

      app.use(async (req, res, next) => {
        req.sessionToken = readCookie(req, 'sid');
        const userId = req.sessionToken ? sessions.get(req.sessionToken) : undefined;
        req.user = null;
        if (userId) {
          const result = await pool.query('SELECT id, email FROM users WHERE id = $1', [userId]);
          req.user = result.rows[0] ?? null;
        }
        next();
      });

      function requireAuth(req, res, next) {
        if (!req.user) return res.status(401).json({ error: 'Authentification requise' });
        next();
      }

      function openSession(res, userId) {
        const token = randomBytes(32).toString('base64url');
        sessions.set(token, userId);
        res.cookie('sid', token, { httpOnly: true, secure: secureCookies, sameSite: 'lax', path: '/' });
      }

      app.post('/api/auth/register', async (req, res) => {
        const email = String(req.body?.email ?? '').trim().toLowerCase();
        const password = String(req.body?.password ?? '');
        if (!/^[^\s@]+@[^\s@]+$/.test(email) || password.length < 15 || password.length > 128) {
          return res.status(400).json({ error: 'E-mail valide et mot de passe de 15 à 128 caractères requis' });
        }
        try {
          const result = await pool.query(
            'INSERT INTO users (email, password_hash) VALUES ($1, $2) RETURNING id, email',
            [email, await hashPassword(password)],
          );
          openSession(res, result.rows[0].id);
          res.status(201).json({ user: result.rows[0] });
        } catch (error) {
          if (error.code === '23505') return res.status(409).json({ error: 'Adresse déjà utilisée' });
          throw error;
        }
      });

      app.post('/api/auth/login', async (req, res) => {
        const email = String(req.body?.email ?? '').trim().toLowerCase();
        const password = String(req.body?.password ?? '');
        const result = await pool.query('SELECT id, email, password_hash FROM users WHERE email = $1', [email]);
        const user = result.rows[0];
        if (!user || !(await verifyPassword(password, user.password_hash))) {
          return res.status(401).json({ error: 'E-mail ou mot de passe incorrect' });
        }
        if (req.sessionToken) sessions.delete(req.sessionToken);
        openSession(res, user.id);
        res.json({ user: { id: user.id, email: user.email } });
      });

      app.post('/api/auth/logout', (req, res) => {
        if (req.sessionToken) sessions.delete(req.sessionToken);
        res.clearCookie('sid', { httpOnly: true, secure: secureCookies, sameSite: 'lax', path: '/' });
        res.status(204).end();
      });

      app.get('/api/tasks', requireAuth, async (req, res) => {
        const result = await pool.query(
          'SELECT id, title, done FROM tasks WHERE owner_id = $1 ORDER BY id',
          [req.user.id],
        );
        res.json(result.rows);
      });

      app.post('/api/tasks', requireAuth, async (req, res) => {
        const title = String(req.body?.title ?? '').trim();
        if (title.length < 1 || title.length > 200) {
          return res.status(400).json({ error: 'Titre de 1 à 200 caractères' });
        }
        const result = await pool.query(
          'INSERT INTO tasks (owner_id, title) VALUES ($1, $2) RETURNING id, title, done',
          [req.user.id, title],
        );
        res.status(201).json(result.rows[0]);
      });

      app.use((error, req, res, next) => {
        console.error(error);
        res.status(500).json({ error: 'Erreur interne' });
      });

      return app;
    }
    ```

    `src/server.js` crée un `pg.Pool` à partir de `DATABASE_URL`, appelle `createApp` et
    écoute sur `PORT`.

    Demandes :

    1. **Bug signalé** : « après chaque mise à jour du serveur, tout le monde est déconnecté,
       et quand on a deux serveurs, on est déconnecté une fois sur deux ». Explique la cause,
       puis stocke les sessions dans PostgreSQL avec une **nouvelle** migration
       (`002_sessions.sql`). On ne stocke pas le jeton en clair.
    2. **Expiration** : une session expire sept jours après sa création, côté serveur comme
       dans le cookie. Ajoute une fonction qui supprime les sessions expirées.
    3. **Changement de mot de passe** : `POST /api/account/password` avec
       `{ "currentPassword": "…", "newPassword": "…" }`. Le mot de passe actuel est exigé, le
       nouveau suit la même politique qu’à l’inscription, **toutes les autres sessions** de
       l’utilisateur sont fermées et la session courante est régénérée.
    4. **Tests** `node:test` sur une base de test : une session survit à la recréation de
       l’application (simule le redémarrage en appelant deux fois `createApp`) ; après un
       changement de mot de passe, l’autre session reçoit 401 et l’ancien mot de passe est
       refusé.
  deliverable: |
    Colle la migration `002_sessions.sql`, les fichiers modifiés ou créés en entier, les tests
    et la sortie de `node --test`, puis la liste des changements avec, pour chacun, le bug ou
    la menace qu’il traite.
  rubric:
    passRatio: 0.7
    criteria:
      - id: diagnosis
        description: Explique la cause du bug à partir du modèle mémoire d’un processus Node.js.
        maxScore: 2
      - id: session-store
        description: Met en place un stockage de sessions sûr, expirant et versionné par migration.
        maxScore: 3
      - id: password-change
        description: Implémente un changement de mot de passe qui invalide les autres sessions.
        maxScore: 3
      - id: tests
        description: Prouve les évolutions par des tests ciblés.
        maxScore: 2
