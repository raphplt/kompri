- id: rest-api-design-sans-ia
  family: SANS_IA
  title: L’API du club de randonnée
  summary: Concevoir puis implémenter seul une petite API REST en mémoire, avec validation écrite à la main, filtre et tri.
  estimatedMinutes: 75
  instructions: |
    Le club de randonnée de ta ville veut publier ses itinéraires. Travaille **sans IA**,
    avec Express 5 et des données en mémoire.

    Une randonnée a la forme suivante (l’identifiant est attribué par le serveur) :

    ```json
    { "id": 1, "name": "Boucle des Trois Fontaines", "region": "Vosges", "distanceKm": 12.5, "difficulty": "moyenne" }
    ```

    Données de départ, à recopier :

    ```js
    const hikes = new Map();
    let nextId = 1;
    for (const data of [
      { name: 'Boucle des Trois Fontaines', region: 'Vosges', distanceKm: 12.5, difficulty: 'moyenne' },
      { name: 'Sentier du Moulin', region: 'Bretagne', distanceKm: 6, difficulty: 'facile' },
      { name: 'Crête des Lacs', region: 'Pyrénées', distanceKm: 18, difficulty: 'difficile' },
      { name: 'Chemin des Vignes', region: 'Bourgogne', distanceKm: 9, difficulty: 'facile' },
    ]) {
      hikes.set(nextId, { id: nextId, ...data });
      nextId += 1;
    }
    ```

    Partie 1 — conception (avant de coder). Rédige le tableau des points d’entrée de la
    ressource : lister, lire, créer, modifier partiellement, supprimer. Pour chaque ligne :
    méthode, URL, statut de succès, erreurs possibles.

    Partie 2 — implémentation :

    1. Les cinq opérations de ton tableau, sous `/api/hikes`.
    2. Une fonction `validateHike(input, { partial })`, **écrite à la main** (pas de
       bibliothèque), qui renvoie `{ value, errors }` :
       - `name` : texte non vide (espaces retirés), 100 caractères au plus ;
       - `region` : texte non vide, 60 caractères au plus ;
       - `distanceKm` : nombre strictement positif, 100 au plus (décimales permises) ;
       - `difficulty` : `facile`, `moyenne` ou `difficile` ;
       - tout autre champ est refusé.
    3. Les données invalides reçoivent une réponse qui liste **toutes** les erreurs. Choisis
       400 ou 422 et justifie ce choix.
    4. La création répond 201 avec l’en-tête `Location`.
    5. `GET /api/hikes` accepte `difficulty=facile|moyenne|difficile` (filtre) et
       `sort=distanceKm` ou `sort=-distanceKm` (tri) ; toute autre valeur de ces deux
       paramètres répond 400.
    6. Toutes les erreurs (404, 400, 422, JSON mal formé) ont le même format JSON.
  deliverable: |
    Colle ton tableau de conception, le code complet (un ou plusieurs fichiers), puis la
    sortie de ces commandes, serveur fraîchement démarré :

    ```bash
    curl -s 'http://localhost:3000/api/hikes?difficulty=facile&sort=-distanceKm'
    curl -s -i --json '{"name":"Tour du Plateau","region":"Jura","distanceKm":14,"difficulty":"moyenne"}' http://localhost:3000/api/hikes
    curl -s --json '{"name":" ","distanceKm":"14","difficulty":"extrême","duration":3}' http://localhost:3000/api/hikes
    curl -s -X PATCH --json '{"difficulty":"difficile"}' http://localhost:3000/api/hikes/2
    curl -s -i -X DELETE http://localhost:3000/api/hikes/2
    curl -s -i http://localhost:3000/api/hikes/2
    curl -s 'http://localhost:3000/api/hikes?sort=name'
    ```
  rubric:
    passRatio: 0.7
    criteria:
      - id: resource-design
        description: Modélise la ressource, ses URL et l’association méthodes/opérations selon les conventions REST.
        maxScore: 3
        levels:
          - score: 0
            description: URL avec verbes, méthodes incohérentes ou GET qui modifie des données.
          - score: 1
            description: Tableau globalement correct mais statuts ou méthodes mal justifiés.
          - score: 2
            description: Tableau correct (méthodes, URL, statuts, erreurs) et justifié oralement.
          - score: 3
            description: Distingue norme et convention, et discute sûreté et idempotence de chaque méthode.
      - id: crud-status
        description: Implémente les opérations avec les bons statuts et l’en-tête Location.
        maxScore: 3
        levels:
          - score: 0
            description: Opérations manquantes ou statuts incorrects (200 partout).
          - score: 1
            description: Opérations présentes mais 201, 204 ou 404 mal utilisés.
          - score: 2
            description: 200, 201 avec Location, 204 et 404 justes et expliqués.
          - score: 3
            description: Explique aussi pourquoi l’identifiant n’est jamais réutilisé et pourquoi le corps n’est pas enregistré tel quel.
      - id: validation-errors
        description: Valide les entrées à la main et renvoie des erreurs cohérentes et utiles.
        maxScore: 3
        levels:
          - score: 0
            description: Validation absente ou qui accepte des types incorrects.
          - score: 1
            description: Validation partielle, première erreur seulement, ou formats d’erreur différents.
          - score: 2
            description: Toutes les erreurs listées, liste blanche des champs, format unique, choix 400/422 justifié.
          - score: 3
            description: Gère aussi le mode partiel et les paramètres de requête invalides, et discute les conversions.
      - id: query-handling
        description: Filtre et trie la collection de façon sûre à partir de la query string.
        maxScore: 2
        levels:
          - score: 0
            description: Filtre ou tri absent, ou valeurs non contrôlées.
          - score: 1
            description: Filtre et tri fonctionnels mais tri sur place ou valeurs non validées.
          - score: 2
            description: Liste blanche des valeurs, tri sur une copie, réponse 400 pour une valeur inconnue.

- id: rest-api-design-avec-ia
  family: AVEC_IA
  title: Le catalogue de la ludothèque
  summary: Construire avec une IA une API REST complète, validée, paginée, documentée et testée, puis en défendre chaque choix.
  estimatedMinutes: 180
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu devras justifier chaque choix
    de conception, prédire la réponse de l’API à des requêtes inédites et modifier toi-même
    un comportement.

    La ludothèque de ton quartier veut une API pour son catalogue de jeux de société,
    stocké en mémoire (la base de données viendra plus tard). Un jeu :

    ```json
    { "id": 1, "name": "La Forêt des Lucioles", "minPlayers": 2, "maxPlayers": 5, "durationMinutes": 60, "available": true }
    ```

    Exigences :

    1. CRUD complet sur `/api/games` : liste, lecture, création, remplacement (`PUT`),
       modification partielle (`PATCH`), suppression. Statuts justes, `Location` à la
       création.
    2. Validation **écrite à la main** dans une fonction pure `validateGame(input, options)`
       (pas de Zod ni d’autre bibliothèque : tu dois pouvoir expliquer chaque ligne) :
       types exacts, bornes raisonnables que tu choisis et documentes, liste blanche des
       champs, et la règle croisée `minPlayers ≤ maxPlayers` (y compris en `PATCH`, où un
       seul des deux champs peut être envoyé).
    3. Le nom est unique sans tenir compte de la casse ni des espaces autour : 409 sinon.
    4. Erreurs au format Problem Details (RFC 9457), type `application/problem+json`,
       avec un tableau d’erreurs par champ pour la validation.
    5. `GET /api/games` : pagination (`page`, `limit` avec défaut et plafond), filtres
       `available` et `players` (les jeux jouables à ce nombre de joueurs), tri sur
       `name` et `durationMinutes` dans les deux sens, ordre stable ; paramètres invalides
       en 400. Réponse avec métadonnées de pagination.
    6. Structure : `src/app.js` (fonction `createApp`), `src/server.js`, un module de
       stockage avec une fonction de réinitialisation, les validations dans
       `src/validation/`.
    7. Documentation : un `openapi.json` (OpenAPI 3.1) qui décrit au moins `GET` et
       `POST /api/games` et `GET /api/games/{id}`, et un court `README.md` avec les
       conventions choisies.
    8. Tests reproductibles : un script `api-test.sh` (curl, code de sortie non nul en
       cas d’échec) et un script `check-api.js` qui démarre l’application sur le port 0
       avec des données connues et vérifie au moins huit comportements avec `fetch` et
       `node:assert/strict`.
  deliverable: |
    Colle le contenu de tes fichiers `src/`, `openapi.json`, `README.md`, `api-test.sh` et
    `check-api.js`, puis la sortie de `node check-api.js` et de `./api-test.sh` sur un
    serveur fraîchement démarré. Termine par une dizaine de lignes : ce que l’IA a
    proposé, ce que tu as refusé ou corrigé, et tes choix de conventions (400 ou 422,
    forme de la pagination, champs inconnus).
  rubric:
    passRatio: 0.7
    criteria:
      - id: design-justification
        description: Justifie les choix de conception (ressources, statuts, conventions d’erreur et de pagination).
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas justifier les statuts ou la forme des réponses de son API.
          - score: 1
            description: Justifications récitées ou incohérentes entre routes.
          - score: 2
            description: Justifie 201, 204, 400, 404, 409 et 422 et distingue norme et convention.
          - score: 3
            description: Discute les alternatives écartées (400 seul, en-têtes de pagination, champs inconnus tolérés) et leurs conséquences.
      - id: validation-quality
        description: Explique et maîtrise sa fonction de validation, y compris la règle croisée et le mode partiel.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer sa validation ou celle-ci laisse passer des types incorrects.
          - score: 1
            description: Validation correcte pour POST mais fausse en PATCH (règle croisée ou champs partiels).
          - score: 2
            description: Validation correcte dans tous les cas, erreurs complètes au format Problem Details.
          - score: 3
            description: Prédit sans hésiter la réponse à des corps inédits proposés à l’oral.
      - id: collection-queries
        description: Implémente et explique pagination, filtres et tri.
        maxScore: 2
        levels:
          - score: 0
            description: Pagination ou filtres absents ou faux.
          - score: 1
            description: Fonctionnels mais ordre des opérations, plafond ou stabilité non maîtrisés.
          - score: 2
            description: Filtre, tri stable et découpe dans le bon ordre, paramètres validés, métadonnées justes.
      - id: docs-tests
        description: Documente l’API et la vérifie avec des tests reproductibles.
        maxScore: 3
        levels:
          - score: 0
            description: Documentation ou tests absents.
          - score: 1
            description: Présents mais incohérents avec le code ou non reproductibles.
          - score: 2
            description: OpenAPI et README cohérents avec le code, scripts reproductibles avec code de sortie.
          - score: 3
            description: Explique la dépendance à l’état de api-test.sh et ajoute un test pendant l’oral.

- id: rest-api-design-contre-ia
  family: CONTRE_IA
  title: L’API de films trop vite générée
  summary: Auditer une API CRUD générée par un assistant et corriger ses erreurs de conception REST, de validation et de pagination.
  estimatedMinutes: 75
  instructions: |
    Un assistant a généré cette API pour le ciné-club. Elle démarre, et la plupart des
    requêtes renvoient une réponse. Ton rôle : l’auditer avant sa mise en service.
    Règles attendues :

    - `GET /api/movies` : pagination `page` (à partir de 1) et `limit` (10 par défaut,
      50 au plus), filtre `genre`, tri `sort=title|year` ; réponse
      `{ page, limit, total, data }` où `total` est le nombre de films correspondant au
      filtre ;
    - `GET /api/movies/:id` : le film ou 404 ;
    - `POST /api/movies` : `title` (texte non vide) et `year` (entier), `genre` facultatif
      (texte) ; un film est unique par titre (sans tenir compte de la casse) et année ;
    - `PUT /api/movies/:id` : remplacement complet ;
    - `DELETE /api/movies/:id` ;
    - statuts conformes aux conventions REST, erreurs dans un format JSON unique.

    ```js
    import express from 'express';

    const app = express();
    app.use(express.json());

    let movies = [
      { id: 1, title: 'Le Fabuleux Destin d’Amélie Poulain', year: 2001, genre: 'comedie' },
      { id: 2, title: 'La Haine', year: 1995, genre: 'drame' },
      { id: 3, title: 'Intouchables', year: 2011, genre: 'comedie' },
    ];

    // GET /api/movies?genre=comedie&sort=year&page=1&limit=10
    app.get('/api/movies', (req, res) => {
      const page = parseInt(req.query.page) || 1;
      const limit = parseInt(req.query.limit) || 10;
      const { genre, sort } = req.query;

      let results = movies;
      if (sort) {
        results = results.sort((a, b) => (a[sort] > b[sort] ? 1 : -1));
      }
      results = results.slice(page * limit, page * limit + limit);
      if (genre) {
        results = results.filter((movie) => movie.genre === genre);
      }
      res.json({ page, limit, total: results.length, data: results });
    });

    app.get('/api/movies/:id', (req, res) => {
      const movie = movies.find((m) => m.id === Number(req.params.id));
      if (!movie) {
        return res.status(404).send('Not found');
      }
      res.json(movie);
    });

    app.post('/api/movies', (req, res) => {
      const { title, year } = req.body;
      if (!title || !year || isNaN(year)) {
        return res.status(400).json({ message: 'Titre et année obligatoires' });
      }
      const exists = movies.some((m) => m.title === title && m.year === year);
      if (exists) {
        return res.status(400).json({ message: 'Ce film existe déjà' });
      }
      const movie = { id: movies.length + 1, ...req.body };
      movies.push(movie);
      res.json(movie);
    });

    app.put('/api/movies/:id', (req, res) => {
      const movie = movies.find((m) => m.id === Number(req.params.id));
      if (!movie) {
        return res.status(404).json({ error: 'Film introuvable' });
      }
      Object.assign(movie, req.body);
      res.json(movie);
    });

    app.delete('/api/movies/:id', (req, res) => {
      movies = movies.filter((m) => m.id !== Number(req.params.id));
      res.json({ message: 'Film supprimé' });
    });

    app.listen(3000, () => console.log('API des films sur http://localhost:3000'));
    ```

    Travail demandé :

    1. Teste l’API avec curl (pense à `?page=1`, au filtre, au tri, aux doublons, à
       l’enchaînement suppression puis création, aux champs inattendus).
    2. Liste chaque défaut : lignes concernées, requête qui le révèle, réponse observée,
       réponse attendue, gravité.
    3. Propose une version corrigée. Tu peux la découper en fichiers.
    4. Pour trois défauts de ton choix, écris la vérification (curl ou `fetch`) qui
       aurait empêché sa mise en service.
  deliverable: |
    Colle ta liste de défauts, la version corrigée complète, puis les trois vérifications
    et leur sortie sur la version corrigée.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts réels, y compris ceux qui n’apparaissent qu’après une autre correction ou une séquence de requêtes.
        maxScore: 3
      - id: rest-reasoning
        description: Explique chaque défaut au regard des conventions REST et de la sémantique HTTP.
        maxScore: 3
      - id: fix-verification
        description: Corrige de façon juste et vérifie les corrections par des requêtes reproductibles.
        maxScore: 3

- id: rest-api-design-apres-ia
  family: APRES_IA
  title: L’API de recettes à faire évoluer
  summary: Corriger et faire évoluer une API REST existante sans casser ses clients, en modifiant le moins de code possible.
  estimatedMinutes: 90
  instructions: |
    Cette API de recettes, produite avec une IA, est déjà utilisée par une application
    mobile. Tu dois la faire évoluer **en modifiant le moins de lignes possible**, et
    **sans casser le contrat** existant : en particulier, l’application mobile lit la
    réponse de `GET /api/recipes` comme un **tableau** JSON.

    `package.json` :

    ```json
    {
      "name": "recettes-api",
      "version": "1.0.0",
      "type": "module",
      "scripts": {
        "start": "node src/server.js"
      },
      "dependencies": {
        "express": "^5.3.0"
      }
    }
    ```

    `src/server.js` :

    ```js
    import { createApp } from './app.js';

    const port = Number(process.env.PORT) || 3000;

    createApp().listen(port, (error) => {
      if (error) {
        console.error(error.message);
        process.exitCode = 1;
        return;
      }
      console.log(`API des recettes sur http://localhost:${port}/api/recipes`);
    });
    ```

    `src/app.js` :

    ```js
    import express from 'express';
    import { recipesRouter } from './routes/recipes.js';

    export function createApp() {
      const app = express();
      app.use(express.json());
      app.use('/api/recipes', recipesRouter);

      app.use((req, res) => {
        res.status(404).json({ error: 'Route introuvable' });
      });

      app.use((err, req, res, next) => {
        if (err.type === 'entity.parse.failed') {
          res.status(400).json({ error: 'JSON invalide' });
          return;
        }
        console.error(err);
        res.status(500).json({ error: 'Erreur interne' });
      });

      return app;
    }
    ```

    `src/store/recipes-store.js` :

    ```js
    const recipes = new Map();
    let nextId = 1;

    const names = [
      'Ratatouille', 'Quiche lorraine', 'Soupe de potiron', 'Gratin dauphinois',
      'Taboulé', 'Crêpes', 'Pot-au-feu', 'Salade niçoise',
      'Tarte aux pommes', 'Blanquette de veau', 'Lentilles aux carottes', 'Clafoutis',
    ];
    for (const [index, name] of names.entries()) {
      const id = nextId;
      nextId += 1;
      recipes.set(id, { id, name, servings: 4, minutes: 30 + index * 5, vegetarian: index % 2 === 0 });
    }

    export function listRecipes() {
      return [...recipes.values()];
    }

    export function getRecipe(id) {
      return recipes.get(id);
    }

    export function saveRecipe(data, id = nextId) {
      if (id === nextId) {
        nextId += 1;
      }
      const recipe = { id, ...data };
      recipes.set(id, recipe);
      return recipe;
    }

    export function deleteRecipe(id) {
      return recipes.delete(id);
    }
    ```

    `src/validation/recipe.js` :

    ```js
    // Renvoie un message d'erreur, ou null si la recette est valide.
    export function checkRecipe(input) {
      if (typeof input.name !== 'string' || input.name.trim() === '') {
        return 'name est obligatoire';
      }
      if (!Number.isInteger(input.servings) || input.servings < 1 || input.servings > 20) {
        return 'servings doit être un entier entre 1 et 20';
      }
      if (!Number.isInteger(input.minutes) || input.minutes < 1 || input.minutes > 600) {
        return 'minutes doit être un entier entre 1 et 600';
      }
      if (typeof input.vegetarian !== 'boolean') {
        return 'vegetarian doit être un booléen';
      }
      return null;
    }
    ```

    `src/routes/recipes.js` :

    ```js
    import { Router } from 'express';
    import { deleteRecipe, getRecipe, listRecipes, saveRecipe } from '../store/recipes-store.js';
    import { checkRecipe } from '../validation/recipe.js';

    export const recipesRouter = Router();

    function pick(body) {
      const { name, servings, minutes, vegetarian } = body;
      return { name: name.trim(), servings, minutes, vegetarian };
    }

    // GET /api/recipes?page=1&limit=10&vegetarian=true
    recipesRouter.get('/', (req, res) => {
      const page = Number(req.query.page ?? 1);
      const limit = req.query.limit ?? 10;
      let recipes = listRecipes();
      if (req.query.vegetarian !== undefined) {
        recipes = recipes.filter((recipe) => String(recipe.vegetarian) === req.query.vegetarian);
      }
      const start = (page - 1) * limit;
      res.json(recipes.slice(start, start + limit));
    });

    recipesRouter.get('/:id', (req, res) => {
      const recipe = getRecipe(Number(req.params.id));
      if (!recipe) {
        res.status(404).json({ error: 'Recette introuvable' });
        return;
      }
      res.json(recipe);
    });

    recipesRouter.post('/', (req, res) => {
      const message = checkRecipe(req.body ?? {});
      if (message) {
        res.status(422).json({ error: message });
        return;
      }
      const recipe = saveRecipe(pick(req.body));
      res.status(201).location(`/api/recipes/${recipe.id}`).json(recipe);
    });

    recipesRouter.put('/:id', (req, res) => {
      const id = Number(req.params.id);
      if (!getRecipe(id)) {
        res.status(404).json({ error: 'Recette introuvable' });
        return;
      }
      const message = checkRecipe(req.body ?? {});
      if (message) {
        res.status(422).json({ error: message });
        return;
      }
      res.json(saveRecipe(pick(req.body), id));
    });

    recipesRouter.delete('/:id', (req, res) => {
      if (!deleteRecipe(Number(req.params.id))) {
        res.status(404).json({ error: 'Recette introuvable' });
        return;
      }
      res.sendStatus(204);
    });
    ```

    `api-test.sh` (vérifications existantes, à lancer sur un serveur fraîchement démarré) :

    ```bash
    #!/usr/bin/env bash
    # Vérifications de base, serveur fraîchement démarré. Usage : ./api-test.sh [url]
    BASE_URL="${1:-http://localhost:3000/api}"
    failures=0

    check() {
      if [ "$2" = "$3" ]; then
        echo "OK    $1"
      else
        echo "ÉCHEC $1 : attendu $2, obtenu $3"
        failures=$((failures + 1))
      fi
    }

    code() {
      curl -s -o /dev/null -w '%{http_code}' "$@"
    }

    check "liste" 200 "$(code "$BASE_URL/recipes")"
    check "recette existante" 200 "$(code "$BASE_URL/recipes/1")"
    check "recette absente" 404 "$(code "$BASE_URL/recipes/999")"
    check "création" 201 "$(code --json '{"name":"Velouté","servings":2,"minutes":20,"vegetarian":true}' "$BASE_URL/recipes")"
    check "création invalide" 422 "$(code --json '{"name":""}' "$BASE_URL/recipes")"
    check "suppression" 204 "$(code -X DELETE "$BASE_URL/recipes/2")"

    echo "$failures échec(s)"
    [ "$failures" -eq 0 ]
    ```

    Demandes de l’équipe :

    1. **Bug** : `GET /api/recipes?limit=5&page=2` renvoie 7 recettes au lieu de 5.
       Trouve la cause exacte et corrige-la.
    2. Les paramètres `page` et `limit` doivent être validés (`limit` entre 1 et 50) ; une
       valeur invalide répond 400. Aujourd’hui, `?limit=abc` renvoie une liste vide.
    3. L’application mobile veut connaître le nombre total de recettes correspondant à la
       requête, **sans que la forme du corps change**. Propose et implémente une solution.
    4. Les erreurs de validation doivent lister **tous** les champs invalides (la
       validation actuelle s’arrête au premier), sous la forme
       `{ "error": "Données invalides", "details": [{ "field": "…", "message": "…" }] }`.
       Les autres erreurs gardent leur format `{ "error": "…" }`.
    5. Ajoute `PATCH /api/recipes/:id` (modification partielle).
    6. Deux recettes ne peuvent pas avoir le même nom (sans tenir compte de la casse ni des
       espaces autour) : 409, pour `POST`, `PUT` et `PATCH`.
    7. Ajoute à `api-test.sh` au moins quatre vérifications couvrant tes changements.
  deliverable: |
    Colle uniquement les fichiers modifiés, en entier, avec pour chacun la liste des lignes
    modifiées et la raison. Ajoute la sortie de `./api-test.sh` sur un serveur fraîchement
