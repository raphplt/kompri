- id: node-runtime-sans-ia
  family: SANS_IA
  title: Le catalogue de la médiathèque
  summary: Écrire un petit outil en ligne de commande en modules ES qui enregistre ses données dans un fichier JSON.
  estimatedMinutes: 60
  instructions: |
    La médiathèque du quartier veut un outil en ligne de commande pour tenir son
    catalogue. Tu le réalises seul, sans IA, avec Node.js 24 et sans aucune dépendance npm.

    Structure attendue :

    ```text
    mediatheque/
      package.json
      src/
        catalog.js   fonctions de calcul, sans accès aux fichiers
        storage.js   lecture et écriture du catalogue
        main.js      point d'entrée : lit les arguments, affiche, gère les erreurs
    ```

    Exigences :

    1. `package.json` : modules ES, projet privé, et un script `start` qui lance
       `src/main.js` en chargeant un fichier `.env` **s’il existe**.
    2. Commandes, passées après `npm start --` :
       - `ajouter TITRE AUTEUR` ajoute un document ; titre et auteur sont obligatoires ;
       - `lister` affiche les documents numérotés, ou `Catalogue vide.` ;
       - `chercher MOT` affiche les documents dont le titre ou l’auteur contient le mot,
         sans tenir compte des majuscules.
    3. Le catalogue est enregistré en JSON lisible (indenté). Par défaut, il est rangé dans
       `data/catalog.json` **à la racine du projet**, quel que soit le dossier depuis
       lequel on lance le programme. Si la variable d’environnement `CATALOG_FILE` est
       définie, c’est ce fichier qui est utilisé.
    4. Au premier lancement, l’absence du fichier n’est pas une erreur. En revanche, un
       fichier JSON corrompu ne doit **jamais** être écrasé silencieusement.
    5. Toute erreur (commande inconnue, argument manquant, fichier illisible) affiche un
       message clair sur la sortie d’erreur et termine avec le code 1.
    6. `catalog.js` exporte des fonctions nommées ; aucun module n’utilise `require`.
  deliverable: |
    Colle les quatre fichiers, puis la sortie de ces commandes, dans l’ordre, en partant
    d’un catalogue inexistant : `npm start -- lister`,
    `npm start -- ajouter "Le Petit Prince" "Antoine de Saint-Exupéry"`,
    `npm start -- ajouter "La Peste" "Albert Camus"`, `npm start -- chercher camus`,
    `npm start -- ajouter "Sans auteur"` suivie de `echo $?`, et `node ../src/main.js lister`
    lancée depuis un sous-dossier du projet. Termine par trois phrases : comment ton
    programme trouve le fichier par défaut, ce qui se passe avec un JSON corrompu, et ce qui
    changerait si tu oubliais un `await` devant l’écriture.
  rubric:
    passRatio: 0.7
    criteria:
      - id: modules
        description: Organise le code en modules ES et explique imports, exports et résolution.
        maxScore: 3
        levels:
          - score: 0
            description: Code dans un seul fichier, ou require, ou imports qui ne fonctionnent pas.
          - score: 1
            description: Modules fonctionnels mais ne sait pas expliquer type module ou l’extension obligatoire.
          - score: 2
            description: Explique exports nommés, spécificateurs relatifs et préfixe node:.
          - score: 3
            description: Justifie le découpage (fonctions pures séparées des entrées-sorties) et l’évaluation unique d’un module.
      - id: files-paths
        description: Lit et écrit les fichiers de façon fiable et construit des chemins indépendants du dossier courant.
        maxScore: 3
        levels:
          - score: 0
            description: Chemins relatifs au dossier courant sans le savoir, ou await oublié.
          - score: 1
            description: Fonctionne depuis la racine mais ne sait pas expliquer cwd et import.meta.dirname.
          - score: 2
            description: Explique cwd et import.meta.dirname, l’encodage et la création du dossier.
          - score: 3
            description: Gère précisément les erreurs par code (ENOENT) et explique le risque d’écrasement d’un fichier corrompu.
      - id: config-errors
        description: Lit la configuration depuis l’environnement et signale les erreurs proprement.
        maxScore: 2
        levels:
          - score: 0
            description: Pas de CATALOG_FILE, ou erreurs affichées avec un code de sortie 0.
          - score: 1
            description: Variable lue et erreurs signalées, mais justification confuse.
          - score: 2
            description: Explique le rôle de --env-file-if-exists, de la sortie d’erreur et du code de sortie.
      - id: npm-scripts
        description: Explique package.json et les scripts npm utilisés.
        maxScore: 2
        levels:
          - score: 0
            description: Ne sait pas ce que fait npm start ni le rôle de --.
          - score: 1
            description: Utilise les scripts sans pouvoir expliquer type, private ou le passage d’arguments.
          - score: 2
            description: Explique chaque champ et pourquoi npm start fonctionne depuis un sous-dossier.

- id: node-runtime-avec-ia
  family: AVEC_IA
  title: Le rapport de dépenses
  summary: Construire avec une IA un outil qui transforme un fichier CSV de dépenses en rapport, puis en défendre chaque choix.
  estimatedMinutes: 100
  instructions: |
    Une association tient ses dépenses dans un fichier CSV exporté d’un tableur. Tu peux
    utiliser une IA autant que tu veux ; à l’oral, tu devras expliquer chaque ligne,
    justifier chaque dépendance et modifier ton outil en direct.

    Fichier d’exemple `depenses.csv` (séparateur point-virgule, montants à virgule) :

    ```text
    date;categorie;libelle;montant
    2026-03-02;fournitures;Ramettes de papier;24,90
    2026-03-05;transport;Location camionnette;89,00
    2026-03-05;fournitures;Feutres;7,35
    2026-03-12;alimentation;Goûter des bénévoles;42,10
    2026-03-20;transport;Essence;35,60
    ```

    Objectif : un projet Node.js 24 en modules ES, lancé avec
    `npm run rapport -- depenses.csv`, qui :

    1. lit le fichier CSV indiqué en argument (chemin relatif au dossier courant) ;
    2. calcule le total général et le total par catégorie, au centime près ;
    3. affiche un résumé lisible dans le terminal et écrit un fichier `rapport.json`
       dans le dossier indiqué par la variable d’environnement `REPORT_DIR`, ou par défaut
       dans un dossier `rapports` à la racine du projet ;
    4. refuse proprement un fichier absent, une ligne mal formée (en indiquant son numéro)
       ou un montant invalide, avec un code de sortie 1 ;
    5. lit sa configuration via un fichier `.env` facultatif, et fournit un
       `.env.example` ;
    6. utilise au plus **une** dépendance npm, que tu dois justifier (ou aucune, en
       expliquant pourquoi).

    Contraintes : `package.json` avec des scripts clairs, `package-lock.json` présent si
    une dépendance est installée, fichiers `.gitignore` adaptés, code découpé en au moins
    deux modules.

    Conseil : demande à l’IA de t’expliquer comment les nombres à virgule sont représentés
    en JavaScript et vérifie le total sur l’exemple à la main.
  deliverable: |
    Colle `package.json`, `.gitignore`, `.env.example`, tous les fichiers de code, la
    sortie de `npm run rapport -- depenses.csv` et le contenu de `rapport.json`. Ajoute la
    sortie d’un essai avec une ligne invalide de ton choix, puis quelques lignes sur ce que
    l’IA t’a apporté, ce que tu as corrigé et la raison de ton choix de dépendance.
  rubric:
    passRatio: 0.7
    criteria:
      - id: code-ownership
        description: Explique chaque partie de son code sans aide, y compris ce qui vient de l’IA.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des parties importantes de son propre code.
          - score: 1
            description: Explique le déroulé global mais pas la lecture du fichier ou la conversion des montants.
          - score: 2
            description: Explique précisément chaque module, chaque import et la gestion des erreurs.
          - score: 3
            description: Explique aussi les propositions de l’IA qu’il a écartées ou corrigées, avec la raison.
      - id: data-robustness
        description: Traite correctement les montants, les lignes invalides et les fins de ligne.
        maxScore: 3
        levels:
          - score: 0
            description: Totaux faux ou NaN sur l’exemple.
          - score: 1
            description: Totaux justes mais lignes invalides acceptées silencieusement.
          - score: 2
            description: Lignes invalides refusées avec leur numéro, montants convertis et validés.
          - score: 3
            description: Explique aussi la virgule flottante, la ligne vide finale et les fins de ligne Windows.
      - id: npm-dependencies
        description: Justifie ses dépendances et explique package.json, le verrouillage et les scripts.
        maxScore: 2
        levels:
          - score: 0
            description: Ne sait pas pourquoi une dépendance est présente ni ce que fait package-lock.json.
          - score: 1
            description: Explique les scripts mais pas les intervalles de version ou npm ci.
          - score: 2
            description: Justifie le choix de dépendance, lit son intervalle et explique verrouillage et npm ci.
      - id: modification
        description: Réalise ou décrit correctement une modification demandée pendant l’oral.
        maxScore: 3
        levels:
          - score: 0
            description: Ne parvient pas à modifier l’outil.
          - score: 1
            description: Modification partielle ou qui casse un cas existant.
          - score: 2
            description: Modification correcte avec un exemple de vérification.
          - score: 3
            description: Modification correcte, vérifiée sur plusieurs cas dont un cas d’erreur.

- id: node-runtime-contre-ia
  family: CONTRE_IA
  title: Le carnet de lecture qui perd des données
  summary: Auditer un petit outil Node.js généré, qui fonctionne en apparence mais expose un secret, écrit n’importe où et perd des données.
  estimatedMinutes: 55
  instructions: |
    Un assistant a généré ce petit outil en ligne de commande : chaque utilisateur tient
    un carnet des livres qu’il a lus. On l’utilise ainsi :
    `node src/cli.js add alice "Le Petit Prince"` puis `node src/cli.js list alice`.
    L’auteur affirme qu’il est « prêt pour la production ». Plus tard, il sera branché
    derrière un serveur web où le nom d’utilisateur viendra d’une requête.

    `package.json` :

    ```json
    {
      "name": "carnet-lecture",
      "version": "1.0.0",
      "type": "module",
      "scripts": {
        "start": "node src/cli.js"
      },
      "dependencies": {
        "dotenv": "^16.4.5",
        "nodemon": "^3.1.0"
      }
    }
    ```

    `src/config.js` :

    ```js
    import 'dotenv/config';

    export const config = {
      dataDir: process.env.DATA_DIR || './data',
      maxBooks: process.env.MAX_BOOKS || 100,
      adminToken: process.env.ADMIN_TOKEN || 'changeme',
      debug: Boolean(process.env.DEBUG),
    };

    if (config.debug) {
      console.log('Configuration chargée :', config);
    }
    ```

    `src/storage.js` :

    ```js
    import { readFile, writeFile, mkdir } from 'node:fs/promises';
    import path from 'node:path';
    import { config } from './config.js';

    function userFile(user) {
      return path.join(config.dataDir, `${user}.json`);
    }

    export async function loadBooks(user) {
      try {
        const content = await readFile(userFile(user), 'utf8');
        return JSON.parse(content);
      } catch {
        return [];
      }
    }

    export async function saveBooks(user, books) {
      await mkdir(config.dataDir, { recursive: true });
      writeFile(userFile(user), JSON.stringify(books, null, 2));
    }
    ```

    `src/cli.js` :

    ```js
    import { loadBooks, saveBooks } from './storage';
    import { config } from './config.js';

    const [command, user, title] = process.argv.slice(2);

    if (command === 'add') {
      const books = await loadBooks(user);
      if (books.length >= config.maxBooks) {
        console.error(`Limite de ${config.maxBooks} livres atteinte.`);
        process.exit(1);
      }
      books.push({ title, addedAt: new Date().toISOString() });
      await saveBooks(user, books);
      console.log(`« ${title} » ajouté au carnet de ${user}.`);
    } else if (command === 'list') {
      const books = await loadBooks(user);
      books.forEach((book, index) => console.log(`${index + 1}. ${book.title}`));
    } else {
      console.log('Usage : node src/cli.js add|list UTILISATEUR [TITRE]');
    }
    ```

    Le fichier `.env` de l’équipe contient `ADMIN_TOKEN=…` et `DEBUG=false`.

    Travail demandé :

    1. Installe et exécute le projet. Décris ce qui se passe et corrige ce qui empêche
       le démarrage.
    2. Liste chaque défaut : fichier et ligne, scénario qui le déclenche (donne la
       commande ou le contenu de fichier qui le révèle), conséquence, gravité.
    3. Propose une version corrigée des fichiers, sans dépendance inutile.
    4. Pour trois défauts de ton choix, montre la commande qui le révélait avant
       correction et la sortie après correction.
  deliverable: |
    Colle ta liste de défauts (fichier, ligne, scénario, conséquence, gravité), les
    fichiers corrigés complets, et les sorties avant et après pour trois défauts.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts réels, y compris ceux qui ne se voient pas lors d’un essai normal.
        maxScore: 3
      - id: root-cause
        description: Explique la cause technique de chaque défaut avec les notions du cours.
        maxScore: 3
      - id: fix-quality
        description: Propose des corrections justes, vérifiées et sans dépendance inutile.
        maxScore: 3

- id: node-runtime-apres-ia
  family: APRES_IA
  title: L’export des inscriptions à moderniser
  summary: Faire évoluer un script Node.js existant vers les modules ES et la configuration par l’environnement, et corriger ses bugs sans le réécrire.
  estimatedMinutes: 75
  instructions: |
    L’association utilise depuis longtemps ce script pour exporter ses inscriptions. Il a
    été écrit à l’époque avec un assistant et « marche ». Tu dois le faire évoluer
    **en gardant sa structure** : pas de réécriture complète, pas de nouvelle dépendance.

    `package.json` :

    ```json
    {
      "name": "export-inscriptions",
      "version": "1.2.0",
      "description": "Exporte les inscriptions aux événements de l'association",
      "main": "export.js",
      "scripts": {
        "export": "node export.js"
      },
      "license": "ISC"
    }
    ```

    `data/inscriptions.csv` (le fichier se termine par un retour à la ligne) :

    ```text
    nom;email;age;evenement
    Alice Martin;alice@example.com;34;atelier-velo
    Bruno Petit;bruno@example.com;9;sortie-marche
    Chloé Durand;chloe@example.com;45;atelier-velo
    David Leroy;david@example.com;12;assemblee
    Emma Roux;emma@example.com;28;sortie-marche
    ```

    `export.js` :

    ```js
    // Exporte les inscriptions du fichier CSV en JSON, triées par âge,
    // et affiche le nombre d'inscrits par événement.
    const fs = require('fs');
    const path = require('path');

    const INPUT_FILE = path.join(__dirname, 'data', 'inscriptions.csv');
    const OUTPUT_DIR = '/var/exports/association';

    function parseLine(line) {
      const [name, email, age, event] = line.split(';');
      return { name, email, age, event };
    }

    fs.readFile(INPUT_FILE, 'utf8', function (err, content) {
      if (err) {
        console.log('Impossible de lire le fichier des inscriptions');
        return;
      }

      const lines = content.split('\n').slice(1); // on saute l'en-tête
      const registrations = lines.map(parseLine);

      const countByEvent = {};
      registrations.forEach(function (registration) {
        countByEvent[registration.event] = (countByEvent[registration.event] || 0) + 1;
      });

      const sorted = registrations.sort(function (a, b) {
        return a.age > b.age ? 1 : -1;
      });

      fs.mkdir(OUTPUT_DIR, { recursive: true }, function () {
        const outputFile = path.join(OUTPUT_DIR, 'inscriptions.json');
        fs.writeFile(outputFile, JSON.stringify(sorted, null, 2), function () {
          console.log('Export terminé : ' + registrations.length + ' inscriptions');
          console.log(countByEvent);
        });
      });
    });
    ```

    Demandes de l’équipe :

    1. **Bugs signalés.** « L’export annonce 6 inscriptions alors qu’il y en a 5, et un
       événement `undefined` apparaît. » « Bruno, 9 ans, est classé après Chloé, 45 ans. »
       « Sur l’ordinateur de la trésorière, le script affiche "Export terminé" mais aucun
       fichier n’est créé. » Explique la cause de chacun et corrige-les.
    2. **Modernisation.** Passe le projet en modules ES et remplace les callbacks par
       `node:fs/promises` avec `await`, en conservant la structure et les noms existants.
    3. **Configuration.** Le dossier de sortie vient de la variable d’environnement
       `EXPORT_DIR` ; à défaut, un dossier `exports` à côté du script. Le script npm charge
       un `.env` s’il existe. Fournis un `.env.example`.
    4. **Évolution.** `npm run export -- atelier-velo` n’exporte que les inscriptions de cet
       événement ; sans argument, tout est exporté.
    5. Ajoute ce qui manque à `package.json` pour une application qui ne doit pas être
       publiée sur le registre npm.
  deliverable: |
    Colle le `package.json` et le `export.js` modifiés, le `.env.example`, puis la sortie de
    `npm run export`, de `npm run export -- atelier-velo` et d’un essai avec un
    `EXPORT_DIR` où tu n’as pas le droit d’écrire, suivi de `echo $?` (sous Linux ou macOS,
    crée un dossier protégé avec `mkdir verrou && chmod 500 verrou`, puis lance
    `EXPORT_DIR=verrou/exports npm run export`). Termine par la liste des lignes modifiées avec la raison de
    chacune.
  rubric:
    passRatio: 0.7
    criteria:
      - id: bug-diagnosis
        description: Explique la cause de chaque bug signalé et la corrige proprement.
        maxScore: 3
      - id: migration
        description: Migre vers les modules ES et les promesses en conservant le comportement et la structure.
        maxScore: 3
      - id: configuration
        description: Rend le dossier de sortie configurable et documente la configuration.
        maxScore: 2
      - id: minimal-change
        description: Fait évoluer le code existant de façon ciblée et vérifiée.
        maxScore: 2
