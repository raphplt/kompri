- id: react-data-forms-apres-ia
  family: APRES_IA
  title: Les réservations de salles à reprendre
  summary: Dépanner et faire évoluer une petite application React générée par une IA, sans tout régénérer, avec des tests qui prouvent chaque correction.
  estimatedMinutes: 90
  instructions: |
    Une équipe utilise depuis peu cette application de réservation de salles, générée en
    grande partie par une IA. Tu la reprends. Ne la régénère pas : corrige et fais évoluer
    le code existant, en modifiant le moins possible ce qui fonctionne.

    Crée un projet Vite (modèle `react`), installe les outils de test comme dans la leçon 6,
    puis ajoute les fichiers suivants.

    `server.js`, à la racine, lancé avec `node server.js` :

    ```js
    // server.js — API de réservations de salles, en mémoire
    import { createServer } from 'node:http';

    const port = Number(process.env.PORT ?? 3003);

    let bookings = [
      { id: 1, day: 'lundi', time: '09:00', room: 'Salle Verte', owner: 'Inès', locked: false },
      { id: 2, day: 'lundi', time: '14:00', room: 'Salle Bleue', owner: 'Malik', locked: false },
      { id: 3, day: 'mardi', time: '10:00', room: 'Salle Verte', owner: 'Inès', locked: true },
      { id: 4, day: 'mardi', time: '16:00', room: 'Salle Bleue', owner: 'Inès', locked: false },
      { id: 5, day: 'mercredi', time: '11:00', room: 'Salle Verte', owner: 'Malik', locked: false },
    ];

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function send(response, status, data) {
      if (data === undefined) return response.writeHead(status).end();
      response.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8' });
      response.end(JSON.stringify(data));
    }

    createServer(async (request, response) => {
      const url = new URL(request.url, 'http://localhost');
      console.log(`${request.method} ${url.pathname}${url.search}`);
      if (url.pathname === '/api/bookings' && request.method === 'GET') {
        const day = url.searchParams.get('day');
        await wait(day === 'lundi' ? 1500 : 200); // le lundi est lent à charger
        return send(response, 200, bookings.filter((booking) => booking.day === day));
      }
      const match = url.pathname.match(/^\/api\/bookings\/(\d+)$/);
      if (match && request.method === 'DELETE') {
        await wait(300);
        const booking = bookings.find((item) => item.id === Number(match[1]));
        if (!booking) return send(response, 404, { error: 'Réservation introuvable.' });
        if (booking.locked) {
          return send(response, 403, { error: 'Réservation confirmée par l’accueil : annulation impossible.' });
        }
        bookings = bookings.filter((item) => item.id !== booking.id);
        return send(response, 204);
      }
      return send(response, 404, { error: 'Route inconnue.' });
    }).listen(port, () => console.log(`API des réservations : http://localhost:${port}/api/bookings?day=lundi`));
    ```

    `vite.config.js` :

    ```js
