- id: react-data-forms-apres-ia
  family: APRES_IA
  title: Les réservations de salles à reprendre
  summary: Dépanner et faire évoluer une petite application React générée par une IA, sans tout régénérer,
    avec des tests qui prouvent chaque correction.
  estimatedMinutes: 90
  instructions: "Une équipe utilise depuis peu cette application de réservation de salles, générée en\n\
    grande partie par une IA. Tu la reprends. Ne la régénère pas : corrige et fais évoluer\nle code existant,\
    \ en modifiant le moins possible ce qui fonctionne.\n\nCrée un projet Vite (modèle `react`), installe\
    \ les outils de test comme dans la leçon 6,\npuis ajoute les fichiers suivants.\n\n`server.js`, à\
    \ la racine, lancé avec `node server.js` :\n\n```js\n// server.js — API de réservations de salles,\
    \ en mémoire\nimport { createServer } from 'node:http';\n\nconst port = Number(process.env.PORT ??\
    \ 3003);\n\nlet bookings = [\n  { id: 1, day: 'lundi', time: '09:00', room: 'Salle Verte', owner:\
    \ 'Inès', locked: false },\n  { id: 2, day: 'lundi', time: '14:00', room: 'Salle Bleue', owner: 'Malik',\
    \ locked: false },\n  { id: 3, day: 'mardi', time: '10:00', room: 'Salle Verte', owner: 'Inès', locked:\
    \ true },\n  { id: 4, day: 'mardi', time: '16:00', room: 'Salle Bleue', owner: 'Inès', locked: false\
    \ },\n  { id: 5, day: 'mercredi', time: '11:00', room: 'Salle Verte', owner: 'Malik', locked: false\
    \ },\n];\n\nconst wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\nfunction send(response,\
    \ status, data) {\n  if (data === undefined) return response.writeHead(status).end();\n  response.writeHead(status,\
    \ { 'Content-Type': 'application/json; charset=utf-8' });\n  response.end(JSON.stringify(data));\n\
    }\n\ncreateServer(async (request, response) => {\n  const url = new URL(request.url, 'http://localhost');\n\
    \  console.log(`${request.method} ${url.pathname}${url.search}`);\n  if (url.pathname === '/api/bookings'\
    \ && request.method === 'GET') {\n    const day = url.searchParams.get('day');\n    await wait(day\
    \ === 'lundi' ? 1500 : 200); // le lundi est lent à charger\n    return send(response, 200, bookings.filter((booking)\
    \ => booking.day === day));\n  }\n  const match = url.pathname.match(/^\\/api\\/bookings\\/(\\d+)$/);\n\
    \  if (match && request.method === 'DELETE') {\n    await wait(300);\n    const booking = bookings.find((item)\
    \ => item.id === Number(match[1]));\n    if (!booking) return send(response, 404, { error: 'Réservation\
    \ introuvable.' });\n    if (booking.locked) {\n      return send(response, 403, { error: 'Réservation\
    \ confirmée par l’accueil : annulation impossible.' });\n    }\n    bookings = bookings.filter((item)\
    \ => item.id !== booking.id);\n    return send(response, 204);\n  }\n  return send(response, 404,\
    \ { error: 'Route inconnue.' });\n}).listen(port, () => console.log(`API des réservations : http://localhost:${port}/api/bookings?day=lundi`));\n\
    ```\n\n`vite.config.js` :\n\n```js\nimport react from '@vitejs/plugin-react';\nimport { defineConfig\
    \ } from 'vitest/config';\n\nexport default defineConfig({\n  plugins: [react()],\n  server: {\n \
    \   proxy: {\n      '/api': 'http://localhost:3003',\n    },\n  },\n  test: {\n    environment: 'jsdom',\n\
    \    setupFiles: ['./src/test/setup.js'],\n  },\n});\n```\n\n`src/test/setup.js` :\n\n```js\n// src/test/setup.js\
    \ — exécuté avant chaque fichier de test\nimport { cleanup } from '@testing-library/react';\nimport\
    \ { afterEach, vi } from 'vitest';\n\nafterEach(() => {\n  cleanup(); // démonte ce que render a affiché\n\
    \  vi.unstubAllGlobals(); // rend le vrai fetch après chaque test\n});\n```\n\n`src/main.jsx` :\n\n\
    ```jsx\nimport { StrictMode } from 'react';\nimport { createRoot } from 'react-dom/client';\nimport\
    \ App from './App.jsx';\n\ncreateRoot(document.getElementById('root')).render(\n  <StrictMode>\n \
    \   <App />\n  </StrictMode>,\n);\n```\n\n`src/useBookings.js` :\n\n```js\nimport { useEffect, useState\
    \ } from 'react';\n\n// Charge les réservations d’un jour.\nexport function useBookings(day) {\n \
    \ const [bookings, setBookings] = useState([]);\n  const [loading, setLoading] = useState(true);\n\
    \  const [error, setError] = useState('');\n\n  useEffect(() => {\n    async function load() {\n \
    \     setLoading(true);\n      try {\n        const res = await fetch(`/api/bookings?day=${day}`);\n\
    \        if (!res.ok) throw new Error(`Erreur ${res.status}`);\n        setBookings(await res.json());\n\
    \      } catch (err) {\n        setError(err.message);\n      } finally {\n        setLoading(false);\n\
    \      }\n    }\n    load();\n  }, [day]);\n\n  return { bookings, setBookings, loading, error };\n\
    }\n```\n\n`src/App.jsx` :\n\n```jsx\nimport { useState } from 'react';\nimport DayTabs from './components/DayTabs.jsx';\n\
    import DayView from './components/DayView.jsx';\nimport { useBookings } from './useBookings.js';\n\
    \nconst days = ['lundi', 'mardi', 'mercredi'];\n\nfunction App() {\n  const [day, setDay] = useState('lundi');\n\
    \  const [currentUser] = useState('Inès'); // en attendant la vraie connexion\n  const { bookings,\
    \ setBookings, loading, error } = useBookings(day);\n  const [message, setMessage] = useState('');\n\
    \n  async function cancelBooking(booking) {\n    setBookings(bookings.filter((b) => b.id !== booking.id));\n\
    \    try {\n      await fetch(`/api/bookings/${booking.id}`, { method: 'DELETE' });\n      setMessage(`Réservation\
    \ de ${booking.time} annulée.`);\n    } catch {\n      setBookings(bookings);\n      setMessage('Impossible\
    \ d’annuler la réservation.');\n    }\n  }\n\n  return (\n    <main>\n      <h1>Réservations de salles</h1>\n\
    \      <p>Connectée : {currentUser}</p>\n      <DayTabs days={days} day={day} onChange={setDay} />\n\
    \      <p role=\"status\">{loading ? 'Chargement…' : message}</p>\n      {error && <p>Erreur : {error}</p>}\n\
    \      <DayView day={day} bookings={bookings} currentUser={currentUser} onCancel={cancelBooking} />\n\
    \    </main>\n  );\n}\n\nexport default App;\n```\n\n`src/components/DayTabs.jsx` :\n\n```jsx\nfunction\
    \ DayTabs({ days, day, onChange }) {\n  return (\n    <nav aria-label=\"Jours\">\n      {days.map((d)\
    \ => (\n        <button key={d} type=\"button\" aria-pressed={d === day} onClick={() => onChange(d)}>\n\
    \          {d}\n        </button>\n      ))}\n    </nav>\n  );\n}\n\nexport default DayTabs;\n```\n\
    \n`src/components/DayView.jsx` :\n\n```jsx\nimport BookingList from './BookingList.jsx';\n\nfunction\
    \ DayView({ day, bookings, currentUser, onCancel }) {\n  return (\n    <section>\n      <h2>Réservations\
    \ du {day}</h2>\n      <BookingList bookings={bookings} currentUser={currentUser} onCancel={onCancel}\
    \ />\n    </section>\n  );\n}\n\nexport default DayView;\n```\n\n`src/components/BookingList.jsx`\
    \ :\n\n```jsx\nimport BookingItem from './BookingItem.jsx';\n\nfunction BookingList({ bookings, currentUser,\
    \ onCancel }) {\n  if (bookings.length === 0) return <p>Aucune réservation ce jour-là.</p>;\n  return\
    \ (\n    <ul>\n      {bookings.map((booking) => (\n        <BookingItem\n          key={booking.id}\n\
    \          booking={booking}\n          currentUser={currentUser}\n          onCancel={onCancel}\n\
    \        />\n      ))}\n    </ul>\n  );\n}\n\nexport default BookingList;\n```\n\n`src/components/BookingItem.jsx`\
    \ :\n\n```jsx\nfunction BookingItem({ booking, currentUser, onCancel }) {\n  return (\n    <li>\n\
    \      {booking.time} — {booking.room} ({booking.owner}){' '}\n      {booking.owner === currentUser\
    \ && (\n        <button type=\"button\" onClick={() => onCancel(booking)}>\n          Annuler\n  \
    \      </button>\n      )}\n    </li>\n  );\n}\n\nexport default BookingItem;\n```\n\n`src/App.test.jsx`\
    \ :\n\n```jsx\nimport { render, screen } from '@testing-library/react';\nimport { it, vi } from 'vitest';\n\
    import App from './App.jsx';\n\nfunction jsonResponse(status, data) {\n  return new Response(JSON.stringify(data),\
    \ {\n    status,\n    headers: { 'Content-Type': 'application/json' },\n  });\n}\n\nit('affiche les\
    \ réservations du jour', async () => {\n  vi.stubGlobal(\n    'fetch',\n    vi.fn().mockResolvedValue(\n\
    \      jsonResponse(200, [\n        { id: 1, day: 'lundi', time: '09:00', room: 'Salle Verte', owner:\
    \ 'Inès', locked: false },\n      ]),\n    ),\n  );\n  render(<App />);\n  screen.findByText('09:00\
    \ — Salle Verte (Inès)');\n});\n```\n\nTickets à traiter :\n\n1. **Signalement** : « Quand je clique\
    \ sur mardi juste après avoir ouvert l’application,\n   je vois un moment les réservations de mardi,\
    \ puis celles de lundi s’affichent sous le\n   titre “Réservations du mardi”. »\n2. **Signalement**\
    \ : « J’ai annulé ma réservation de mardi 10:00, l’application m’a dit\n   “Réservation de 10:00 annulée.”,\
    \ mais elle est revenue quand j’ai rouvert mardi. »\n   (L’accueil confirme : les réservations validées\
    \ par l’accueil ne peuvent pas être\n   annulées en ligne.)\n3. **Évolution** : la personne connectée\
    \ (`currentUser`) traverse `DayView` et\n   `BookingList`, qui ne s’en servent pas, pour arriver à\
    \ `BookingItem`. Remplace cette\n   transmission par un contexte, prêt à accueillir plus tard la vraie\
    \ connexion.\n4. **Tests** : la suite de tests doit protéger les tickets 1 et 2. Pour le ticket 2,\
    \ écris\n   d’abord un test qui **échoue** sur le code actuel, puis corrige.\n\nContraintes : JavaScript,\
    \ `StrictMode` conservé, pas de bibliothèque supplémentaire,\n`npm run lint` sans erreur, mêmes textes\
    \ affichés qu’aujourd’hui sauf pour les nouveaux\nmessages d’erreur.\n"
  deliverable: 'Pour chaque ticket : la cause trouvée (fichier, ligne, explication), les fichiers modifiés

    (code complet de chaque fichier modifié), et la preuve (scénario dans le navigateur ou

    test). Ajoute la sortie de `npx vitest run --reporter=verbose` **avant** la correction du

    ticket 2 (avec ton nouveau test en échec) et **après**, puis tout autre défaut que tu as

    remarqué en chemin, corrigé ou non, avec ta justification.

    '
  rubric:
    passRatio: 0.7
    criteria:
    - id: diagnosis
      description: Remonte de chaque signalement à sa cause précise dans le code.
      maxScore: 3
    - id: minimal-fix
      description: Corrige et fait évoluer le code existant sans le régénérer.
      maxScore: 3
    - id: tests
      description: Prouve les corrections par des tests vus en échec puis en succès.
      maxScore: 3
    - id: oral-change
      description: Réalise ou décrit correctement une modification demandée pendant l’oral.
      maxScore: 2
