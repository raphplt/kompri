- id: react-data-forms-sans-ia
  family: SANS_IA
  title: L’inscription à un atelier
  summary: Charger une ressource avec useEffect et construire, sans aide, un formulaire contrôlé, validé, accessible et protégé contre la double soumission.
  estimatedMinutes: 60
  instructions: |
    Une association propose un atelier « Réparer son vélo ». Réalise **sans IA** la page
    d’inscription, dans un projet créé avec
    `npm create vite@latest atelier -- --template react --no-interactive`.

    L’API t’est fournie. Place ce fichier `server.js` à la racine du projet et lance-le dans
    un second terminal avec `node server.js` :

    ```js
    // server.js — API d’inscription à un atelier, en mémoire
    import { createServer } from 'node:http';

    const port = Number(process.env.PORT ?? 3004);
    const workshop = { title: 'Réparer son vélo', date: '2026-12-12', seatsLeft: 5 };
    const registrations = [{ id: 1, name: 'Awa Diallo', email: 'awa@example.fr', seats: 1 }];

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function send(response, status, data) {
      response.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8' });
      response.end(JSON.stringify(data));
    }

    async function readJson(request) {
      let text = '';
      for await (const chunk of request) text += chunk;
      return JSON.parse(text);
    }

    createServer(async (request, response) => {
      const url = new URL(request.url, 'http://localhost');
      console.log(`${request.method} ${url.pathname}${url.search}`);
      try {
        if (url.searchParams.get('fail') === '1') {
          await wait(300);
          return send(response, 500, { error: 'Erreur interne simulée' });
        }
        if (url.pathname === '/api/workshop' && request.method === 'GET') {
          await wait(400);
          return send(response, 200, workshop);
        }
        if (url.pathname === '/api/registrations' && request.method === 'POST') {
          await wait(800);
          const data = await readJson(request);
          const name = typeof data.name === 'string' ? data.name.trim() : '';
          const email = typeof data.email === 'string' ? data.email.trim().toLowerCase() : '';
          const seats = Number(data.seats);
          const fields = {};
          if (name.length < 2) fields.name = 'Nom trop court.';
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) fields.email = 'Adresse invalide.';
          if (!Number.isInteger(seats) || seats < 1 || seats > 4) fields.seats = 'Entre 1 et 4 places.';
          if (Object.keys(fields).length > 0) return send(response, 400, { error: 'Données invalides', fields });
          if (registrations.some((r) => r.email === email)) {
            return send(response, 409, { error: 'Déjà inscrit', fields: { email: 'Cette adresse est déjà inscrite.' } });
          }
          if (seats > workshop.seatsLeft) {
            const text = `Il ne reste que ${workshop.seatsLeft} place(s).`;
            return send(response, 409, { error: 'Complet', fields: { seats: text } });
          }
          workshop.seatsLeft -= seats;
          const registration = { id: registrations.length + 1, name, email, seats };
          registrations.push(registration);
          return send(response, 201, { registration, seatsLeft: workshop.seatsLeft });
        }
        return send(response, 404, { error: 'Route inconnue' });
      } catch {
        return send(response, 400, { error: 'Requête invalide' });
      }
    }).listen(port, () => console.log(`API de l’atelier : http://localhost:${port}/api/workshop`));
    ```

    Configure le proxy de Vite pour que `/api` soit relayé vers `http://localhost:3004`.

    Écris un composant `WorkshopSignup` (fichier `src/WorkshopSignup.jsx`, affiché par
    `App`) qui :

    1. charge `GET /api/workshop` dans un effet, avec annulation dans le nettoyage, et affiche
       dans un paragraphe `role="status"` « Chargement… », puis « Réparer son vélo — places
       restantes : 5 », ou un message d’erreur compréhensible si le chargement échoue
       (essaie avec `/api/workshop?fail=1`) ;
    2. affiche un formulaire contrôlé, dont l’état est **un seul objet**, avec trois champs :
       « Nom » (2 caractères minimum), « Adresse électronique » (format valide) et « Nombre
       de places » (liste de 1 à 4, 1 par défaut) ;
    3. valide à l’envoi, puis au fil de la saisie pour un champ déjà quitté ; chaque erreur
       est un texte qui explique la correction, relié au champ par `aria-describedby`, avec
       `aria-invalid` ; à l’envoi, le focus va sur le premier champ en erreur et rien n’est
       envoyé ;
    4. envoie `POST /api/registrations` avec `{ name, email, seats }` (`seats` est un nombre) ;
       pendant l’envoi, le bouton annonce l’attente et un double clic n’envoie qu’une requête ;
    5. en cas de succès (201), affiche « Inscription confirmée pour … », vide le formulaire et
       met à jour les places restantes **à partir de la réponse** ;
    6. en cas de refus (400 ou 409), affiche les messages de `fields` sous les champs
       concernés ; toute autre erreur s’affiche dans un statut.

    Contraintes : JavaScript, `StrictMode` conservé, pas de bibliothèque en plus de React,
    `npm run lint` sans erreur, aucune donnée dérivée (les erreurs, par exemple) stockée dans
    un état.

    Scénarios à vérifier : envoi à vide ; inscription avec `awa@example.fr` (déjà inscrite) ;
    double clic sur le bouton avec des données valides ; inscription de 4 places, puis d’une
    autre personne pour 2 places.
  deliverable: |
    Colle le code de `src/WorkshopSignup.jsx`, de `src/App.jsx` et de `vite.config.js`, puis
    le résultat observé pour chacun des quatre scénarios (texte affiché et nombre de requêtes
    `POST` dans l’onglet *Network*). Termine par trois ou quatre phrases expliquant pourquoi
    le chargement est dans un effet et l’envoi dans un gestionnaire d’événement.
  rubric:
    passRatio: 0.7
    criteria:
      - id: effect-loading
        description: Charge la ressource dans un effet correct et explique ses états et son nettoyage.
        maxScore: 3
        levels:
          - score: 0
            description: Requête dans le corps du composant ou effet async, ou incapable d’expliquer quand l’effet s’exécute.
          - score: 1
            description: Chargement fonctionnel sans nettoyage ou sans état d’erreur, explication partielle.
          - score: 2
            description: Trois états, annulation dans le nettoyage, AbortError ignorée, double exécution de StrictMode expliquée.
          - score: 3
            description: Explique aussi le test de response.ok et pourquoi le chargement relève d’un effet et l’envoi d’un gestionnaire.
      - id: controlled-form
        description: Gère un formulaire contrôlé à plusieurs champs avec une validation dérivée.
        maxScore: 3
        levels:
          - score: 0
            description: Champs non contrôlés ou état éparpillé incohérent, validation absente.
          - score: 1
            description: Formulaire contrôlé mais erreurs stockées dans un état ou affichées au mauvais moment.
          - score: 2
            description: Objet values, gestionnaire générique, erreurs calculées à chaque rendu, affichage après blur ou envoi.
          - score: 3
            description: Justifie chaque choix (propriété calculée, conversion du select, remise à zéro après succès) et l’applique à un champ ajouté à l’oral.
      - id: accessible-errors
        description: Rend les erreurs perceptibles et utilisables sans la vue.
        maxScore: 3
        levels:
          - score: 0
            description: Erreurs signalées par la couleur ou par un texte non relié au champ.
          - score: 1
            description: Labels corrects, mais aria-invalid, aria-describedby ou le focus manquent.
          - score: 2
            description: Labels, aria-invalid, aria-describedby conditionnel, messages explicites et focus sur le premier champ en erreur.
          - score: 3
            description: Explique ce qu’annonce un lecteur d’écran à chaque étape et le rôle des régions role="status".
      - id: submission
        description: Envoie une seule fois, traite les réponses du serveur et garde l’interface cohérente.
        maxScore: 3
        levels:
          - score: 0
            description: Pas de garde contre la double soumission, ou erreurs HTTP ignorées.
          - score: 1
            description: Garde ou traitement des erreurs présent, mais pas les deux, ou places restantes recalculées localement.
          - score: 2
            description: Garde, statut d’envoi, finally, erreurs de fields sous les bons champs, mise à jour depuis la réponse.
          - score: 3
            description: Discute disabled et aria-disabled, et explique pourquoi le serveur reste le dernier rempart contre les doublons.

- id: react-data-forms-avec-ia
  family: AVEC_IA
  title: Les prêts de la bibliothèque de quartier
  summary: Construire avec une IA une application React complète sur une API fournie, avec contexte, hooks personnalisés et tests, puis en défendre chaque choix.
  estimatedMinutes: 150
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu devras expliquer chaque ligne
    sans aide, prévoir l’effet de petites modifications et corriger toi-même un comportement.

    Objectif : une application React (projet Vite, modèle `react`, JavaScript) pour gérer les
    prêts d’une petite bibliothèque. L’API est fournie : place ce `server.js` à la racine du
    projet, lance-le avec `node server.js` et configure le proxy de Vite vers
    `http://localhost:3005`.

    ```js
    // server.js — API de prêts de livres, en mémoire, avec délais simulés
    import { createServer } from 'node:http';

    const port = Number(process.env.PORT ?? 3005);
    let nextId = 5;
    const books = [
      { id: 1, title: 'Le Petit Prince', author: 'Antoine de Saint-Exupéry', available: true, repair: false },
      { id: 2, title: 'Germinal', author: 'Émile Zola', available: false, repair: false },
      { id: 3, title: 'Candide', author: 'Voltaire', available: true, repair: true },
      { id: 4, title: 'Bel-Ami', author: 'Guy de Maupassant', available: true, repair: false },
    ];

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function send(response, status, data) {
      response.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8' });
      response.end(JSON.stringify(data));
    }

    async function readJson(request) {
      let text = '';
      for await (const chunk of request) text += chunk;
      return JSON.parse(text);
    }

    createServer(async (request, response) => {
      const url = new URL(request.url, 'http://localhost');
      console.log(`${request.method} ${url.pathname}${url.search}`);
      try {
        if (url.searchParams.get('fail') === '1') {
          await wait(300);
          return send(response, 500, { error: 'Erreur interne simulée' });
        }
        const match = url.pathname.match(/^\/api\/books\/(\d+)$/);
        const book = match && books.find((item) => item.id === Number(match[1]));
        if (url.pathname === '/api/books' && request.method === 'GET') {
          await wait(500);
          return send(response, 200, books);
        }
        if (url.pathname === '/api/books' && request.method === 'POST') {
          await wait(600);
          const data = await readJson(request);
          const title = typeof data.title === 'string' ? data.title.trim() : '';
          const author = typeof data.author === 'string' ? data.author.trim() : '';
          const fields = {};
          if (title.length < 2) fields.title = 'Titre trop court.';
          if (author.length < 2) fields.author = 'Auteur trop court.';
          if (Object.keys(fields).length > 0) return send(response, 400, { error: 'Données invalides', fields });
          if (books.some((b) => b.title.toLowerCase() === title.toLowerCase() && b.author === author)) {
            return send(response, 409, { error: 'Doublon', fields: { title: 'Ce livre est déjà au catalogue.' } });
          }
          const created = { id: nextId++, title, author, available: true, repair: false };
          books.push(created);
          return send(response, 201, created);
        }
        if (!match) return send(response, 404, { error: 'Route inconnue' });
        // Délai simulé : le livre n° 1 répond en 1,5 s, les autres en 0,3 s.
        await wait(request.method === 'GET' && book?.id === 1 ? 1500 : 300);
        if (!book) return send(response, 404, { error: 'Livre introuvable' });
        if (request.method === 'GET') return send(response, 200, book);
        if (request.method === 'PATCH') {
          if (book.repair) return send(response, 409, { error: 'Livre en réparation : prêt impossible.' });
          const data = await readJson(request);
          book.available = data.available === true;
          return send(response, 200, book);
        }
        return send(response, 405, { error: 'Méthode non autorisée' });
      } catch {
        return send(response, 400, { error: 'Requête invalide' });
      }
    }).listen(port, () => console.log(`API des prêts : http://localhost:${port}/api/books`));
    ```

    Fonctionnalités :

    1. **Catalogue** : la liste des livres est chargée au démarrage, avec états chargement,
       erreur (avec bouton « Réessayer ») et succès. Un filtre « Tous / Disponibles / Prêtés »
       et un compteur « N disponible(s) sur M » complètent la liste.
    2. **Fiche** : un clic sur un titre affiche la fiche du livre, chargée par
       `GET /api/books/:id`. Cliquer sur « Le Petit Prince » puis aussitôt sur un autre livre
       doit afficher la fiche du **dernier** livre choisi.
    3. **Prêt** : un bouton bascule « Prêté » (`aria-pressed`) change `available` par une mise
       à jour **optimiste** ; si le serveur refuse (essaie « Candide »), l’interface revient
       à l’état précédent et explique pourquoi.
    4. **Ajout** : un formulaire « Titre », « Auteur » contrôlé, validé, aux erreurs
       accessibles (y compris celles que renvoie le serveur), protégé contre la double
       soumission ; le livre créé apparaît dans la liste à partir de la réponse du serveur.
    5. **Bibliothécaire** : un contexte fournit la personne connectée (choix « Invité » ou
       « Bibliothécaire » dans l’en-tête, sans vraie authentification) ; seuls les
       bibliothécaires voient le formulaire d’ajout et les boutons « Prêté ».

    Contraintes :

    - au moins un hook personnalisé réutilisable (par exemple `useFetch`) et le contexte écrit
      avec la syntaxe de React 19 (`<MonContexte value={…}>`) ;
    - `StrictMode` conservé, `npm run lint` et `npm run build` sans erreur, console de
      développement sans avertissement ;
    - au moins **quatre tests** Vitest + Testing Library + user-event (environnement jsdom,
      `fetch` simulé) : un chargement en erreur, la fiche affichée après chargement, le
      formulaire (erreurs accessibles et double clic), le retour arrière d’un prêt refusé ;
    - pour **un** de ces tests, montre qu’il échoue quand on casse volontairement le code
      qu’il protège.

    Conseil : demande à l’IA de t’expliquer chaque effet qu’elle écrit (« quel système
    externe synchronise-t-il ? »), et vérifie toi-même les scénarios de course et de refus
    dans le navigateur avant de lui faire confiance.
  deliverable: |
    Colle le code des fichiers de `src/` que tu as créés ou modifiés (tests compris) et de
    `vite.config.js`, la sortie de `npx vitest run --reporter=verbose`, de `npm run lint` et de
    `npm run build`, puis :

    - le test que tu as fait échouer volontairement, la modification faite et le message
      d’échec obtenu ;
    - le résultat observé pour « Le Petit Prince puis un autre livre » et pour le prêt de
      « Candide » ;
    - quelques lignes sur ce que l’IA t’a apporté et ce que tu as dû corriger ou vérifier.
  rubric:
    passRatio: 0.7
    criteria:
      - id: code-ownership
        description: Explique chaque partie de son code sans hésitation ni aide.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas expliquer des parties importantes de son propre code.
          - score: 1
            description: Explique le déroulé général mais pas les effets, les nettoyages ou les mises à jour d’état.
          - score: 2
            description: Explique précisément effets, dépendances, gestionnaires asynchrones et mises à jour.
          - score: 3
            description: Explique aussi ce qu’il a refusé ou corrigé dans les propositions de l’IA, et pourquoi.
      - id: data-consistency
        description: Garde l’interface fidèle au serveur pendant les chargements et les modifications.
        maxScore: 3
        levels:
          - score: 0
            description: Course non traitée, erreurs HTTP ignorées ou mise à jour optimiste sans retour arrière.
          - score: 1
            description: Un des mécanismes (annulation, test de response.ok, retour arrière) manque ou est mal expliqué.
          - score: 2
            description: Annulation, erreurs HTTP, réponse du serveur appliquée, retour arrière ciblé avec formes fonctionnelles.
          - score: 3
            description: Compare recharger, appliquer la réponse et optimiste, et prédit le comportement si on retire un mécanisme.
      - id: context-and-hooks
        description: Utilise un contexte et des hooks personnalisés à bon escient.
        maxScore: 3
        levels:
          - score: 0
            description: Pas de contexte ni de hook, ou règles des hooks enfreintes.
          - score: 1
            description: Contexte et hook présents mais mal justifiés, ou syntaxe obsolète sans le savoir.
          - score: 2
            description: Contexte en syntaxe React 19 protégé par un hook, hook personnalisé réutilisable, règles de nommage respectées.
          - score: 3
            description: Explique les limites du contexte (re-rendus, dépendance cachée, aucune sécurité) et quand un hook ne s’impose pas.
      - id: tests
        description: Écrit des tests orientés utilisateur qui échouent vraiment quand le code est faux.
        maxScore: 3
        levels:
          - score: 0
            description: Tests absents, ou qui passent sans rien vérifier.
          - score: 1
            description: Tests présents mais requêtes fragiles, await oubliés ou doublures non restaurées.
          - score: 2
            description: Requêtes par rôle et libellé, findBy attendus, fetch simulé et restauré, un test vu en échec.
          - score: 3
            description: Explique pourquoi une doublure instantanée rend un test de double clic inutile et comment le rendre probant.

- id: react-data-forms-contre-ia
  family: CONTRE_IA
  title: Le tableau de tâches qui charge sans fin
  summary: Trouver et corriger les défauts d’un hook de chargement, d’un composant et de ses tests générés par une IA, dont certains n’apparaissent qu’avec des scénarios précis.
  estimatedMinutes: 90
  instructions: |
    Un assistant a généré ce petit gestionnaire de tâches : une API, un hook `useApi`, un
    composant `TaskBoard` et ses tests. Règles attendues : choisir un projet, voir ses tâches
    et le nombre de tâches terminées, cocher ou décocher une tâche (le serveur refuse de
    modifier une tâche archivée), ajouter une tâche (3 caractères minimum). Les tests doivent
    protéger ces comportements.

    Crée un projet Vite (modèle `react`), installe les outils de test :

    ```bash
    npm install --save-dev vitest jsdom @testing-library/react @testing-library/dom @testing-library/user-event
    ```

    puis ajoute les fichiers suivants.

    `server.js`, à la racine, lancé avec `node server.js` :

    ```js
    // server.js — API de tâches en mémoire, avec délais simulés
    import { createServer } from 'node:http';

    const port = Number(process.env.PORT ?? 3002);

    let nextId = 5;
    const tasks = [
      { id: 1, project: 'site', title: 'Écrire la page d’accueil', done: false, archived: false },
      { id: 2, project: 'site', title: 'Choisir les couleurs', done: true, archived: false },
      { id: 3, project: 'appli', title: 'Maquetter la connexion', done: false, archived: false },
      { id: 4, project: 'appli', title: 'Ancien logo', done: true, archived: true },
    ];

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function send(response, status, data) {
      response.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8' });
      response.end(JSON.stringify(data));
    }

    async function readJson(request) {
      let text = '';
      for await (const chunk of request) text += chunk;
      return JSON.parse(text);
    }

    createServer(async (request, response) => {
      const url = new URL(request.url, 'http://localhost');
      console.log(`${request.method} ${url.pathname}${url.search}`);
      try {
        if (url.searchParams.get('fail') === '1') {
          await wait(300);
          return send(response, 500, { error: 'Erreur interne simulée' });
        }
        const match = url.pathname.match(/^\/api\/tasks\/(\d+)$/);
        if (url.pathname === '/api/tasks' && request.method === 'GET') {
          const project = url.searchParams.get('project');
          await wait(project === 'site' ? 1200 : 200); // le projet « site » est lent
          return send(response, 200, tasks.filter((task) => task.project === project));
        }
        if (url.pathname === '/api/tasks' && request.method === 'POST') {
          await wait(300);
          const data = await readJson(request);
          const title = typeof data.title === 'string' ? data.title.trim() : '';
          if (title.length < 3 || !['site', 'appli'].includes(data.project)) {
            return send(response, 400, { error: 'Titre de 3 caractères minimum et projet connu requis.' });
          }
          const task = { id: nextId++, project: data.project, title, done: false, archived: false };
          tasks.push(task);
          return send(response, 201, task);
        }
        if (match && request.method === 'PATCH') {
          await wait(300);
          const task = tasks.find((item) => item.id === Number(match[1]));
          if (!task) return send(response, 404, { error: 'Tâche introuvable.' });
          if (task.archived) return send(response, 403, { error: 'Tâche archivée : modification impossible.' });
          const data = await readJson(request);
          task.done = data.done === true;
          return send(response, 200, task);
        }
        return send(response, 404, { error: 'Route inconnue.' });
      } catch {
        return send(response, 400, { error: 'Requête invalide.' });
      }
    }).listen(port, () => console.log(`API des tâches : http://localhost:${port}/api/tasks`));
    ```

    `vite.config.js` :

    ```js
    import react from '@vitejs/plugin-react';
    import { defineConfig } from 'vitest/config';

    export default defineConfig({
      plugins: [react()],
      server: {
        proxy: {
          '/api': 'http://localhost:3002',
        },
      },
      test: {
        environment: 'jsdom',
        setupFiles: ['./src/test/setup.js'],
      },
    });
    ```

    `src/test/setup.js` :

    ```js
    // src/test/setup.js — exécuté avant chaque fichier de test
    import { cleanup } from '@testing-library/react';
    import { afterEach, vi } from 'vitest';

    afterEach(() => {
      cleanup(); // démonte ce que render a affiché
      vi.unstubAllGlobals(); // rend le vrai fetch après chaque test
    });
    ```

    `src/main.jsx` :

    ```jsx
    import { StrictMode } from 'react';
    import { createRoot } from 'react-dom/client';
    import TaskBoard from './TaskBoard.jsx';

    createRoot(document.getElementById('root')).render(
      <StrictMode>
        <TaskBoard />
      </StrictMode>,
    );
    ```

    `src/useApi.js` :

    ```js
    import { useEffect, useState } from 'react';

    // Hook générique pour charger des données depuis l’API.
    export function useApi(url, options = {}) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        setLoading(true);
        fetch(url, options)
          .then((res) => res.json())
          .then((json) => {
            setData(json);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message);
            setLoading(false);
          });
      }, [url, options]);

      return { data, setData, loading, error };
    }
    ```

    `src/TaskBoard.jsx` :

    ```jsx
    import { useEffect, useState } from 'react';
    import { useApi } from './useApi.js';

    function TaskBoard() {
      const [project, setProject] = useState('site');
      const {
        data: tasks,
        setData: setTasks,
        loading,
        error,
      } = useApi(`/api/tasks?project=${project}`, { headers: { Accept: 'application/json' } });
      const [doneCount, setDoneCount] = useState(0);
      const [title, setTitle] = useState('');
      const [formError, setFormError] = useState('');

      useEffect(() => {
        if (tasks) {
          setDoneCount(tasks.filter((task) => task.done).length);
        }
      }, [tasks]);

      async function toggleTask(task) {
        // Mise à jour optimiste pour une interface réactive
        setTasks(tasks.map((t) => (t.id === task.id ? { ...t, done: !t.done } : t)));
        try {
          await fetch(`/api/tasks/${task.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ done: !task.done }),
          });
        } catch (err) {
          console.error('Erreur lors de la mise à jour', err);
        }
      }

      async function handleSubmit(event) {
        event.preventDefault();
        if (title.trim().length < 3) {
          setFormError('Titre invalide');
          return;
        }
        setFormError('');
        await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project, title }),
        });
        setTasks([...tasks, { id: Date.now(), project, title, done: false }]);
        setTitle('');
      }

      return (
        <main>
          <h1>Tâches</h1>
          <label htmlFor="project">Projet</label>
          <select id="project" value={project} onChange={(event) => setProject(event.target.value)}>
            <option value="site">Site vitrine</option>
            <option value="appli">Application mobile</option>
          </select>
          {loading && <p>Chargement…</p>}
          {error && <p className="error">{error}</p>}
          {tasks && (
            <>
              <p>
                {doneCount} / {tasks.length} terminée(s)
              </p>
              <ul>
                {tasks.map((task) => (
                  <li key={task.id}>
                    <label>
                      <input type="checkbox" checked={task.done} onChange={() => toggleTask(task)} />{' '}
                      {task.title}
                    </label>
                  </li>
                ))}
              </ul>
            </>
          )}
          <form onSubmit={handleSubmit}>
            <input
              placeholder="Nouvelle tâche"
              value={title}
              onChange={(event) => setTitle(event.target.value)}
              className={formError ? 'invalid' : ''}
            />
            <span className="error">{formError}</span>
            <button type="submit">Ajouter</button>
          </form>
        </main>
      );
    }

    export default TaskBoard;
    ```

    `src/TaskBoard.test.jsx` :

