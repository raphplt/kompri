    `src/App.test.jsx` :

    ```jsx
    import { render, screen } from '@testing-library/react';
    import { it, vi } from 'vitest';
    import App from './App.jsx';

    function jsonResponse(status, data) {
      return new Response(JSON.stringify(data), {
        status,
        headers: { 'Content-Type': 'application/json' },
      });
    }

    it('affiche les réservations du jour', async () => {
      vi.stubGlobal(
        'fetch',
        vi.fn().mockResolvedValue(
          jsonResponse(200, [
            { id: 1, day: 'lundi', time: '09:00', room: 'Salle Verte', owner: 'Inès', locked: false },
          ]),
        ),
      );
      render(<App />);
      screen.findByText('09:00 — Salle Verte (Inès)');
    });
    ```

    Tickets à traiter :

    1. **Signalement** : « Quand je clique sur mardi juste après avoir ouvert l’application,
       je vois un moment les réservations de mardi, puis celles de lundi s’affichent sous le
       titre “Réservations du mardi”. »
    2. **Signalement** : « J’ai annulé ma réservation de mardi 10:00, l’application m’a dit
       “Réservation de 10:00 annulée.”, mais elle est revenue quand j’ai rouvert mardi. »
       (L’accueil confirme : les réservations validées par l’accueil ne peuvent pas être
       annulées en ligne.)
    3. **Évolution** : la personne connectée (`currentUser`) traverse `DayView` et
       `BookingList`, qui ne s’en servent pas, pour arriver à `BookingItem`. Remplace cette
       transmission par un contexte, prêt à accueillir plus tard la vraie connexion.
    4. **Tests** : la suite de tests doit protéger les tickets 1 et 2. Pour le ticket 2, écris
       d’abord un test qui **échoue** sur le code actuel, puis corrige.

    Contraintes : JavaScript, `StrictMode` conservé, pas de bibliothèque supplémentaire,
    `npm run lint` sans erreur, mêmes textes affichés qu’aujourd’hui sauf pour les nouveaux
    messages d’erreur.
  deliverable: |
    Pour chaque ticket : la cause trouvée (fichier, ligne, explication), les fichiers modifiés
    (code complet de chaque fichier modifié), et la preuve (scénario dans le navigateur ou
    test). Ajoute la sortie de `npx vitest run --reporter=verbose` **avant** la correction du
    ticket 2 (avec ton nouveau test en échec) et **après**, puis tout autre défaut que tu as
    remarqué en chemin, corrigé ou non, avec ta justification.
  rubric:
    passRatio: 0.7
    criteria:
      - id: diagnosis
        description: Remonte de chaque signalement à sa cause précise dans le code.
        maxScore: 3
      - id: minimal-fix
        description: Corrige et fait évoluer le code existant sans le régénérer.
        maxScore: 3
      - id: tests
        description: Prouve les corrections par des tests vus en échec puis en succès.
        maxScore: 3
      - id: oral-change
        description: Réalise ou décrit correctement une modification demandée pendant l’oral.
        maxScore: 2
