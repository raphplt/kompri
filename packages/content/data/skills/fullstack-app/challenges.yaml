- id: fullstack-app-sans-ia
  family: SANS_IA
  title: Le carnet de prêts entre voisins
  summary: Concevoir seul l’architecture et le contrat d’une petite application, puis écrire et tester son module d’état d’interface.
  estimatedMinutes: 60
  instructions: |
    Une association de quartier veut une application où chaque voisin inscrit liste les
    objets qu’il **prête** (perceuse, échelle…) et note à qui et jusqu’à quand. Chaque voisin
    ne voit et ne gère que ses propres objets. Tu travailles seul, sans IA, sans écrire le
    serveur : ce défi porte sur la conception et sur la logique de l’interface.

    1. **Architecture** (texte ou schéma en `text`) : les trois couches, ce qui est servi par
       qui, l’origine unique, et trois décisions justifiées (avec leur coût).
    2. **Contrat d’API** sous forme de tableau : au moins six routes (comptes compris) avec
       méthode, chemin, corps, succès et erreurs principales. Un objet est représenté par
       `{ id, name, borrower, due_on, created_at }` ; `borrower` vaut `null` quand l’objet est
       disponible, `due_on` est une date `AAAA-MM-JJ` ou `null`.
    3. **Migration** `001_init.sql` pour les objets (on suppose la table `users` existante) :
       types, contraintes et clé étrangère justifiés.
    4. **`public/state.js`** : module ES sans DOM ni réseau, qui exporte :
       - `initialState`, avec un `status` parmi `loading`, `anonymous`, `ready`, `failed` ;
       - `upsertItem(items, item)` et `removeItem(items, id)`, qui ne modifient jamais le
         tableau reçu ;
       - `visibleItems(items, filter)`, où `filter` vaut `all`, `available` ou `lent` ;
       - `isOverdue(item, today)`, vrai si l’objet est prêté et que `due_on` est **avant**
         `today` (deux chaînes `AAAA-MM-JJ`) ;
       - `summaryLabel(items)` : « Aucun objet prêté », « 1 objet prêté » ou « N objets
         prêtés ».
    5. **`test/state.test.js`** avec `node:test` : au moins six tests, dont les cas limites
       (échéance le jour même, objet disponible avec une date, tableau vide, immutabilité).
  deliverable: |
    Colle l’architecture, le contrat, la migration, `state.js`, `state.test.js` et la sortie
    de `node --test test/state.test.js`.
  rubric:
    passRatio: 0.7
    criteria:
      - id: architecture
        description: Décrit une architecture cohérente et justifie ses décisions par leurs raisons et leurs coûts.
        maxScore: 3
        levels:
          - score: 0
            description: Architecture absente ou confuse (couches mélangées, base exposée au navigateur).
          - score: 1
            description: Trois couches décrites mais décisions non justifiées.
          - score: 2
            description: Décisions justifiées, conséquences de l’origine unique expliquées.
          - score: 3
            description: Compare des alternatives et prévoit l’effet d’un changement d’origine.
      - id: contract-data
        description: Produit un contrat d’API et un schéma sûrs et cohérents entre eux.
        maxScore: 3
        levels:
          - score: 0
            description: Contrat incomplet ou qui laisse le client choisir le propriétaire.
          - score: 1
            description: Routes présentes mais codes d’erreur ou contraintes incohérents.
          - score: 2
            description: Contrat complet, erreurs justes, migration avec clé étrangère, cascade et contraintes.
          - score: 3
            description: Justifie chaque contrainte et anticipe les cas limites (échéance sans emprunteur).
      - id: state-tests
        description: Écrit des fonctions d’état pures et les teste sur les cas limites.
        maxScore: 3
        levels:
          - score: 0
            description: Fonctions qui modifient leurs entrées ou tests absents.
          - score: 1
            description: Fonctions correctes mais tests limités au cas nominal.
          - score: 2
            description: Fonctions pures, tests des cas limites et de l’immutabilité.
          - score: 3
            description: Explique pourquoi la date du jour est un paramètre et modifie le module en direct sans régression.

- id: fullstack-app-avec-ia
  family: AVEC_IA
  title: Le suivi de lectures, de bout en bout
  summary: Construire avec une IA une application full-stack complète et prête pour la production, puis la défendre couche par couche.
  estimatedMinutes: 240
  instructions: |
    Tu peux utiliser une IA autant que tu veux. À l’oral, tu expliqueras chaque couche sans
    aide, tu justifieras l’architecture et tu modifieras le projet en direct.

    Objectif : **Mes lectures**, une application où chaque utilisateur suit ses livres : titre,
    auteur, statut (`to-read`, `reading`, `done`), note facultative de 1 à 5. Pile imposée :
    HTML, CSS et JavaScript sans framework, Node.js 24, Express 5, PostgreSQL, `pg`,
    `node:test`.

    Exigences :

    1. **Architecture** : interface servie par Express sur la même origine que l’API ;
       organisation du projet par responsabilités ; `createApp` séparé du démarrage.
    2. **API** : comptes (inscription, connexion, déconnexion, utilisateur courant) avec scrypt
       et sessions en base ; CRUD des livres limité au propriétaire ; filtre par statut ;
       validation stricte ; erreurs `{ error }` en JSON, 404 JSON pour les routes d’API
       inconnues.
    3. **Interface** : états `loading`, `anonymous`, `ready`, `failed`, plus `busy` et `error` ;
       un module d’appels à l’API qui gère `response.ok`, le 204 et un délai maximal ; rendu
       sans `innerHTML` ; accessible au clavier ; utilisable sur un écran de 375 pixels.
    4. **Configuration** : variables d’environnement validées au démarrage, `.env.example`
       versionné, scripts npm `start`, `dev`, `db:migrate`, `test`, migrations versionnées.
    5. **Tests** : un parcours de bout en bout par l’API, des tests à deux utilisateurs, des
       tests unitaires des fonctions d’état ; base de test dédiée protégée par un garde-fou.
    6. **Production** : en-têtes de sécurité, vérification d’origine, journaux JSON sans
       données sensibles, route de santé, arrêt propre sur `SIGTERM`, procédure de
       sauvegarde et de restauration écrite et essayée.
  deliverable: |
    Colle l’arborescence du projet, le contenu des fichiers (tu peux regrouper les fichiers
    très proches du cours en indiquant ce qui change), la sortie de `npm test`, la sortie
    d’une sauvegarde puis d’une restauration vérifiée, et une page de notes : décisions
    d’architecture, ce que l’IA a proposé et que tu as refusé ou corrigé, limites connues.
  rubric:
    passRatio: 0.7
    criteria:
      - id: architecture
        description: Explique l’architecture et suit le parcours complet d’une action à travers les couches.
        maxScore: 3
        levels:
          - score: 0
            description: Ne sait pas relier l’interface, l’API et la base.
          - score: 1
            description: Décrit les couches mais pas le chemin d’une requête.
          - score: 2
            description: Suit une action du clic à la base et retour, ordre des middlewares compris.
          - score: 3
            description: Justifie les décisions et leurs coûts, et ce que l’IA proposait d’autre.
      - id: interface-states
        description: Gère les états de l’interface et l’appel à l’API de façon robuste et accessible.
        maxScore: 3
        levels:
          - score: 0
            description: Cas heureux seulement, ou innerHTML avec des données.
          - score: 1
            description: Chargement et erreur gérés partiellement.
          - score: 2
            description: Tous les états gérés, 401 et serveur injoignable compris, rendu sûr et accessible.
          - score: 3
            description: Prévoit correctement l’affichage dans un scénario d’échec proposé à l’oral.
      - id: testing
        description: Teste les parcours essentiels et les règles de sécurité de façon fiable.
        maxScore: 2
        levels:
          - score: 0
            description: Tests absents, ou sur la base de développement.
          - score: 1
            description: Tests présents mais sans deux utilisateurs ou sans parcours complet.
          - score: 2
            description: Parcours, isolation et fonctions d’état testés, base protégée, régression démontrable.
      - id: production
        description: Prépare la mise en production et sait l’expliquer.
        maxScore: 2
        levels:
          - score: 0
            description: Configuration en dur ou secrets dans le dépôt.
          - score: 1
            description: Configuration correcte mais journaux, santé ou sauvegardes absents.
          - score: 2
            description: Configuration validée, journaux sûrs, santé, arrêt propre, sauvegarde restaurée.

- id: fullstack-app-contre-ia
  family: CONTRE_IA
  title: Le budget du mois
  summary: Auditer une petite application full-stack générée par une IA et corriger ses défauts de l’interface jusqu’à la base.
  estimatedMinutes: 100
  instructions: |
    Un assistant a généré une application de suivi des dépenses. Elle « marche » sur la
    machine de son auteur. Avant de l’utiliser pour de vrai, tu dois en faire la revue complète :
    interface, API, base, tests, configuration.

    Les modules `auth.js`, `sessions.js`, `password.js`, `login-limiter.js` et
    `routes/auth.js` sont ceux du cours (compétence Authentification et projet Tâches) : ils
    sont corrects et hors du périmètre de la revue.

    Schéma :

    ```sql
    CREATE TABLE users (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      email text NOT NULL UNIQUE,
      password_hash text NOT NULL
    );
    CREATE TABLE sessions (
      token_hash text PRIMARY KEY,
      user_id integer NOT NULL REFERENCES users (id) ON DELETE CASCADE,
      created_at timestamptz NOT NULL DEFAULT now(),
      expires_at timestamptz NOT NULL
    );
    CREATE TABLE expenses (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      owner_id integer NOT NULL REFERENCES users (id) ON DELETE CASCADE,
      label text NOT NULL,
      amount real NOT NULL,
      spent_on date NOT NULL
    );
    ```

    `server.js` :

    ```js
    import express from 'express';
    import pg from 'pg';
    import { loadUser, requireAuth } from './auth.js';
    import { authRouter } from './routes/auth.js';

    const pool = new pg.Pool({
      connectionString: process.env.DATABASE_URL || 'postgres://postgres:postgres@localhost:5432/budget',
    });

    const app = express();
    app.use(express.json());
    app.use((req, res, next) => {
      console.log(new Date().toISOString(), req.method, req.url, JSON.stringify(req.body ?? {}));
      next();
    });
    app.use(loadUser(pool));
    app.use(express.static('public'));
    app.use('/api/auth', authRouter({ pool, secureCookies: false, log: console.log }));

    app.get('/api/expenses', requireAuth, async (req, res) => {
      const month = req.query.month || new Date().toISOString().slice(0, 7);
      const result = await pool.query(
        `SELECT id, label, amount, spent_on FROM expenses
         WHERE owner_id = $1 AND to_char(spent_on, 'YYYY-MM') = $2
         ORDER BY spent_on DESC`,
        [req.user.id, month],
      );
      res.json(result.rows);
    });

    app.post('/api/expenses', requireAuth, async (req, res) => {
      const { label, amount, spentOn } = req.body;
      const result = await pool.query(
        `INSERT INTO expenses (owner_id, label, amount, spent_on)
         VALUES ($1, $2, $3, $4) RETURNING id, label, amount, spent_on`,
        [req.user.id, label, Number(amount), spentOn],
      );
      res.status(201).json(result.rows[0]);
    });

    app.delete('/api/expenses/:id', requireAuth, async (req, res) => {
      await pool.query('DELETE FROM expenses WHERE id = $1', [req.params.id]);
      res.status(204).end();
    });

    app.use((err, req, res, next) => {
      console.error(err);
      res.status(500).json({ error: err.message });
    });

    app.listen(3000, () => console.log('Budget sur http://localhost:3000'));
    ```

    `public/app.js`, chargé par une page qui contient une liste `#expenses`, un paragraphe
    `#total` et un formulaire `#expense-form` (champs `label`, `amount`, `spentOn` de type
    `date`) :

    ```js
    const list = document.querySelector('#expenses');
    const total = document.querySelector('#total');
    const form = document.querySelector('#expense-form');

    async function loadExpenses() {
      const response = await fetch('/api/expenses');
      const expenses = await response.json();
      list.innerHTML = expenses
        .map((e) => `<li>${e.spent_on.slice(0, 10)} — ${e.label} : ${e.amount} €
          <button data-id="${e.id}">×</button></li>`)
        .join('');
      const sum = expenses.reduce((acc, e) => acc + e.amount, 0);
      total.textContent = `Total du mois : ${sum} €`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      form.reset();
      loadExpenses();
    });

    list.addEventListener('click', async (event) => {
      if (!event.target.dataset.id) return;
      await fetch(`/api/expenses/${event.target.dataset.id}`, { method: 'DELETE' });
      loadExpenses();
    });

    loadExpenses();
    ```

    `test/expenses.test.js`, lancé avec `node --test` pendant que le serveur tourne :

    ```js
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    import pg from 'pg';

    const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
    const BASE = 'http://localhost:3000';
    const COOKIE = process.env.TEST_COOKIE; // copié depuis le navigateur après connexion

    test('ajouter une dépense', async () => {
      await pool.query('DELETE FROM expenses');
      const response = await fetch(`${BASE}/api/expenses`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Cookie: COOKIE },
        body: JSON.stringify({ label: 'Courses', amount: '42.10', spentOn: '2026-11-03' }),
      });
      assert.ok(response.ok);
    });

    test('lister les dépenses du mois', async () => {
      const response = await fetch(`${BASE}/api/expenses?month=2026-11`, { headers: { Cookie: COOKIE } });
      const expenses = await response.json();
      assert.equal(expenses.length, 1);
      await pool.end();
    });
    ```

    Travail demandé :

    1. Liste chaque défaut : fichier, ligne, scénario qui le révèle (entrée, configuration ou
       fuseau horaire), conséquence, gravité. Classe-les par couche.
    2. Reproduis au moins quatre défauts et montre la sortie obtenue.
    3. Corrige l’application : code complet des fichiers modifiés, migration si le schéma
       change (on suppose la base déjà utilisée : pas de réécriture de la première migration).
    4. Remplace le fichier de test par des tests fiables (base dédiée, application démarrée par
       le test, deux utilisateurs).
  deliverable: |
    Colle ton tableau de défauts par couche, les reproductions (commandes et sorties), les
    fichiers corrigés, la migration, les nouveaux tests et la sortie de `node --test`.
  rubric:
    passRatio: 0.7
    criteria:
      - id: defects-found
        description: Identifie les défauts dans toutes les couches, y compris les plus discrets.
        maxScore: 4
      - id: root-cause
        description: Explique la cause technique des défauts non évidents.
        maxScore: 3
      - id: fixes
        description: Corrige sans régression et en respectant les migrations existantes.
        maxScore: 3
      - id: tests
        description: Remplace les tests par une suite fiable et isolée.
        maxScore: 2

- id: fullstack-app-apres-ia
  family: APRES_IA
  title: Les échéances du projet Tâches
  summary: Dépanner le projet Tâches du cours puis lui ajouter une date d’échéance, de la base jusqu’à l’interface, sans le réécrire.
  estimatedMinutes: 150
  instructions: |
    Tu reprends le projet **Tâches** construit dans les leçons de cette compétence. Une
    personne de l’équipe l’a modifié avec une IA. Tous les fichiers sont ceux des leçons, sauf
    `src/routes/tasks.js`, reproduit ici en entier. `public/state.js` est rappelé pour
    référence.

    `src/routes/tasks.js` :

    ```js
    // src/routes/tasks.js — tâches de l’utilisateur connecté, et seulement les siennes
    import express from 'express';
    import { requireAuth } from '../auth.js';

    const filters = new Map([
      ['all', ''],
      ['open', 'AND done = false'],
      ['done', 'AND done = true'],
    ]);

    function parseId(value) {
      return /^[1-9][0-9]{0,9}$/.test(value) ? Number(value) : null;
    }

    function readTitle(body) {
      const title = String(body?.title ?? '').trim();
      return title.length >= 1 && title.length <= 200 ? title : null;
    }

    export function tasksRouter({ pool }) {
      const router = express.Router();
      router.use(requireAuth); // toutes les routes de ce routeur exigent une session

      router.get('/', async (req, res) => {
        const status = String(req.query.status ?? 'all');
        if (!filters.has(status)) {
          return res.status(400).json({ error: 'status doit valoir all, open ou done' });
        }
        const result = await pool.query(
          `SELECT id, title, done, created_at FROM tasks
           WHERE owner_id = $1 ${filters.get(status)}
           ORDER BY done, created_at DESC, id DESC`,
          [req.user.id],
        );
        res.json(result.rows);
      });

      router.post('/', async (req, res) => {
        const title = readTitle(req.body);
        if (!title) return res.status(400).json({ error: 'Le titre doit contenir de 1 à 200 caractères' });
        const result = await pool.query(
          `INSERT INTO tasks (owner_id, title) VALUES ($1, $2)
           RETURNING id, title, done, created_at`,
          [req.user.id, title],
        );
        res.status(201).json(result.rows[0]);
      });

      router.patch('/:id', async (req, res) => {
        const id = parseId(req.params.id);
        const changes = {};
        if (req.body?.title !== undefined) {
          changes.title = readTitle(req.body);
          if (!changes.title) {
            return res.status(400).json({ error: 'Le titre doit contenir de 1 à 200 caractères' });
          }
        }
        if (req.body?.done !== undefined) {
          if (typeof req.body.done !== 'boolean') {
            return res.status(400).json({ error: 'done doit être un booléen' });
          }
          changes.done = req.body.done;
        }
        if (Object.keys(changes).length === 0) {
          return res.status(400).json({ error: 'Rien à modifier' });
        }
        // COALESCE garde la valeur actuelle quand le champ n’est pas fourni
        const result = await pool.query(
          `UPDATE tasks SET title = COALESCE($1, title), done = COALESCE($2, done)
           WHERE id = $3 AND owner_id = $4
           RETURNING id, title, done, created_at`,
          [changes.title || null, changes.done || null, id, req.user.id],
        );
        if (result.rowCount === 0) return res.status(404).json({ error: 'Tâche introuvable' });
        res.json(result.rows[0]);
      });

      router.delete('/:id', async (req, res) => {
        const result = await pool.query('DELETE FROM tasks WHERE id = $1 AND owner_id = $2', [
          parseId(req.params.id),
          req.user.id,
        ]);
        if (result.rowCount === 0) return res.status(404).json({ error: 'Tâche introuvable' });
        res.status(204).end();
      });

      return router;
    }
    ```

    `public/state.js` (identique à la leçon 3) :

    ```js
    // public/state.js — l’état de l’interface et des fonctions pures pour le transformer
    export const initialState = Object.freeze({
      status: 'loading', // 'loading' | 'anonymous' | 'ready' | 'failed'
      user: null,
      tasks: [],
      filter: 'all', // 'all' | 'open' | 'done'
      error: null,
      busy: false,
    });

    // Tâches à faire d’abord, puis les plus récentes en premier (comme l’API)
    export function sortTasks(tasks) {
      return tasks.toSorted(
        (a, b) =>
          Number(a.done) - Number(b.done) ||
          b.created_at.localeCompare(a.created_at) ||
          b.id - a.id,
      );
    }

    export function upsertTask(tasks, task) {
      const others = tasks.filter((existing) => existing.id !== task.id);
      return sortTasks([...others, task]);
    }

    export function removeTask(tasks, id) {
      return tasks.filter((task) => task.id !== id);
    }

    export function visibleTasks(tasks, filter) {
      if (filter === 'open') return tasks.filter((task) => !task.done);
      if (filter === 'done') return tasks.filter((task) => task.done);
      return tasks;
    }

    export function remainingLabel(tasks) {
      const count = tasks.filter((task) => !task.done).length;
      if (count === 0) return 'Aucune tâche restante';
      return count === 1 ? '1 tâche restante' : `${count} tâches restantes`;
    }
    ```

    Demandes :

    1. **Bug signalé** : « depuis la dernière version, on ne peut plus décocher une tâche
       terminée : la case se recoche toute seule ». Reproduis le bug avec `curl`, explique
       sa cause exacte et pourquoi l’interface « recoche » la case, corrige-le, et ajoute un
       test de non-régression. Explique pourquoi les tests existants ne l’ont pas vu.
    2. **Date d’échéance** facultative, de bout en bout :
       - nouvelle migration `002_due_on.sql` ;
       - l’API accepte `due_on` (`AAAA-MM-JJ` d’une date réelle, ou `null` pour l’effacer) en
         création et en modification, refuse le reste avec 400, et renvoie toujours `due_on`
         sous forme de chaîne `AAAA-MM-JJ` ou `null`, quel que soit le fuseau du serveur ;
       - dans `state.js`, une fonction pure `isLate(task, today)` : vraie si la tâche n’est pas
         terminée et que son échéance est passée ;
       - dans l’interface, un champ `date` facultatif à l’ajout, l’échéance affichée au format
         `JJ/MM/AAAA` et une classe `late` pour les tâches en retard, avec un texte visible (pas
         seulement une couleur) ;
       - tests : validation des dates, isolation conservée, `isLate` sur ses cas limites.
    3. **Mise à jour du contrat** d’API (le tableau de la leçon 1) et de la procédure de
       déploiement : dans quel ordre appliquer cette version en production ?
  deliverable: |
    Colle la reproduction du bug (avant et après), l’explication, la migration, les fichiers
    modifiés en entier, les nouveaux tests, la sortie de `npm test`, le contrat mis à jour et
    la procédure de déploiement.
  rubric:
    passRatio: 0.7
    criteria:
      - id: bug-fix
        description: Diagnostique le bug à partir de || et COALESCE et le verrouille par un test.
        maxScore: 3
      - id: feature-layers
        description: Ajoute l’échéance proprement dans chaque couche, de la migration à l’interface.
        maxScore: 4
      - id: delivery
        description: Fait évoluer le projet sans le réécrire et prépare son déploiement.
        maxScore: 3
